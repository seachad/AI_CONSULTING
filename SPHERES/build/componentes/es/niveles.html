<figure class="grafico">
  <div class="g-titulo">Tres niveles de ambición</div>
  <div class="g-sub">Tres tipos de apuesta, no una escalera: la inversión, la incertidumbre y la resistencia organizativa crecen de izquierda a derecha</div>
  <div class="g-lienzo ancho">
<svg viewBox="0 0 900 430" role="img" aria-label="Comparación de los niveles de ambición Optimizar, Aumentar y Transformar por valor, inversión, incertidumbre, resistencia organizativa y quién decide">
  <g>
    <rect x="170" y="0" width="236" height="120" fill="#0f5499"/>
    <rect x="414" y="0" width="236" height="120" fill="#0d7680"/>
    <rect x="658" y="0" width="236" height="120" fill="#593380"/>
  </g>
  <g text-anchor="middle">
    <text x="288" y="40" class="sv-blanco sv-serif" font-size="23" font-weight="700">Optimizar</text>
    <text x="288" y="70" class="sv-blanco" font-size="13.5">Hacer lo mismo más rápido,</text>
    <text x="288" y="90" class="sv-blanco" font-size="13.5">más barato o con menos errores</text>
    <text x="532" y="40" class="sv-blanco sv-serif" font-size="23" font-weight="700">Aumentar</text>
    <text x="532" y="70" class="sv-blanco" font-size="13.5">Las personas hacen</text>
    <text x="532" y="90" class="sv-blanco" font-size="13.5">lo que antes no podían</text>
    <text x="776" y="40" class="sv-blanco sv-serif" font-size="23" font-weight="700">Transformar</text>
    <text x="776" y="70" class="sv-blanco" font-size="13.5">Cambia qué se ofrece, cómo se</text>
    <text x="776" y="90" class="sv-blanco" font-size="13.5">compite o cómo se organiza</text>
  </g>

  <rect x="0" y="132" width="894" height="54" class="sv-panel"/>

  <rect x="0" y="364" width="894" height="54" class="sv-panel"/>

  <g font-size="14.5" font-weight="700">
    <text x="12" y="164" class="sv-t">Valor principal</text>
    <text x="12" y="222" class="sv-t">Inversión</text>
    <text x="12" y="280" class="sv-t">Incertidumbre</text>
    <text x="12" y="330" class="sv-t">Resistencia</text>
    <text x="12" y="348" class="sv-t">organizativa</text>
    <text x="12" y="396" class="sv-t">Quién decide</text>
  </g>

  <g text-anchor="middle" font-size="13.5">
    <text x="288" y="164" class="sv-t">Coste evitado</text>
    <text x="532" y="164" class="sv-t">Coste y rendimiento</text>
    <text x="776" y="156" class="sv-t">Nuevos ingresos y</text>
    <text x="776" y="174" class="sv-t">modelo operativo</text>
    <text x="288" y="396" class="sv-t">Dirección del área</text>
    <text x="532" y="388" class="sv-t">Dirección, con el</text>

    <text x="776" y="388" class="sv-t">Consejo o</text>
    <text x="776" y="406" class="sv-t">alta dirección</text>
  </g>
