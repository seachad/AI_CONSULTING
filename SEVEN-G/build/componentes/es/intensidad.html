<figure class="grafico">
  <div class="g-titulo">Determinación de la intensidad</div>
  <div class="g-sub">Se evalúa en la fase 0 y se revisa en G3 y en cada revisión de continuidad. Basta un «sí» para aplicar Enterprise; Express solo si, además, se cumple su elegibilidad (01 §9.4)</div>
  <div class="g-lienzo ancho">
<svg viewBox="0 0 980 596" role="img" aria-label="Árbol de decisión para determinar la intensidad Express, Lite o Enterprise de una iniciativa">
  <defs>
    <marker id="int-fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="sv-flecha"/></marker>
  </defs>
  <!-- Inicio -->
  <rect x="0" y="10" width="300" height="52" fill="#1a1817"/>
  <text x="18" y="42" class="sv-blanco" font-size="15" font-weight="700">Nueva iniciativa o uso de IA</text>
  <line x1="40" y1="62" x2="40" y2="88" class="sv-regla" stroke-width="1.5" marker-end="url(#int-fl)"/>

  <!-- Preguntas -->
  <g font-size="14.5">
    <rect x="0" y="90" width="640" height="56" class="sv-panel"/>
    <circle cx="40" cy="118" r="15" fill="#990f3d"/><text x="40" y="123" text-anchor="middle" class="sv-blanco" font-size="13" font-weight="700">1</text>
    <text x="70" y="123" class="sv-t" font-weight="600">¿Es una práctica prohibida por la regulación?</text>

    <rect x="0" y="170" width="640" height="56" class="sv-panel"/>
    <circle cx="40" cy="198" r="15" fill="#0f5499"/><text x="40" y="203" text-anchor="middle" class="sv-blanco" font-size="13" font-weight="700">2</text>
    <text x="70" y="203" class="sv-t" font-weight="600">¿Alto riesgo regulatorio o efecto significativo sobre personas?</text>

    <rect x="0" y="250" width="640" height="56" class="sv-panel"/>
    <circle cx="40" cy="278" r="15" fill="#0f5499"/><text x="40" y="283" text-anchor="middle" class="sv-blanco" font-size="13" font-weight="700">3</text>
    <text x="70" y="273" class="sv-t" font-weight="600">¿Exposición directa a clientes, agentes que ejecutan acciones</text>
    <text x="70" y="292" class="sv-t" font-weight="600">o datos especialmente protegidos?</text>

    <rect x="0" y="330" width="640" height="56" class="sv-panel"/>
    <circle cx="40" cy="358" r="15" fill="#0f5499"/><text x="40" y="363" text-anchor="middle" class="sv-blanco" font-size="13" font-weight="700">4</text>
    <text x="70" y="353" class="sv-t" font-weight="600">¿Función crítica, nivel Transformar o inversión superior</text>
    <text x="70" y="372" class="sv-t" font-weight="600">al umbral fijado por el consejo en C2?</text>
  </g>

  <!-- Flechas "No" -->
  <g font-size="12.5" font-weight="700">
    <line x1="40" y1="146" x2="40" y2="168" class="sv-regla" stroke-width="1.5" marker-end="url(#int-fl)"/><text x="52" y="162" class="sv-t2">No</text>
    <line x1="40" y1="226" x2="40" y2="248" class="sv-regla" stroke-width="1.5" marker-end="url(#int-fl)"/><text x="52" y="242" class="sv-t2">No</text>
    <line x1="40" y1="306" x2="40" y2="328" class="sv-regla" stroke-width="1.5" marker-end="url(#int-fl)"/><text x="52" y="322" class="sv-t2">No</text>
    <line x1="40" y1="386" x2="40" y2="412" class="sv-regla" stroke-width="1.5" marker-end="url(#int-fl)"/><text x="52" y="404" class="sv-t2">No</text>
  </g>

  <!-- Flechas "Sí" -->
  <g font-size="12.5" font-weight="700">
    <line x1="640" y1="118" x2="716" y2="118" class="sv-regla" stroke-width="1.5" marker-end="url(#int-fl)"/><text x="668" y="110" class="sv-t2">Sí</text>
    <line x1="640" y1="198" x2="716" y2="198" class="sv-regla" stroke-width="1.5" marker-end="url(#int-fl)"/><text x="668" y="190" class="sv-t2">Sí</text>
    <line x1="640" y1="278" x2="716" y2="278" class="sv-regla" stroke-width="1.5" marker-end="url(#int-fl)"/><text x="668" y="270" class="sv-t2">Sí</text>
    <line x1="640" y1="358" x2="716" y2="358" class="sv-regla" stroke-width="1.5" marker-end="url(#int-fl)"/><text x="668" y="350" class="sv-t2">Sí</text>
  </g>

  <!-- Resultados -->
  <rect x="720" y="90" width="260" height="56" fill="#990f3d"/>
  <text x="740" y="115" class="sv-blanco" font-size="15" font-weight="700">No se autoriza</text>
  <text x="740" y="134" class="sv-blanco" font-size="12" opacity=".85">No pasa de la fase 3 en ningún caso</text>

  <rect x="720" y="170" width="260" height="216" fill="#0f5499"/>
  <text x="740" y="230" class="sv-blanco" font-size="12" font-weight="700" letter-spacing="1" opacity=".8">INTENSIDAD</text>
  <text x="740" y="258" class="sv-blanco sv-serif" font-size="28" font-weight="700">Enterprise</text>
  <text x="740" y="290" class="sv-blanco" font-size="12.5" opacity=".9">Todos los gates por separado</text>
  <text x="740" y="308" class="sv-blanco" font-size="12.5" opacity=".9">Auditor de IA en cada gate</text>
  <text x="740" y="326" class="sv-blanco" font-size="12.5" opacity=".9">Firma multinivel en producción</text>
  <text x="740" y="344" class="sv-blanco" font-size="12.5" opacity=".9">Revisión trimestral</text>

  <rect x="0" y="414" width="640" height="56" fill="#0d7680"/>
  <text x="18" y="437" class="sv-blanco" font-size="12" font-weight="700" letter-spacing="1" opacity=".8">INTENSIDAD</text>
  <text x="18" y="459" class="sv-blanco sv-serif" font-size="21" font-weight="700">Lite</text>
  <text x="80" y="459" class="sv-blanco" font-size="12.5" opacity=".9">Gates agrupables · plantillas simplificadas · revisión semestral</text>
  <line x1="40" y1="470" x2="40" y2="494" class="sv-regla" stroke-width="1.5" marker-end="url(#int-fl)"/>
  <rect x="0" y="496" width="640" height="62" class="sv-panel"/>
  <text x="18" y="520" class="sv-t" font-weight="600">¿Además, uso interno, reversible, autonomía A0–A1, sin datos sensibles</text>
  <text x="18" y="540" class="sv-t" font-weight="600">y bajo el umbral Express de C2? Lo confirma la función de riesgos</text>
  <text x="668" y="522" class="sv-t2">Sí</text>
  <line x1="640" y1="527" x2="718" y2="527" class="sv-regla" stroke-width="1.5" marker-end="url(#int-fl)"/>
  <rect x="720" y="470" width="260" height="118" fill="#593380"/>
  <text x="740" y="492" class="sv-blanco" font-size="12" font-weight="700" letter-spacing="1" opacity=".8">INTENSIDAD</text>
  <text x="740" y="520" class="sv-blanco sv-serif" font-size="26" font-weight="700">Express</text>
  <text x="740" y="544" class="sv-blanco" font-size="12.5" opacity=".9">Mismas puertas; G3 por separado</text>
  <text x="740" y="562" class="sv-blanco" font-size="12.5" opacity=".9">Lista reducida y ficha viva</text>
  <text x="740" y="580" class="sv-blanco" font-size="12.5" opacity=".9">Revisión anual</text>
  <text x="52" y="584" class="sv-t2">No: Lite</text>
</svg>
  </div>
  <div class="g-fuente">Fuente: SEVEN-G · SEACHAD</div>
</figure>
