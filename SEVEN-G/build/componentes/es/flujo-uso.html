<figure class="grafico">
  <div class="g-titulo">Cómo fluye una iniciativa por SEVEN-G</div>
  <div class="g-sub">Fases, puertas con validación dual, iteraciones, salidas y bucle de operación y mejora continua</div>
  <div class="g-lienzo ancho">
<svg viewBox="0 0 1000 432" role="img" aria-label="Flujo de una iniciativa por SEVEN-G: seis fases hasta la puesta en producción con una puerta de decisión al final de cada una; en cada puerta se puede continuar, iterar, pivotar hacia la fase 2 o parar; una vez en uso, la iniciativa entra en un bucle de operación con monitorización continua y revisión periódica R6, y en la puerta G7 se escala, se itera o se retira.">
  <defs>
    <marker id="fu-fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" class="sv-flecha"/></marker>
    <marker id="fu-ko" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#990f3d"/></marker>
    <marker id="fu-pv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" style="fill:var(--oxford)"/></marker>
  </defs>

  <!-- validación dual y leyenda -->
  <rect x="20" y="6" width="430" height="46" class="sv-caja" style="fill:var(--papel-2);stroke:var(--regla)"/>
  <text x="32" y="24" class="sv-t" font-size="11" font-weight="700" letter-spacing="1">VALIDACIÓN DUAL EN CADA PUERTA</text>
  <text x="32" y="42" class="sv-t2" font-size="11.5">R · resultado + D · documentación verificada; sin las dos, no se cumple</text>
  <g font-size="11.5">
    <text x="476" y="24" class="sv-t2"><tspan class="sv-t" font-weight="700">→</tspan> Continuar (o con condiciones)</text>
    <text x="716" y="24" class="sv-t2"><tspan class="sv-t" font-weight="700">↺</tspan> Iterar (máx. 2; después, órgano superior)</text>
    <text x="476" y="44" class="sv-t2"><tspan style="fill:var(--oxford)" font-weight="700">↶</tspan> Pivotar (G1–G3) a la fase 2</text>
    <text x="716" y="44" class="sv-t2"><tspan fill="#990f3d" font-weight="700">✕</tspan> Parar o retirar</text>
    <text x="838" y="44" class="sv-t2"><tspan class="sv-t" font-weight="700">◆</tspan> Puerta de decisión</text>
  </g>

  <!-- etapas del embudo -->
  <g font-size="10.5" font-weight="700" letter-spacing="1" class="sv-t2">
    <path d="M22,80 V74 H230 V80" class="sv-regla"/><text x="126" y="68" text-anchor="middle" class="sv-t2">PROPUESTO</text>
    <path d="M238,80 V74 H338 V80" class="sv-regla"/><text x="288" y="68" text-anchor="middle" class="sv-t2">HIPÓTESIS</text>
    <path d="M346,80 V74 H446 V80" class="sv-regla"/><text x="396" y="68" text-anchor="middle" class="sv-t2">PRUEBA</text>
    <path d="M454,80 V74 H662 V80" class="sv-regla"/><text x="558" y="68" text-anchor="middle" class="sv-t2">EN DESARROLLO</text>
    <path d="M712,80 V74 H958 V80" class="sv-regla"/><text x="835" y="68" text-anchor="middle" style="fill:var(--teal)">EN USO</text>
  </g>

  <!-- fases 0 a 5 -->
  <g font-weight="700">
    <path d="M20,110 H112 L124,140 L112,170 H20 Z" fill="#1a1817"/>
    <text x="30" y="131" class="sv-blanco" font-size="11" opacity=".75">0</text><text x="30" y="148" class="sv-blanco" font-size="12">Contexto y</text><text x="30" y="162" class="sv-blanco" font-size="12">restricciones</text>
    <path d="M128,110 H220 L232,140 L220,170 H128 L140,140 Z" fill="#0a3d73"/>
    <text x="146" y="131" class="sv-blanco" font-size="11" opacity=".75">1</text><text x="146" y="148" class="sv-blanco" font-size="12">Descubri-</text><text x="146" y="162" class="sv-blanco" font-size="12">miento</text>
    <path d="M236,110 H328 L340,140 L328,170 H236 L248,140 Z" fill="#0f5499"/>
    <text x="254" y="131" class="sv-blanco" font-size="11" opacity=".75">2</text><text x="254" y="148" class="sv-blanco" font-size="12">Hipótesis</text><text x="254" y="162" class="sv-blanco" font-size="12">de valor</text>
    <path d="M344,110 H436 L448,140 L436,170 H344 L356,140 Z" fill="#990f3d"/>
    <text x="362" y="131" class="sv-blanco" font-size="11" opacity=".85">3</text><text x="362" y="148" class="sv-blanco" font-size="12">Viabilidad</text><text x="362" y="162" class="sv-blanco" font-size="12">y riesgo</text>
    <path d="M452,110 H544 L556,140 L544,170 H452 L464,140 Z" fill="#0b6a73"/>
    <text x="470" y="131" class="sv-blanco" font-size="11" opacity=".75">4</text><text x="470" y="155" class="sv-blanco" font-size="12">Diseño</text>
    <path d="M560,110 H652 L664,140 L652,170 H560 L572,140 Z" fill="#0d7680"/>
    <text x="578" y="131" class="sv-blanco" font-size="11" opacity=".75">5</text><text x="578" y="148" class="sv-blanco" font-size="12">Entrega y</text><text x="578" y="162" class="sv-blanco" font-size="12">validación</text>
  </g>

  <!-- puertas G0 a G5 -->
  <g font-size="11.5" font-weight="700" text-anchor="middle">
    <text x="126" y="100" class="sv-t">G0</text><text x="234" y="100" class="sv-t">G1</text><text x="342" y="100" class="sv-t">G2</text>
    <text x="450" y="100" fill="#990f3d">G3 · parada</text><text x="558" y="100" class="sv-t">G4</text><text x="666" y="100" class="sv-t">G5</text>
  </g>
  <g style="stroke:var(--papel)" stroke-width="2">
    <rect x="119" y="133" width="14" height="14" transform="rotate(45 126 140)" style="fill:var(--tinta)"/>
    <rect x="227" y="133" width="14" height="14" transform="rotate(45 234 140)" style="fill:var(--tinta)"/>
    <rect x="335" y="133" width="14" height="14" transform="rotate(45 342 140)" style="fill:var(--tinta)"/>
    <rect x="441" y="131" width="18" height="18" transform="rotate(45 450 140)" fill="#990f3d"/>
    <rect x="551" y="133" width="14" height="14" transform="rotate(45 558 140)" style="fill:var(--tinta)"/>
    <rect x="659" y="133" width="14" height="14" transform="rotate(45 666 140)" style="fill:var(--tinta)"/>
  </g>

  <!-- iterar: vuelve a la misma fase -->
  <g fill="none" style="stroke:var(--tinta-2)" stroke-width="1.6" marker-end="url(#fu-fl)">
    <path d="M123,174 C123,202 82,202 82,176"/>
    <path d="M231,174 C231,202 190,202 190,176"/>
    <path d="M339,174 C339,202 298,202 298,176"/>
    <path d="M447,174 C447,202 406,202 406,176"/>
    <path d="M555,174 C555,202 514,202 514,176"/>
    <path d="M663,174 C663,202 622,202 622,176"/>
  </g>
  <text x="46" y="214" class="sv-t2" font-size="11" text-anchor="middle">↺ iterar</text>

  <!-- pivotar: de G1, G2 o G3 a la fase 2 con nueva hipótesis -->
  <path d="M445,178 C445,256 292,256 290,178" fill="none" style="stroke:var(--oxford)" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#fu-pv)"/>
  <text x="400" y="262" font-size="11" font-weight="700" text-anchor="middle" style="fill:var(--oxford)">↶ pivotar</text>

  <!-- parar: salida del embudo -->
  <g stroke="#990f3d" stroke-width="1.6" marker-end="url(#fu-ko)">
    <line x1="131" y1="150" x2="131" y2="294"/><line x1="239" y1="150" x2="239" y2="294"/><line x1="347" y1="150" x2="347" y2="294"/>
    <line x1="455" y1="152" x2="455" y2="294" stroke-width="3.2"/><line x1="563" y1="150" x2="563" y2="294"/><line x1="671" y1="150" x2="671" y2="294"/>
  </g>
  <rect x="20" y="298" width="664" height="34" fill="#990f3d" fill-opacity=".1" stroke="#990f3d"/>
  <text x="32" y="319" font-size="11.5" font-weight="700" fill="#990f3d">✕ Parada · no aprobada (fases 0–1) o descartada (2–5): motivo y lecciones quedan en el registro</text>

  <!-- de G5 a producción -->
  <line x1="676" y1="140" x2="706" y2="140" class="sv-regla" stroke-width="2" marker-end="url(#fu-fl)" style="stroke:var(--tinta-2)"/>

  <!-- bucle de operación y evolución (fases 6 y 7) -->
  <path d="M835,140 C810,92 716,92 712,140 C716,188 810,188 835,140 C860,92 954,92 958,140 C954,188 860,188 835,140 Z" fill="none" stroke="#593380" stroke-width="11" stroke-linejoin="round"/>
  <g fill="#fff"><polygon points="800,99 791,104 800,109"/><polygon points="742,172 751,177 742,182"/><polygon points="870,99 879,104 870,109"/><polygon points="928,172 919,177 928,182"/></g>
  <g text-anchor="middle">
    <text x="770" y="128" class="sv-t" font-size="12" font-weight="700">6 · Operación</text>
    <text x="770" y="141" class="sv-t" font-size="12" font-weight="700">y gobierno</text>
    <text x="770" y="156" class="sv-t2" font-size="10.5">monitorización</text>
    <text x="770" y="167" class="sv-t2" font-size="10.5">continua</text>
    <text x="900" y="128" class="sv-t" font-size="12" font-weight="700">7 · Evolución</text>
    <text x="900" y="141" class="sv-t" font-size="12" font-weight="700">o retirada</text>
    <text x="900" y="156" class="sv-t2" font-size="10.5">G7 al momento</text>
    <text x="900" y="167" class="sv-t2" font-size="10.5">previsto</text>
  </g>
  <rect x="764" y="96" width="12" height="12" transform="rotate(45 770 102)" style="fill:var(--tinta);stroke:var(--papel)" stroke-width="2"/>
  <text x="700" y="90" class="sv-t" font-size="11" font-weight="700">R6 · continuidad <tspan class="sv-t2" font-weight="400">(trimestral / semestral)</tspan></text>
  <text x="835" y="206" class="sv-t2" font-size="11" text-anchor="middle">desviación en R6 → se adelanta G7</text>

  <!-- G7 y sus salidas -->
  <rect x="951" y="133" width="14" height="14" transform="rotate(45 958 140)" style="fill:var(--tinta);stroke:var(--papel)" stroke-width="2"/>
  <text x="958" y="100" class="sv-t" font-size="11.5" font-weight="700" text-anchor="middle">G7</text>
  <path d="M958,150 V216 H746" fill="none" style="stroke:var(--tinta-2)" stroke-width="1.6"/>
  <g style="stroke:var(--tinta-2)" stroke-width="1.6" marker-end="url(#fu-fl)">
    <line x1="746" y1="216" x2="746" y2="228"/><line x1="844" y1="216" x2="844" y2="228"/><line x1="942" y1="216" x2="942" y2="228"/>
  </g>
  <rect x="700" y="232" width="92" height="40" fill="#0d7680" fill-opacity=".14" stroke="#0d7680"/>
  <text x="746" y="249" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:var(--teal)">↑ Escalar</text>
  <text x="746" y="264" text-anchor="middle" class="sv-t2" font-size="10.5">nueva fase 0</text>
  <rect x="798" y="232" width="92" height="40" class="sv-caja" style="fill:var(--papel-2);stroke:var(--tinta-2)"/>
  <text x="844" y="249" text-anchor="middle" class="sv-t" font-size="11.5" font-weight="700">↺ Iterar</text>
  <text x="844" y="264" text-anchor="middle" class="sv-t2" font-size="10.5">fase 2, 4, 5 o 6</text>
  <rect x="896" y="232" width="92" height="40" fill="#990f3d" fill-opacity=".1" stroke="#990f3d"/>
  <text x="942" y="249" text-anchor="middle" font-size="11.5" font-weight="700" fill="#990f3d">✕ Retirar</text>
  <text x="942" y="264" text-anchor="middle" class="sv-t2" font-size="10.5">desenganchado</text>

  <!-- notas -->
  <rect x="20" y="348" width="470" height="76" class="sv-caja" style="fill:var(--papel-2);stroke:var(--regla)"/>
  <text x="32" y="366" class="sv-t" font-size="11.5" font-weight="700">Si no se cumple lo que exigen los documentos</text>
  <text x="32" y="383" class="sv-t2" font-size="11">Sin evidencia verificada no hay decisión: la solicitud vuelve al equipo.</text>
  <text x="32" y="399" class="sv-t2" font-size="11">Una condición vencida convierte el resultado en Iterar.</text>
  <text x="32" y="415" class="sv-t2" font-size="11">Los criterios de parada no se relajan sin el órgano que autorizó.</text>
  <rect x="510" y="348" width="470" height="76" class="sv-caja" style="fill:var(--papel-2);stroke:var(--regla)"/>
  <text x="522" y="366" class="sv-t" font-size="11.5" font-weight="700">En espera y en uso</text>
  <text x="522" y="383" class="sv-t2" font-size="11">Por una causa externa registrada, la iniciativa espera y se reanuda.</text>
  <text x="522" y="399" class="sv-t2" font-size="11">En uso, la monitorización continua alimenta cada R6, y una</text>
  <text x="522" y="415" class="sv-t2" font-size="11">desviación relevante adelanta la decisión de G7.</text>
</svg>
  </div>
  <div class="g-fuente">Fuente: SEVEN-G · SEACHAD · reglas de transición en el documento 20 §11 y en el 21 §3</div>
</figure>
