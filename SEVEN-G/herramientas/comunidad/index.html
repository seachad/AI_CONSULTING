.regla-c { padding: 14px 0 12px; border-bottom: 1px solid var(--regla); font: 400 15px/1.5 var(--sans); color: var(--tinta-2); }

.boton { font: 700 14.5px/1 var(--sans); padding: 10px 14px; border: 2px solid var(--negro); color: var(--negro); background: transparent; cursor: pointer; text-decoration: none; display: inline-block; }
.boton.primario { background: var(--negro); color: var(--papel); }
.boton:hover:not(:disabled), .boton:focus-visible { background: var(--claret); border-color: var(--claret); color: #fff; }

.boton.menor { padding: 7px 10px; font-size: 13px; border-width: 1px; }

.filtros { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font: 500 14px/1 var(--sans); border-top: 4px solid var(--negro); padding-top: 14px; }

.voto { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border: 2px solid var(--negro); background: transparent; color: var(--negro); cursor: pointer; font: 600 12px/1.2 var(--sans); height: max-content; }
.voto b { font: 600 28px/1 var(--serif); }
.voto[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }

.voto:hover:not(:disabled), .voto:focus-visible { border-color: var(--claret); }

.caso h3 { font: 600 20px/1.25 var(--serif); color: var(--negro); margin: 0 0 4px; }
.meta { font: 500 13px/1.5 var(--sans); color: var(--tinta-3); margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.chapa { font: 700 11px/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; padding: 4px 6px; color: #fff; background: var(--oxford); }

.desc { font: 400 15px/1.55 var(--sans); color: var(--tinta-2); margin: 0; white-space: pre-wrap; }
.desc.corta { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mas { appearance: none; border: 0; background: none; padding: 0; margin-top: 4px; font: 600 13px/1.4 var(--sans); color: var(--oxford); cursor: pointer; text-decoration: underline; }
.progreso { height: 5px; background: var(--regla-2); margin-top: 8px; max-width: 260px; } .progreso i { display: block; height: 100%; background: var(--teal); }
.vacio { padding: 22px 0; font: 400 15.5px/1.55 var(--sans); color: var(--tinta-2); border-bottom: 1px solid var(--regla); }

form.envio { border-top: 4px solid var(--negro); padding-top: 14px; font: 400 15px/1.5 var(--sans); }
.campo { margin: 0 0 14px; } .campo > label, .campo > .rotulo { display: block; font-weight: 700; color: var(--negro); margin-bottom: 5px; }
.campo input[type="text"], .campo textarea, dialog input[type="text"] { width: 100%; font: 400 16px/1.45 var(--sans); color: var(--tinta); background: var(--papel); border: 1px solid var(--tinta-3); padding: 9px 10px; }
.campo textarea { min-height: 150px; resize: vertical; }
.ayuda { font-size: 13px; color: var(--tinta-3); margin-top: 4px; }
.tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tipos label { border: 1px solid var(--tinta-3); padding: 9px 10px; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; font-weight: 600; }

.trampa { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.mensaje { margin: 12px 0 0; padding: 10px 12px; font: 500 14.5px/1.5 var(--sans); border-left: 4px solid var(--teal); background: color-mix(in srgb, var(--teal) 10%, transparent); }

.mensaje:empty { display: none; }
.reconocimiento { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--regla); font: 400 13.5px/1.55 var(--sans); color: var(--tinta-2); }

dialog { border: 2px solid var(--negro); background: var(--papel); color: var(--tinta); padding: 22px; max-width: 480px; width: calc(100% - 32px); font: 400 15px/1.55 var(--sans); }
dialog::backdrop { background: rgba(20, 16, 14, .55); }
dialog h2 { margin: 0 0 8px; font-size: 24px; }
dialog .acciones { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

.aviso { margin: 44px 0 0; padding: 14px 16px; border-left: 4px solid var(--claret); background: color-mix(in srgb, var(--claret) 6%, transparent); font: 400 14.5px/1.55 var(--sans); color: var(--tinta-2); }

.pie { margin: 32px 0 40px; border-top: 4px solid var(--negro); padding-top: 12px; font: 400 13px/1.5 var(--sans); color: var(--tinta-3); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; }

  };

  var idioma = 'es', issues = [], estadoLista = 'cargando', pendiente = null;
  function t(k, v) { var s = T[idioma][k] || T.es[k] || k; if (v) for (var c in v) s = s.split('{' + c + '}').join(v[c]); return s; }
  function leeLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function el(tag, attrs, texto) { var e = document.createElement(tag); for (var a in (attrs || {})) e.setAttribute(a, attrs[a]); if (texto != null) e.textContent = texto; return e; }

  /* ---- idioma y tema ---- */
  function ponIdioma(l) {
    idioma = l === 'en' ? 'en' : 'es';
    document.documentElement.lang = idioma;
    document.title = idioma === 'en' ? 'SEVEN-G community · Issues and requests' : 'Comunidad SEVEN-G · Incidencias y peticiones';
    $('btn-es').setAttribute('aria-pressed', String(idioma === 'es')); $('btn-en').setAttribute('aria-pressed', String(idioma === 'en'));
    document.querySelectorAll('[data-i18n]').forEach(function (n) { n.innerHTML = t(n.getAttribute('data-i18n')); });   // textos propios de la página, nunca de usuarios
    if (UMBRAL) $('regla-votos').innerHTML += t('r1_umbral', { n: UMBRAL });
    $('lnk-portada').setAttribute('href', idioma === 'en' ? '../../../en/index.html' : '../../../index.html');
    $('lnk-biblioteca').setAttribute('href', '../../html/' + idioma + '/index.html');
    $('fuente').innerHTML = REPO ? t('fuente', { url: 'https://github.com/' + REPO + '/issues', repo: REPO }) : '';
    pintaIdentidad(); pintaLista(); pintaEnvio();
    cargaCodigos(idioma);
  }
  // «Ir a código» y códigos citados (D99): índice del sitio en el idioma activo (SEVEN-G/html/<idioma>/codigos.js), cargado con
  // data-sin-medicion: esta página no mide visitas (D80, D90). Un código escrito en una incidencia («documento 21», «P12») pasa a ser
  // un enlace a donde se explica; la dirección sale del índice del sitio, nunca del texto enviado.
  function cargaCodigos(l) {
    if (window.sevengIrCodigo && window.sevengIrCodigo.lang === l) { window.sevengIrCodigo.iniciar(); return; }
    var previo = document.getElementById('ir-codigo-js'); if (previo) previo.parentNode.removeChild(previo);
    var sc = document.createElement('script'); sc.id = 'ir-codigo-js'; sc.src = '../../html/' + l + '/codigos.js'; sc.setAttribute('data-sin-medicion', ''); document.head.appendChild(sc);
  }
  $('btn-es').addEventListener('click', function () { guardaLocal(K_IDIOMA, 'es'); ponIdioma('es'); });
  $('btn-en').addEventListener('click', function () { guardaLocal(K_IDIOMA, 'en'); ponIdioma('en'); });
  var sel = $('tema'); sel.value = document.documentElement.getAttribute('data-theme') || 'salmon';
  sel.addEventListener('change', function () { document.documentElement.setAttribute('data-theme', sel.value); guardaLocal('seveng-tema', sel.value); });

  /* ---- identificador ---- */
  function pintaIdentidad() {
    var u = usuario();
    $('id-usuario').textContent = u || t('id_ninguno');
    $('btn-identidad').textContent = u ? t('id_cambiar') : t('id_elegir');
  }
  function pideIdentidad(despues) {
    pendiente = despues || null;
    $('c-usuario').value = usuario(); $('msg-identidad').textContent = '';
    var d = $('dlg-identidad'); if (d.showModal) d.showModal(); else d.setAttribute('open', '');
    $('c-usuario').focus();
  }
  function cierraDialogo() { var d = $('dlg-identidad'); if (d.close) d.close(); else d.removeAttribute('open'); }
  $('btn-identidad').addEventListener('click', function () { pideIdentidad(null); });
  $('btn-cancelar').addEventListener('click', function () { pendiente = null; cierraDialogo(); });
  $('form-identidad').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var u = limpiaUsuario($('c-usuario').value);
    if (!u) { $('msg-identidad').textContent = t('e_usuario'); return; }
    guardaLocal(K_USUARIO, u); cierraDialogo(); pintaIdentidad(); pintaLista();
    var f = pendiente; pendiente = null; if (f) f();
  });
  function conUsuario(f) { if (usuario()) f(); else pideIdentidad(f); }

  /* ---- datos ---- */
  // Misma lectura que worker/worker.js: los votos y el identificador van en un bloque oculto del texto del issue.
  var SEPARADOR = '\n\n<!-- seveng-pie -->\n', RE_META = /<!--\s*seveng:(\{[\s\S]*?\})\s*-->/g;
  function normaliza(i) {
    var cuerpo = String(i.body || ''), meta = null, m; RE_META.lastIndex = 0;
    while ((m = RE_META.exec(cuerpo))) { try { meta = JSON.parse(m[1]); } catch (e) {} }
    meta = meta && typeof meta === 'object' ? meta : {};
    var votos = Array.isArray(meta.votos) ? meta.votos.map(limpiaUsuario).filter(Boolean).map(function (v) { return v.toLowerCase(); }) : [];
    votos = votos.filter(function (v, k) { return votos.indexOf(v) === k; });
    var corte = cuerpo.indexOf(SEPARADOR), etq = (i.labels || []).map(function (e) { return typeof e === 'string' ? e : e.name; });
    return {
      numero: i.number, tipo: etq.indexOf('peticion') >= 0 ? 'peticion' : 'incidencia', titulo: i.title,
      descripcion: (corte >= 0 ? cuerpo.slice(0, corte) : cuerpo.replace(RE_META, '')).replace(/​/g, '').trim(),
      usuario: limpiaUsuario(meta.usuario), votos: votos.length, votantes: votos,
      estado: i.state === 'open' ? 'abierto' : (i.state_reason === 'not_planned' ? 'descartado' : 'resuelto'),
      etiquetas: etq.filter(function (e) { return ['comunidad', 'peticion', 'incidencia'].indexOf(e) < 0; }),
      comentarios: i.comments || 0, creado: i.created_at, cerrado: i.closed_at || null, url: i.html_url
    };
  }
  function carga() {
    estadoLista = 'cargando'; pintaLista();
    if (!REPO && !ENDPOINT) { estadoLista = 'sin_repo'; pintaLista(); return; }
    var p = ENDPOINT
      ? fetch(ENDPOINT + '/issues', { referrerPolicy: 'no-referrer' }).then(function (r) { if (!r.ok) throw r; return r.json(); }).then(function (d) { return d.issues || []; })
      : fetch('https://api.github.com/repos/' + REPO + '/issues?labels=comunidad&state=all&per_page=100', { headers: { 'Accept': 'application/vnd.github+json' }, referrerPolicy: 'no-referrer' })
          .then(function (r) { if (!r.ok) throw r; return r.json(); }).then(function (l) { return l.filter(function (i) { return !i.pull_request; }).map(normaliza); });
    p.then(function (l) { issues = l; estadoLista = 'ok'; pintaLista(); })
     .catch(function (r) { estadoLista = (r && r.status === 404) ? 'sin_repo' : 'error'; pintaLista(); });
  }
  function envia(ruta, datos) {
    return fetch(ENDPOINT + ruta, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos), referrerPolicy: 'no-referrer' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.error || 'red'); e.codigo = d.error; throw e; } return d; }); });
  }
  function textoError(e) { var k = 'e_' + (e && e.codigo); return T.es[k] ? t(k) : t('e_red'); }
  function sustituye(nuevo) {
    if (!nuevo) return;
    var k = issues.findIndex(function (x) { return x.numero === nuevo.numero; });
    if (k >= 0) issues[k] = nuevo; else issues.unshift(nuevo);
  }

  /* ---- lista ---- */
  function fecha(iso) { try { return new Date(iso).toLocaleDateString(idioma === 'en' ? 'en-GB' : 'es-ES', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } }
  function pintaLista() {
    var ul = $('lista'); ul.setAttribute('data-estado', estadoLista); ul.textContent = ''; $('cuenta').textContent = '';
    if (estadoLista !== 'ok') { ul.appendChild(el('li', { 'class': 'vacio' }, t(estadoLista === 'cargando' ? 'cargando' : estadoLista === 'sin_repo' ? 'sin_repo' : 'error_carga'))); return; }
    var fTipo = $('f-tipo').value, fEstado = $('f-estado').value, orden = $('f-orden').value, yo = usuario().toLowerCase();
    var vista = issues.filter(function (i) { return (!fTipo || i.tipo === fTipo) && (!fEstado || (fEstado === 'abierto') === (i.estado === 'abierto')); });
    vista.sort(function (a, b) { return orden === 'votos' ? (b.votos - a.votos) || (a.creado < b.creado ? 1 : -1) : (a.creado < b.creado ? 1 : -1); });
    $('cuenta').textContent = t('cuenta', { n: vista.length, m: issues.length });
    if (!vista.length) { ul.appendChild(el('li', { 'class': 'vacio' }, t(issues.length ? 'vacio_filtro' : 'vacio'))); return; }
    vista.forEach(function (i) {
      var li = el('li', { 'class': 'caso', 'data-numero': i.numero, 'data-tipo': i.tipo });
      var votado = !!yo && i.votantes.indexOf(yo) >= 0;
      var b = el('button', { type: 'button', 'class': 'voto', 'aria-pressed': String(votado), 'aria-label': t('voto_aria', { t: i.titulo, n: i.votos }) });
      b.appendChild(el('b', null, String(i.votos))); b.appendChild(el('span', null, i.votos === 1 ? t('voto1') : t('voto')));
      b.appendChild(el('span', null, votado ? '✓ ' + t('votado') : t('votar')));
      if (i.estado !== 'abierto' || !ENDPOINT) b.disabled = true;
      b.addEventListener('click', function () { conUsuario(function () { vota(i, b); }); });
      li.appendChild(b);
      var d = el('div');
      d.appendChild(el('h3', null, i.titulo));
      var m = el('p', { 'class': 'meta' });
      m.appendChild(el('span', { 'class': 'chapa ' + i.tipo }, t(i.tipo)));
      if (i.estado !== 'abierto') m.appendChild(el('span', { 'class': 'chapa ' + i.estado }, t(i.estado)));
      i.etiquetas.forEach(function (e) { m.appendChild(el('span', { 'class': 'chapa etq' }, e)); });
      m.appendChild(el('span', null, '#' + i.numero + ' · ' + t('por', { u: i.usuario || t('anonimo') }) + ' · ' + fecha(i.creado)));
      if (i.comentarios) m.appendChild(el('span', null, t('comentarios', { n: i.comentarios })));
      if (i.url) m.appendChild(el('a', { href: i.url, rel: 'noopener' }, t('ver_github')));
      d.appendChild(m);
      var p = el('p', { 'class': 'desc corta' }, i.descripcion); d.appendChild(p);
      if (i.descripcion.length > 220 || i.descripcion.split('\n').length > 3) {

        d.appendChild(mas);
      }

      li.appendChild(d); ul.appendChild(li);
    });
  }
  function vota(i, boton) {
    var quitar = boton.getAttribute('aria-pressed') === 'true';

      .catch(function (e) { boton.disabled = false; alert(textoError(e)); });
  }
  ['f-tipo', 'f-estado', 'f-orden'].forEach(function (id) { $(id).addEventListener('change', pintaLista); });

  /* ---- envío ---- */
  function mensaje(texto, error) { var m = $('msg-envio'); m.textContent = texto || ''; m.className = 'mensaje' + (error ? ' error' : ''); }
  function pintaEnvio() { $('btn-enviar').disabled = !ENDPOINT; if (!ENDPOINT) mensaje(t('sin_endpoint')); }
  $('form-envio').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var titulo = $('c-titulo').value.replace(/\s+/g, ' ').trim(), desc = $('c-desc').value.trim();
    if (titulo.length < 8) { mensaje(t('e_titulo'), true); $('c-titulo').focus(); return; }
    if (desc.length < 20) { mensaje(t('e_descripcion'), true); $('c-desc').focus(); return; }
    conUsuario(function () {
      var boton = $('btn-enviar'); boton.disabled = true; mensaje(t('enviando'));
      envia('/issues', { tipo: document.querySelector('input[name="tipo"]:checked').value, titulo: titulo, descripcion: desc, usuario: usuario(), idioma: idioma, web: $('c-web').value })
        .then(function (d) {
          sustituye(d.issue); $('c-titulo').value = ''; $('c-desc').value = '';
          $('f-estado').value = 'abierto'; $('f-tipo').value = ''; $('f-orden').value = 'recientes'; pintaLista(); mensaje(t('enviado'));
        })
        .catch(function (e) { mensaje(textoError(e), true); })
        .then(function () { boton.disabled = false; });
    });
  });

  /* ---- arranque ---- */
  var guardado = leeLocal(K_IDIOMA);
  ponIdioma(location.hash === '#en' ? 'en' : location.hash === '#es' ? 'es' : guardado || (/^en\b/i.test(navigator.language || '') ? 'en' : 'es'));
  carga();
})();
