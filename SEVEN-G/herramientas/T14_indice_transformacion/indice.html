async function handleDel(){ try{ const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('handles','readwrite'); tx.objectStore('handles').delete(C.codigo); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }catch(e){} }

function aplicarDatos(d, origen){ APLICANDO = true; try{ C.aplicar(JSON.parse(JSON.stringify(d))); } finally { APLICANDO = false; } ULTIMO = datosTxt(); E.origen = origen; E.cambiado = false; E.error = null; estadoGuardar(); refrescar(); }

/* ---- fichero del equipo ---- */
async function escribir(){ if(!HANDLE || E.permiso!=='granted') return; try{ const w = await HANDLE.createWritable(); await w.write(JSON.stringify((C.exportar||C.obtener)(), null, 2)); await w.close(); E.error = null; E.cambiado = false; }catch(e){ E.error = e.message||String(e); aviso(t('err_escribir')); } estadoGuardar(); refrescar(); }
async function leerFichero(){ try{ const f = await HANDLE.getFile(); const d = JSON.parse(await f.text()); if(!C.validar(d)){ E.error = t('err_fichero_invalido'); refrescar(); return; }
  if(E.cambiado && JSON.stringify(d)!==datosTxt()){ PENDIENTE = d; abrir(); return; }
  aplicarDatos(d, 'fichero'); }catch(e){ E.error = e.message||String(e); refrescar(); } }
async function arranqueFichero(){ if(!soporta()){ if(E.origen==='fichero'){ E.origen = 'navegador'; estadoGuardar(); } return; }
  HANDLE = await handleGet(); if(!HANDLE){ if(E.origen==='fichero'){ E.origen = 'navegador'; E.fichero = null; estadoGuardar(); } return; }
  E.fichero = HANDLE.name; E.origen = 'fichero';
  try{ E.permiso = await HANDLE.queryPermission({mode:'readwrite'}); }catch(e){ E.permiso = 'prompt'; }
  if(E.permiso==='granted') await leerFichero(); estadoGuardar(); refrescar(); }
async function reanudar(){ if(!HANDLE) return; try{ E.permiso = await HANDLE.requestPermission({mode:'readwrite'}); }catch(e){ E.permiso = 'denied'; }
  if(E.permiso==='granted'){ await leerFichero(); if(E.cambiado && !PENDIENTE) await escribir(); } refrescar(); pintar(); }
const TIPOS = [{description:'JSON', accept:{'application/json':['.json']}}];
async function nuevoFichero(){ try{ const h = await window.showSaveFilePicker({suggestedName:C.nombreFichero(), types:TIPOS}); HANDLE = h; await handleSet(h); E.fichero = h.name; E.origen = 'fichero'; E.permiso = 'granted'; E.error = null; ULTIMO = datosTxt(); await escribir(); cerrarAviso(); pintar(); aviso(t('ok_fichero',{f:h.name})); }catch(e){ if(e && e.name!=='AbortError') aviso(t('err_escribir')+' '+(e.message||'')); } }
async function abrirFichero(){ try{ const [h] = await window.showOpenFilePicker({types:TIPOS, multiple:false}); let p = 'granted'; try{ p = await h.requestPermission({mode:'readwrite'}); }catch(e){}
  if(p!=='granted'){ aviso(t('sin_permiso')); return; } const f = await h.getFile(); const d = JSON.parse(await f.text()); if(!C.validar(d)){ aviso(t('err_fichero_invalido')); return; }
  HANDLE = h; await handleSet(h); E.fichero = h.name; E.permiso = 'granted'; aplicarDatos(d, 'fichero'); cerrarAviso(); pintar(); aviso(t('ok_abierto',{f:h.name})); }catch(e){ if(e && e.name!=='AbortError') aviso(t('err_fichero_invalido')); } }
async function dejarFichero(){ await handleDel(); HANDLE = null; E.fichero = null; E.permiso = null; E.error = null; E.origen = 'navegador'; estadoGuardar(); refrescar(); pintar(); aviso(t('ok_dejar')); }

/* ---- carpeta de datos de la copia de la compañía (solo servida por http) ---- */
async function arranqueServidor(){ if(!http() || !C.ficheroServidor) return;
  try{ const r = await fetch(C.ficheroServidor, {cache:'no-store'}); if(!r.ok) return; const d = await r.json();
    const nombre = C.ficheroServidor.split('/').pop(); if(!C.validar(d)){ E.servidor = {nombre, error:true}; refrescar(); return; }
    E.servidor = {nombre, fecha:r.headers.get('Last-Modified')||null, datos:d};
    const nuevo = E.origen==='servidor' && !E.cambiado && E.servidorFecha!==E.servidor.fecha;
    if((C.cargadoDeDemo && E.origen!=='fichero') || nuevo) aplicarServidor(false);
    refrescar(); }catch(e){}
}
function aplicarServidor(avisar){ if(!E.servidor || !E.servidor.datos) return; aplicarDatos(E.servidor.datos, 'servidor'); E.servidorFecha = E.servidor.fecha||null; estadoGuardar(); if(avisar) aviso(t('ok_servidor')); pintar(); }

/* ---- indicador, aviso y diálogo ---- */
function boton(){ let b = document.getElementById('btn-datos'); if(b) return b; const z = document.querySelector('.ajustes'); if(!z) return null;
  b = document.createElement('button'); b.type = 'button'; b.id = 'btn-datos'; b.className = 'enlace-btn dl-btn'; b.setAttribute('aria-haspopup','dialog'); b.innerHTML = '<span class="dl-punto" aria-hidden="true"></span><span class="dl-txt"></span>';
  b.addEventListener('click', abrir); const legal = document.getElementById('btn-legal'); if(legal && legal.parentNode===z) z.insertBefore(b, legal); else z.appendChild(b); return b; }
function refrescar(){ if(!C) return; const b = boton(); if(!b) return; const s = estado(); b.dataset.estado = s; b.title = t('btn_title');
  b.querySelector('.dl-txt').textContent = s==='fichero' ? t('btn_fichero')+' · '+E.fichero : s==='fichero-reanudar' ? t('btn_fichero_reanudar') : s==='error' ? t('btn_fichero')+' · !' : t('btn_'+s);
  const av = document.querySelector('.dl-aviso'); if(av) av.querySelector('p').textContent = t('aviso_txt'); }
function banner(){ if(document.querySelector('.dl-aviso')) return; const cab = document.querySelector('header.cab'); if(!cab) return;
  const d = document.createElement('div'); d.className = 'dl-aviso'; d.setAttribute('role','status');
  d.innerHTML = '<div><p>'+esc(t('aviso_txt'))+'</p>'+(soporta() ? '<button type="button" class="primario" data-dl="nuevo">'+esc(t('aviso_btn'))+'</button>' : '')+'<button type="button" data-dl="abrir-dlg">'+esc(t('aviso_mas'))+'</button><button type="button" data-dl="cerrar-aviso">'+esc(t('aviso_cerrar'))+'</button></div>';
  d.addEventListener('click', accion); cab.insertAdjacentElement('afterend', d); }
function cerrarAviso(){ const av = document.querySelector('.dl-aviso'); if(av) av.remove(); }
function dialogo(){ let d = document.getElementById('dlg-datos'); if(d) return d; d = document.createElement('dialog'); d.id = 'dlg-datos'; d.setAttribute('aria-labelledby','dlg-datos-t'); d.addEventListener('click', accion); document.body.appendChild(d); return d; }
function estadoHTML(){ const s = estado(); const f = esc(E.fichero||''); let h = '';
  if(PENDIENTE) return '';
  if(s==='demo') h = C.esDemo() ? t('est_demo') : t('est_navegador');
  else if(s==='servidor') h = t('est_servidor', {f:esc(E.servidor ? E.servidor.nombre : (C.ficheroServidor||'').split('/').pop()), d:(E.servidorFecha ? ', '+t('fecha',{d:fechaTxt(E.servidorFecha)}) : '')});
  else if(s==='navegador') h = C.esDemo() ? t('est_demo_cambios') : t('est_navegador');
  else if(s==='fichero') h = t('est_fichero',{f}) + (E.cambiado ? ' '+t('est_cambios_pend') : '');
  else if(s==='fichero-reanudar') h = t('est_fichero_reanudar',{f});
  else if(s==='error') h = t('est_fichero_error',{f, e:esc(E.error||'')});
  return '<div class="dl-est" data-estado="'+s+'"><p>'+h+'</p></div>'; }
function pintar(){ const d = dialogo(); if(!d.open) return; const f = esc(E.fichero||''); const sv = (C.ficheroServidor||'').split('/').pop(); let h = '<div class="dlg-cab"><h2 id="dlg-datos-t">'+esc(t('tit'))+'</h2><button type="button" data-dl="cerrar" aria-label="'+esc(t('cerrar'))+'">×</button></div><div class="dlg-cuerpo">';
  if(PENDIENTE){ h += '<div class="dl-est" data-estado="fichero-reanudar"><p><b>'+esc(t('conf_t'))+'</b></p><p>'+t('conf',{f})+'</p><div class="dl-fila"><button type="button" class="primario" data-dl="conf-fichero">'+esc(t('conf_fichero'))+'</button><button type="button" data-dl="conf-navegador">'+esc(t('conf_navegador'))+'</button></div></div>'; }
  else {
    h += estadoHTML();
    h += '<h3>'+esc(t('opciones'))+'</h3>';
    h += '<h4>'+esc(t('op1_t'))+'</h4><p>'+esc(t('op1'))+'</p>';
    h += '<h4>'+esc(t('op2_t'))+'</h4><p>'+esc(t('op2'))+'</p>';
    if(soporta()){ h += '<div class="dl-fila">'+(E.origen==='fichero' && E.permiso!=='granted' && HANDLE ? '<button type="button" class="primario" data-dl="reanudar">'+esc(t('op2_reanudar',{f}))+'</button>' : '')+'<button type="button"'+(E.origen==='fichero' ? '' : ' class="primario"')+' data-dl="nuevo">'+esc(t('op2_nuevo'))+'</button><button type="button" data-dl="abrir">'+esc(t('op2_abrir'))+'</button>'+(E.origen==='fichero' ? '<button type="button" data-dl="dejar">'+esc(t('op2_dejar'))+'</button>' : '')+'</div>'; }
    else h += '<p class="dl-nota">'+esc(t('op2_no'))+'</p>';
    h += '<h4>'+esc(t('op3_t'))+'</h4><p>'+t('op3',{f:esc(sv)})+'</p>';
    if(E.servidor && E.servidor.error) h += '<p class="dl-nota">'+esc(t('srv_mal',{f:E.servidor.nombre}))+'</p>';
    else if(E.servidor) h += '<p>'+t('srv_hay',{f:esc(E.servidor.nombre), d:(E.servidor.fecha ? ', '+esc(t('fecha',{d:fechaTxt(E.servidor.fecha)})) : '')})+'</p><div class="dl-fila"><button type="button" data-dl="servidor">'+esc(t('srv_cargar'))+'</button></div>';
    if(C.ayudaHref) h += '<p><a href="'+esc(C.ayudaHref())+'">'+esc(t('op3_como'))+' →</a></p>';
    h += '<p class="dl-nota">'+esc(t('demo_volver'))+'</p>';
  }
  h += '<div class="fila-fin" style="margin-top:12px"><button type="button" class="primario" data-dl="cerrar">'+esc(t('cerrar'))+'</button></div></div>';
  d.innerHTML = h; }
function abrir(){ const d = dialogo(); d.setAttribute('lang', lang()); if(!d.open){ try{ d.showModal(); }catch(e){ d.setAttribute('open',''); } } pintar(); const b = d.querySelector('button.primario'); if(b) b.focus(); }
function cerrar(){ const d = document.getElementById('dlg-datos'); if(!d) return; if(d.open){ try{ d.close(); }catch(e){ d.removeAttribute('open'); } } }
function accion(e){ const b = e.target.closest('[data-dl]'); if(!b) return; e.preventDefault(); const a = b.dataset.dl;
  if(a==='cerrar') cerrar();
  else if(a==='cerrar-aviso') cerrarAviso();
  else if(a==='abrir-dlg'){ cerrarAviso(); abrir(); }
  else if(a==='nuevo') nuevoFichero();
  else if(a==='abrir') abrirFichero();
  else if(a==='reanudar') reanudar();
  else if(a==='dejar') dejarFichero();
  else if(a==='servidor'){ if(E.cambiado && !confirm(t('srv_conf'))) return; aplicarServidor(true); }
  else if(a==='conf-fichero'){ const d = PENDIENTE; PENDIENTE = null; aplicarDatos(d, 'fichero'); pintar(); }
  else if(a==='conf-navegador'){ PENDIENTE = null; E.origen = 'fichero'; ULTIMO = datosTxt(); escribir().then(pintar); }
}

/* ---- API ---- */
function iniciar(cfg){ C = cfg; LS_KEY = 'seveng-'+String(cfg.codigo).toLowerCase()+'-datos-origen-v1'; estadoCargar(); ULTIMO = datosTxt();
  if(!document.getElementById('dl-estilo')){ const s = document.createElement('style'); s.id = 'dl-estilo'; s.textContent = CSS; document.head.appendChild(s); }
  refrescar(); arranqueFichero().then(arranqueServidor); }
function guardado(){ if(!C || APLICANDO) return; const ahora = datosTxt(); if(ahora===ULTIMO) return; ULTIMO = ahora;
  if(E.origen==='fichero'){ E.cambiado = true; if(E.permiso==='granted'){ clearTimeout(TIMER); TIMER = setTimeout(escribir, 400); } estadoGuardar(); refrescar(); return; }
  if(E.origen==='demo' || E.origen==='servidor') E.origen = 'navegador'; E.cambiado = true;
  const primera = !E.avisado; E.avisado = true; estadoGuardar(); refrescar(); if(primera) banner(); }
function reiniciar(origen){ if(!C) return; if(HANDLE){ handleDel(); HANDLE = null; } E.fichero = null; E.permiso = null; E.error = null; E.origen = origen||'demo'; E.cambiado = false; PENDIENTE = null; ULTIMO = datosTxt(); estadoGuardar(); cerrarAviso(); refrescar(); }
return { iniciar, guardado, refrescar, reiniciar, abrir, estado:() => E ? Object.assign({}, E, {datos:undefined}) : null };
})();
</script>

/* Ayuda de las herramientas de SEVEN-G (D111): módulo común que cada build_*.ps1 incrusta en su HTML (marca __AYUDA__), junto con

let D = null, UI = { lang:'es', tema:'auto', sel:null, umb:null }, CARGA_DEMO = false;
let lang = 'es';
function t(k, v){ let s = (TX[lang] && TX[lang][k]) ?? TX.es[k] ?? k; if(v) for(const x in v) s = s.split('{'+x+'}').join(v[x]); return s; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clon(o){ return JSON.parse(JSON.stringify(o)); }

function guardarResumen(){ try{ const c = ordenados().slice(-1)[0]; if(!c){ lsDel(LS_RESUMEN); return; } const r = calcular(c.entradas, umbral(c.version_umbrales).parametros);
  lsSet(LS_RESUMEN, JSON.stringify({herramienta:'T14', id:c.id, fecha_corte:c.fecha_corte, tipo:c.tipo, perfil_asignado:r.asignado, perfil_evidenciado:r.evidenciado, perfil_subyacente:r.subyacente||null, suma:r.suma, cobertura:r.cobertura, organizacion:(D.meta||{}).organizacion||null, datos_ilustrativos:!!(D.meta||{}).datos_ilustrativos})); }catch(e){} }

function valido(x){ return x && typeof x==='object' && Array.isArray(x.umbrales) && Array.isArray(x.calculos) && x.umbrales.length; }

/* ---------------- formato ---------------- */
function nf(x, dec){ return new Intl.NumberFormat(lang==='en'?'en-GB':'es-ES',{maximumFractionDigits:dec??0, minimumFractionDigits:dec??0}).format(x); }
function pct(x, dec){ return x==null||!isFinite(x) ? t('sin_dato') : nf(x, dec??1)+(lang==='en'?'%':' %'); }
function eur(x){ if(x==null||!isFinite(x)) return t('sin_dato'); const a=Math.abs(x); if(a>=1e6) return nf(x/1e6,2)+' M€'; if(a>=1e3) return nf(x/1e3,0)+' k€'; return nf(x,0)+' €'; }
function fF(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return lang==='en' ? d+'/'+m+'/'+y : d+'-'+m+'-'+y; }
function n(v){ return (v===null||v===undefined||v==='') ? null : Number(v); }
function ratio(a, b){ a=n(a); b=n(b); return (a==null||b==null||b===0) ? null : a/b*100; }

/* =========================================================
   Motor de cálculo (documento 12, secciones 4 a 6)
   Un valor que coincide con el límite entre dos tramos va al superior (>=).
   ========================================================= */
function calcular(E, P){
  const r = { s:[], alertas:[], mover:[] };
  const b = E.base||{}, pb = P.base;
  r.b1 = ratio(b.gobernadas, b.activas); r.b2 = ratio(b.valor_validado, b.valor_total); r.b3 = n(b.en_produccion);
  r.B1 = r.b1!=null && r.b1>=pb.b1_min; r.B2 = r.b2!=null && r.b2>=pb.b2_min; r.B3 = r.b3!=null && r.b3>=pb.b3_min;
  const prod = n(b.en_produccion);
  const S = (num, o) => { r.s[num-1] = Object.assign({n:num, punt:0, sd:false, valor:null, texto:''}, o); };

  // Señal 1 · Composición de la inversión
  { const e=E.s1||{}, p=P.s1, tot=n(e.coste_total);
    if(tot==null) S(1,{sd:true});
    else if(tot===0) S(1,{punt:0, texto:t('exploracion')});
    else { const at=ratio((n(e.coste_aumentar)||0)+(n(e.coste_transformar)||0), tot), tr=ratio(n(e.coste_transformar)||0, tot), sc=ratio(n(e.coste_sin_clasificar)||0, tot);
      let pu; if(sc>p.sin_clasificar_max) pu=0; else if(at>=p.t3 && tr>=p.transformar_min) pu=3; else if(at>=p.t2) pu=2; else pu=1;
      S(1,{punt:pu, valor:at, texto:pct(at)+(lang==='en'?' · Transform ':' · Transformar ')+pct(tr)+(sc>0?' · '+(lang==='en'?'unclassified ':'sin clasificar ')+pct(sc):''), tr}); } }
  // Señal 2 · Composición del valor
  { const e=E.s2||{}, p=P.s2, ef=n(e.eficiencias_validadas), re=n(e.retorno_validado);
    if(ef==null && re==null) S(2,{sd:true});
    else { const tot=(ef||0)+(re||0); if(tot===0) S(2,{punt:0, texto:t('exploracion')});
      else { const v=(re||0)/tot*100, ni=n(e.iniciativas_con_retorno)||0; let pu; if(v>=p.t3 && ni>=p.iniciativas_min) pu=3; else if(v>=p.t2) pu=2; else pu=1;
        S(2,{punt:pu, valor:v, texto:pct(v)+' · '+eur(re||0)+' / '+eur(tot)}); } } }
  // Señal 3 · Materialización
  { const e=E.s3||{}, p=P.s3, lib=n(e.horas_liberadas);
    if(lib==null || lib===0) S(3,{sd:true});
    else { const ma=n(e.horas_materializadas)||0, re=n(e.horas_reasignadas)||0, conv=ma+re, v=conv/lib*100; let pu;
      if(v>=p.t3 && conv>0 && re/conv*100>=p.reasignada_min) pu=3; else if(v>=p.t2) pu=2; else pu=1;
      S(3,{punt:pu, valor:v, texto:pct(v)+' · '+nf(conv)+' h / '+nf(lib)+' h'}); } }
  // Señal 4 · Profundidad del cambio

    case 'S45': return t('m_s45',{k:Math.max(1, Math.ceil(prod*P.s4.t2/100)), kv:n((E.s4||{}).itp2_verificada)??t('sin_dato'), j:Math.max(1, Math.ceil(prod*P.s5.t2/100)), jv:n((E.s5||{}).itp3_supervision)??t('sin_dato')});

    const G = grupo[nv==='optimizar'?'opt':'at']; G.sup++; const g5=dec(I.id,'G5'), p=plz[(I.clasificacion||{}).intensidad]||{}, suma=(p['3']||0)+(p['4']||0)+(p['5']||0);

  if(DC && DC.length){ const apr = d => d.resultado==='aprobada' || d.resultado==='aprobada_condiciones', en12 = d => en(d.fecha,12);

/* vuelve a leer el registro y renueva solo los datos que siguen marcados «desde T01» (o que estaban sin dato); lo corregido a mano se conserva */
function actualizarDesdeT01(c, reg){
  const d = desdeT01(reg, c.fecha_corte); let n = 0; c.de_t01 = c.de_t01 || {}; c.entradas = c.entradas || {};
  for(const [g] of GRUPOS){ const nuevo = d.entradas[g]||{}, act = c.entradas[g] = c.entradas[g]||{}, marcas = new Set(c.de_t01[g]||[]);
    for(const f of CAMPOS[g]){ const k = f[0]; if(f[1]==='txt') continue; const v = nuevo[k] ?? null, viene = (d.de_t01[g]||[]).includes(k);
      if(marcas.has(k)){ if(JSON.stringify(act[k] ?? null)!==JSON.stringify(v)) n++; act[k] = v; if(!viene) marcas.delete(k); }
      else if(act[k]==null && viene && v!=null){ act[k] = v; marcas.add(k); n++; } }
    c.de_t01[g] = [...marcas]; }
  c.origen = 't01'; c.t01 = Object.assign({}, c.t01, {organizacion:(reg.meta||{}).organizacion||null, iniciativas:reg.iniciativas.length, leido:hoy()});
  guardar(); render(); toast(t('ok_actualizar',{o:(reg.meta||{}).organizacion||'', n}));
}

/* ---------------- eventos ---------------- */
document.addEventListener('input', ev => {
  const el = ev.target, c = calcSel();
  if(el.dataset.g && c){
    const g = el.dataset.g, k = el.dataset.k; c.entradas[g] = c.entradas[g] || {};
    let v; if(el.dataset.tp==='bool') v = el.value==='' ? null : el.value==='1'; else if(el.dataset.tp==='txt') v = el.value; else v = el.value==='' ? null : Number(el.value);
    c.entradas[g][k] = v; if(c.de_t01 && c.de_t01[g]) c.de_t01[g] = c.de_t01[g].filter(x=>x!==k);
    guardar(); refrescarResultado(); return;
  }
  if(el.dataset.cab && c && ['notas','acciones'].includes(el.dataset.cab)){ c[el.dataset.cab] = el.value; guardar(); refrescarResultado(); return; }
  if(el.dataset.pg){ const u = D.umbrales.find(x=>x.version===UI.umb) || D.umbrales[D.umbrales.length-1]; if(el.value!=='') { u.parametros[el.dataset.pg][el.dataset.pk] = Number(el.value); guardar(); } return; }
  if(el.dataset.umeta){ const u = D.umbrales.find(x=>x.version===UI.umb) || D.umbrales[D.umbrales.length-1]; u[el.dataset.umeta] = el.value || null; guardar(); }
});
document.addEventListener('change', ev => {
  const el = ev.target, c = calcSel();
  if(el.id==='sel-lang'){ lang = UI.lang = el.value; guardar(); render(); return; }
  if(el.id==='sel-tema'){ UI.tema = el.value; temaSitioGuardar(el.value); aplicarTema(); guardar(); return; }
  if(el.dataset.cab==='sel'){ UI.sel = el.value; guardar(); render(); return; }
  if(el.dataset.cab && c && ['fecha_corte','tipo','version_umbrales'].includes(el.dataset.cab)){ c[el.dataset.cab] = el.value; guardar(); render(); return; }
  if(el.dataset.umb==='sel'){ UI.umb = el.value; guardar(); render(); return; }
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-acc]'); if(!b) return;
  const a = b.dataset.acc, c = calcSel();
  if(a==='aviso-legal'){ const d=document.getElementById('dlg-legal'); d.innerHTML='<div class="dlg-cab"><h2 id="legal-t">'+esc(t('legal_tit'))+'</h2><button type="button" data-acc="cerrar-legal">'+esc(t('legal_ok'))+'</button></div><div class="dlg-cuerpo"><p>'+esc(t('legal_txt'))+'</p></div>'; d.showModal(); return; }
  if(a==='cerrar-legal'){ document.getElementById('dlg-legal').close(); return; }
  if(a==='nuevo'){ const f=hoy(), x={id:nuevoId(f), fecha_corte:f, tipo:'seguimiento', version_umbrales:D.umbrales[D.umbrales.length-1].version, origen:'manual', entradas:vacias(), notas:'', acciones:''}; D.calculos.push(x); UI.sel=x.id; guardar(); location.hash='#/calculo'; render(); toast(t('ok_nuevo')); return; }
  if(a==='duplicar' && c){ const x=clon(c); x.id=nuevoId(c.fecha_corte); x.origen='manual'; delete x.de_t01; D.calculos.push(x); UI.sel=x.id; guardar(); render(); toast(t('ok_nuevo')); return; }
  if(a==='eliminar' && c){ if(!confirm(t('conf_eliminar',{f:fF(c.fecha_corte)}))) return; D.calculos=D.calculos.filter(x=>x!==c); UI.sel=null; guardar(); render(); toast(t('ok_eliminado')); return; }
  if(a==='imprimir'){ window.print(); return; }
  if(a==='ver'){ UI.sel=b.dataset.id; guardar(); location.hash='#/calculo'; render(); return; }
  if(a==='desde-t01'){ const reg = registroT01Local(); if(reg) crearDesdeT01(reg, null, false); else { toast(t('t01_local_no')); document.getElementById('f-t01').click(); } return; }
  if(a==='desde-t01-fichero'){ document.getElementById('f-t01').click(); return; }
  if(a==='actualizar-t01' && c){ const reg = registroT01Local(); if(!reg){ toast(t('t01_local_no')); return; } actualizarDesdeT01(c, reg); return; }
  if(a==='importar'){ document.getElementById('f-t14').click(); return; }
  if(a==='exportar'){ const blob=new Blob([JSON.stringify(datosExportables(),null,2)],{type:'application/json'}), u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download='t14_indice_transformacion_'+hoy()+'.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); toast(t('ok_export')); return; }
  if(a==='restaurar'){ if(!confirm(t('conf_restaurar'))) return; D=cargarDemo(); SevengDatos.reiniciar('demo'); UI.sel=null; UI.umb=null; guardar(); render(); return; }
  if(a==='vaciar'){ if(!confirm(t('conf_vaciar'))) return; D.calculos=[]; D.meta=Object.assign({}, D.meta, {datos_ilustrativos:false}); UI.sel=null; guardar(); render(); return; }
  if(a==='nueva-version'){ const nom=(document.getElementById('u-nueva').value||'').trim(); if(!nom){ document.getElementById('u-nueva').focus(); return; } if(D.umbrales.some(x=>x.version===nom)){ toast(t('ya_existe')); return; }
    const base = D.umbrales.find(x=>x.version===UI.umb) || D.umbrales[D.umbrales.length-1]; D.umbrales.push({version:nom, fecha:hoy(), origen:'v'+base.version, aprobado_por:null, nota:'', parametros:clon(base.parametros)}); UI.umb=nom; guardar(); render(); toast(t('ok_version',{v:nom})); return; }
  if(a==='recalcular' && c){ c.version_umbrales = UI.umb || D.umbrales[D.umbrales.length-1].version; guardar(); location.hash='#/calculo'; render(); return; }
});
/* el JSON completo de la calculadora, con los resultados calculados: lo que descarga «Exportar» y lo que se escribe en el fichero del equipo (D103) */
function datosExportables(){ const x=clon(D); x.version_esquema=VERSION_ESQUEMA; x.herramienta='T14'; x.meta=Object.assign({}, x.meta, {exportado:hoy(), aviso_legal:TX.es.legal_txt}); x.calculos.forEach((cc,i)=>{ cc.resultado = resultadoExport(D.calculos[i]); }); return x; }
function leerFichero(inp, fn){ const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ let x=null; try{ x=JSON.parse(rd.result); }catch(e){} inp.value=''; fn(x); }; rd.readAsText(f); }
document.getElementById('f-t14').addEventListener('change', ev => leerFichero(ev.target, x => {
  if(!valido(x)){ toast(t('err_json')); return; } if(!confirm(t('conf_importar'))) return;
  x.calculos.forEach(c=>{ delete c.resultado; }); D=x; UI.sel=null; UI.umb=null; guardar(); render(); toast(t('ok_import')); }));
document.getElementById('f-t01').addEventListener('change', ev => leerFichero(ev.target, reg => {
  if(!reg || !Array.isArray(reg.iniciativas) || !Array.isArray(reg.valores) || !Array.isArray(reg.decisiones_gate)){ toast(t('err_t01')); return; }
  crearDesdeT01(reg, null, false); }));
// ---- integración en el sitio: barra de navegación y tema general compartido (clave «seveng-tema»: salmon, claro o noche) ----
const LS_TEMA_SITIO = 'seveng-tema', LS_TEMA_AUTO = 'seveng-herramientas-tema-auto';
let TEMA_SITIO_LEIDO = false;
function temaSitioInicial(){
  if(TEMA_SITIO_LEIDO) return; TEMA_SITIO_LEIDO = true;
  try{ if(localStorage.getItem(LS_TEMA_AUTO)) return; const m = ({salmon:'salmon', claro:'claro', noche:'oscuro'})[localStorage.getItem(LS_TEMA_SITIO)]; if(m){ UI.tema = m; const s = document.getElementById('sel-tema'); if(s) s.value = m; } }catch(e){}
}
function temaSitioGuardar(v){
  try{ if(v === 'auto'){ localStorage.setItem(LS_TEMA_AUTO, '1'); } else { localStorage.removeItem(LS_TEMA_AUTO); localStorage.setItem(LS_TEMA_SITIO, ({salmon:'salmon', claro:'claro', oscuro:'noche'})[v] || 'salmon'); } }catch(e){}
}
// control «Ir a código» del sitio (D88): carga el índice del idioma activo, SEVEN-G/html/<idioma>/codigos.js
function irCodigoCargar(l){
  if(window.sevengIrCodigo && window.sevengIrCodigo.lang===l){ window.sevengIrCodigo.iniciar(); return; }
  const previo=document.getElementById('ir-codigo-js'); if(previo) previo.parentNode.removeChild(previo);
  const s=document.createElement('script'); s.id='ir-codigo-js'; s.src='../../html/'+l+'/codigos.js'; document.head.appendChild(s);
}
function sitioNav(){
  const n = document.getElementById('sitio-nav'); if(!n) return; const en = UI.lang === 'en', l = en ? 'en' : 'es';
  const e = [[en ? '../../../en/index.html' : '../../../index.html', en ? '⌂ Home' : '⌂ Portada'], ['../../html/'+l+'/00_SEVEN-G_Que_es_y_para_que_sirve.html', en ? 'What SEVEN-G is' : 'Qué es SEVEN-G'], ['../../html/'+l+'/index.html', en ? 'Library' : 'Biblioteca'], ['../../html/'+l+'/curso/M00_SEVEN-G_Curso_Guia_del_curso.html', en ? 'Course' : 'Curso'], ['../T01_registro_iniciativas/registro.html', en ? 'Initiative register' : 'Registro de iniciativas'], ['../T17_panel_consejo/index.html', en ? 'Board dashboard' : 'Panel del consejo']];
  n.setAttribute('aria-label', en ? 'Site' : 'Sitio');
  n.innerHTML = '<span class="sitio-marca" style="color:var(--papel)">SEVEN-G</span>' + e.map(x => '<a href="'+x[0]+'">'+x[1]+'</a>').join('') + '<span data-ir-codigo style="margin-left:auto"></span>';
  irCodigoCargar(l);
}function aplicarTema(){ temaSitioInicial(); if(UI.tema==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', UI.tema); }
window.addEventListener('hashchange', render);

/* ---------------- arranque ---------------- */
(function(){
  try{ const u = JSON.parse(lsGet(LS_UI)||'null'); if(u) UI = Object.assign(UI, u); }catch(e){}
  try{ const d = JSON.parse(lsGet(LS_DATOS)||'null'); if(valido(d)) D = d; }catch(e){}
  if(!D){ D = cargarDemo(); CARGA_DEMO = true; }
  const q = new URLSearchParams(location.search);
  if(q.get('lang')==='en' || q.get('lang')==='es') UI.lang = q.get('lang');
  else if(!lsGet(LS_UI) && /^en\b/i.test(navigator.language||'')) UI.lang = 'en';
  lang = UI.lang==='en' ? 'en' : 'es';
  aplicarTema(); render();
  /* D103: dónde viven los datos (este navegador, un fichero del equipo o la carpeta de datos de la copia de la compañía) */
  SevengDatos.iniciar({codigo:'T14', ficheroServidor:'../datos/T14_indice.json', cargadoDeDemo:CARGA_DEMO,
    obtener:()=>D, exportar:datosExportables, aplicar:d=>{ d.calculos.forEach(c=>{ delete c.resultado; }); D=d; UI.sel=null; UI.umb=null; guardar(); render(); }, validar:valido,
    esDemo:()=>!!(D.meta||{}).datos_ilustrativos, idioma:()=>lang, aviso:toast, nombreFichero:()=>'t14_indice_transformacion_'+hoy()+'.json',
    ayudaHref:()=>'../../html/'+lang+'/03_SEVEN-G_Herramientas_y_registro_de_iniciativas.html#'+(lang==='en'?'2-1-where-the-data-of-the-tools-lives':'2-1-donde-viven-los-datos-de-las-herramientas')});
  // D100: carga automática desde el registro T01 de este navegador. Con «?desde=t01» (enlace del registro) se crea el cálculo a la fecha de
  // referencia del registro o, si ya existe uno de ese origen y fecha, se actualiza; sin parámetro, un T14 recién abierto crea el cálculo
  // solo si el registro es real (con el registro de demostración, los datos de ejemplo ya lo contienen).
  const regLocal = registroT01Local();
  if(regLocal){
    const fRef = (regLocal.meta||{}).fecha_referencia || hoy(), existente = D.calculos.filter(c => c.origen==='t01' && c.fecha_corte===fRef).pop();
    if(q.get('desde')==='t01'){ if(existente){ UI.sel = existente.id; actualizarDesdeT01(existente, regLocal); } else crearDesdeT01(regLocal, fRef, true); try{ history.replaceState(null, '', location.pathname + (location.hash||'#/calculo')); }catch(e){} }
    else if(!lsGet(LS_DATOS) && !(regLocal.meta||{}).datos_ilustrativos) crearDesdeT01(regLocal, fRef, true);
  }
})();
</script>
