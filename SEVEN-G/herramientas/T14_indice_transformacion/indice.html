/* =========================================================
   Motor de cálculo (documento 12, secciones 4 a 6)
   Un valor que coincide con el límite entre dos tramos va al superior (>=).
   ========================================================= */
function calcular(E, P){
  const r = { s:[], alertas:[], mover:[] };
  const b = E.base||{}, pb = P.base;
  r.b1 = ratio(b.gobernadas, b.activas); r.b2 = ratio(b.valor_validado, b.valor_total); r.b3 = n(b.en_produccion);
  r.B1 = r.b1!=null && r.b1>=pb.b1_min; r.B2 = r.b2!=null && r.b2>=pb.b2_min; r.B3 = r.b3!=null && r.b3>=pb.b3_min;
  const prod = n(b.en_produccion);
  const S = (num, o) => { r.s[num-1] = Object.assign({n:num, punt:0, sd:false, valor:null, texto:''}, o); };

  // Señal 1 · Composición de la inversión
  { const e=E.s1||{}, p=P.s1, tot=n(e.coste_total);
    if(tot==null) S(1,{sd:true});
    else if(tot===0) S(1,{punt:0, texto:t('exploracion')});
    else { const at=ratio((n(e.coste_aumentar)||0)+(n(e.coste_transformar)||0), tot), tr=ratio(n(e.coste_transformar)||0, tot), sc=ratio(n(e.coste_sin_clasificar)||0, tot);
      let pu; if(sc>p.sin_clasificar_max) pu=0; else if(at>=p.t3 && tr>=p.transformar_min) pu=3; else if(at>=p.t2) pu=2; else pu=1;
      S(1,{punt:pu, valor:at, texto:pct(at)+(lang==='en'?' · Transform ':' · Transformar ')+pct(tr)+(sc>0?' · '+(lang==='en'?'unclassified ':'sin clasificar ')+pct(sc):''), tr}); } }
  // Señal 2 · Composición del valor
  { const e=E.s2||{}, p=P.s2, ef=n(e.eficiencias_validadas), re=n(e.retorno_validado);
    if(ef==null && re==null) S(2,{sd:true});
    else { const tot=(ef||0)+(re||0); if(tot===0) S(2,{punt:0, texto:t('exploracion')});
      else { const v=(re||0)/tot*100, ni=n(e.iniciativas_con_retorno)||0; let pu; if(v>=p.t3 && ni>=p.iniciativas_min) pu=3; else if(v>=p.t2) pu=2; else pu=1;
        S(2,{punt:pu, valor:v, texto:pct(v)+' · '+eur(re||0)+' / '+eur(tot)}); } } }
  // Señal 3 · Materialización
  { const e=E.s3||{}, p=P.s3, lib=n(e.horas_liberadas);
    if(lib==null || lib===0) S(3,{sd:true});
    else { const ma=n(e.horas_materializadas)||0, re=n(e.horas_reasignadas)||0, conv=ma+re, v=conv/lib*100; let pu;
      if(v>=p.t3 && conv>0 && re/conv*100>=p.reasignada_min) pu=3; else if(v>=p.t2) pu=2; else pu=1;
      S(3,{punt:pu, valor:v, texto:pct(v)+' · '+nf(conv)+' h / '+nf(lib)+' h'}); } }
  // Señal 4 · Profundidad del cambio
  { const e=E.s4||{}, p=P.s4, k=n(e.itp2_verificada);
    if(prod==null || k==null) S(4,{sd:true});
    else if(prod===0) S(4,{punt:0, texto:t('exploracion')});
    else if((n(e.sin_verificacion)||0)/prod*100>p.sin_verificacion_max) S(4,{sd:true, texto:t('sin_dato')+' (IT-P2 '+pct((n(e.sin_verificacion)||0)/prod*100,0)+')'});
    else { const v=k/prod*100; S(4,{punt: v>=p.t3?3:(v>=p.t2?2:1), valor:v, texto:pct(v)+' · '+k+' / '+prod}); } }
  // Señal 5 · Modelo operativo
  { const e=E.s5||{}, p=P.s5, k=n(e.itp3_supervision);
    if(prod==null || k==null) S(5,{sd:true});
    else if(prod===0) S(5,{punt:0, texto:t('exploracion')});
    else { const v=k/prod*100, u=n(e.unidades_completas)||0; S(5,{punt: (v>=p.t3 && u>=p.unidades_min)?3:(v>=p.t2?2:1), valor:v, texto:pct(v)+' · '+k+' / '+prod}); } }
  // Señal 6 · Ingresos habilitados por IA
  { const e=E.s6||{}, p=P.s6, h=n(e.ingresos_habilitados), tot=n(e.ingresos_totales);
    if(h==null || !tot) S(6,{sd:true});
    else { const v=h/tot*100; S(6,{punt: v>=p.t3?3:(v>=p.t2?2:1), valor:v, texto:pct(v,2)+' · '+eur(h)}); } }
  // Señal 7 · Paso a producción
  { const e=E.s7||{}, p=P.s7;
    if(e.hay_gates==null) S(7,{sd:true});
    else if(e.hay_gates===false) S(7,{punt:0, texto:t('exploracion')});
    else { const sup=n(e.at_superaron_g2), res=n(e.at_con_resultado)||0, pr=n(e.at_en_produccion)||0, ores=n(e.opt_con_resultado)||0, opr=n(e.opt_en_produccion)||0;
      if(sup===0) S(7,{punt:1, texto:'0 G2'});
      else if(sup==null && res===0) S(7,{sd:true});
      else { let cr=null, tr=null; const tasa = res>0 ? pr/res : null;
        if(tasa!=null){ if(ores>0 && opr>0) cr = tasa/(opr/ores); else cr = tasa/p.tasa_referencia; }
        const ma=n(e.mediana_at), mo=n(e.mediana_opt), pl=n(e.plazos_ref);
        if(ma!=null){ if(ores>0 && mo) tr = ma/mo; else if(pl) tr = ma/pl; }
        let pu; if(cr==null) pu=2; else if(cr<p.cr2) pu=1; else if(cr>=p.cr3 && tr!=null && tr<=p.tr3_max && res>=p.resultado_min) pu=3; else pu=2;
        S(7,{punt:pu, valor:cr, texto:t('cr')+' '+(cr==null?t('sin_dato'):nf(cr,2))+' · '+t('tr')+' '+(tr==null?t('sin_dato'):nf(tr,1)), cr, tr}); } } }
  // Señal 8 · Decisión del consejo
  { const e=E.s8||{}, p=P.s8;
    if(e.tesis_aprobada==null) S(8,{sd:true});
    else if(e.tesis_aprobada===false) S(8,{punt:0, texto:lang==='en'?'No thesis':'Sin tesis'});
    else { const a=n(e.apuestas_transformar)||0, rv=n(e.revisiones)||0, de=n(e.decisiones_etapa)||0; let pu;
      if(a===0) pu=1; else if(e.con_limite_etapa===true && rv>=p.revisiones_min && de>=p.decisiones_min) pu=3; else pu=2;
      S(8,{punt:pu, valor:a, texto:(lang==='en'?'Bets ':'Apuestas ')+a+' · '+(lang==='en'?'reviews ':'revisiones ')+rv+' · '+(lang==='en'?'stage decisions ':'decisiones de etapa ')+de}); } }

  const sc = i => r.s[i-1].punt;
  r.suma = r.s.reduce((a,x)=>a+x.punt,0);
  r.cobertura = r.s.filter(x=>!x.sd).length;
  r.provisional = r.cobertura < P.perfil.cobertura_min;
  // Paso 1 · perfil evidenciado
  const condCurso = [['B1',r.B1],['B2',r.B2],['S8',sc(8)>=2],['S7',sc(7)>=2],['S26',sc(2)>=2||sc(6)>=2],['S45',sc(4)>=2||sc(5)>=2],['SUMA',r.suma>=P.perfil.suma_min]];
  const condEscala = [['B1',r.B1],['B2',r.B2],['B3',r.B3],['S3',sc(3)>=2]];
  const condTactica = [['TAC',(n(b.produccion_con_valor)||0)>=1]];
  r.evidenciado = condCurso.every(c=>c[1]) ? 'curso' : condEscala.every(c=>c[1]) ? 'escala' : condTactica.every(c=>c[1]) ? 'tactica' : 'exploracion';
  // Paso 2 · contraste con la declaración
  const s1 = E.s1||{}, tot1 = n(s1.coste_total);
  r.d2v = tot1 ? (n(s1.coste_transformar)||0)/tot1*100 : null;
  r.d1 = (E.declaracion||{}).d1===true; r.d2 = r.d2v!=null && r.d2v>=P.perfil.d2_transformar_min; r.d3 = (E.declaracion||{}).d3===true;
  r.D = r.d1 || r.d2 || r.d3;
  r.asignado = (r.D && r.evidenciado!=='curso') ? 'declarada' : r.evidenciado;
  r.subyacente = r.asignado==='declarada' ? r.evidenciado : null;
  // Sobredeclaración de ambición
  const so = E.sobredeclaracion||{};
  r.sobre = ratio(so.real_inferior, so.real_registrada); r.sobreT = ratio(so.transf_real_inferior, so.transf_real_registrada);
  // Alertas complementarias (sección 5.3)
  if(r.evidenciado==='curso' && r.sobreT!=null && r.sobreT>=P.sobredeclaracion.transformar) r.alertas.push(['a_fragil', t('a_fragil_t')]);
  if(sc(1)===1 && sc(3)===1) r.alertas.push(['a_nomat', t('a_nomat_t')]);
  if(sc(1)>=2 && sc(7)===1) r.alertas.push(['a_atasc', t('a_atasc_t')]);
  if((sc(2)>=2 || sc(6)>=2) && sc(8)<=1) r.alertas.push(['a_sincons', t('a_sincons_t')]);
  if((n((E.s5||{}).sin_supervision)||0)>0) r.alertas.push(['a_sinsup', t('a_sinsup_t',{n:n(E.s5.sin_supervision)})]);
  if(r.sobre!=null && r.sobre>=P.sobredeclaracion.cartera) r.alertas.push(['a_sobre', t('a_sobre_t',{p:pct(r.sobre,0)})]);
  if(r.sobreT!=null && r.sobreT>=P.sobredeclaracion.transformar) r.alertas.push(['a_sobre_tr', t('a_sobre_tr_t',{p:pct(r.sobreT,0)})]);
  // Qué movería el perfil (sección 10): condiciones sin cumplir del perfil siguiente
  r.objetivo = (r.D || r.evidenciado==='escala') ? 'curso' : ({exploracion:'tactica', tactica:'escala', curso:null})[r.evidenciado];
  if(r.objetivo && r.evidenciado!=='curso'){
    const conds = r.objetivo==='curso' ? condCurso : r.objetivo==='escala' ? condEscala : condTactica;
    for(const [c, ok] of conds){ if(ok) continue; r.mover.push(textoMover(c, E, P, r)); }
  }
  return r;
}
function textoMover(c, E, P, r){
  const b=E.base||{}, prod=n(b.en_produccion)||0;
  switch(c){
    case 'B1': { const act=n(b.activas)||0, g=n(b.gobernadas)||0; return t('m_b1',{u:P.base.b1_min, v:pct(r.b1,0), n:Math.max(0, Math.ceil(act*P.base.b1_min/100)-g)}); }
    case 'B2': return t('m_b2',{u:P.base.b2_min, v:pct(r.b2,0)});
    case 'B3': return t('m_b3',{u:P.base.b3_min, v:r.b3??t('sin_dato')});
    case 'S3': { const e=E.s3||{}, lib=n(e.horas_liberadas)||0; if(!lib) return t('m_s3_sd',{u:P.s3.t2}); const conv=(n(e.horas_materializadas)||0)+(n(e.horas_reasignadas)||0); return t('m_s3',{u:P.s3.t2, v:pct(r.s[2].valor,0), h:nf(Math.max(0, Math.ceil(lib*P.s3.t2/100-conv)))}); }
    case 'S8': return t('m_s8');
    case 'S7': return t('m_s7',{u:nf(P.s7.cr2,1), v:r.s[6].cr!=null?nf(r.s[6].cr,2):t('sin_dato')});
    case 'S26': { const e=E.s2||{}, ef=n(e.eficiencias_validadas)||0, re=n(e.retorno_validado), g=E.s6||{}, tot=n(g.ingresos_totales);
      return t('m_s26',{r:eur(ef*P.s2.t2/(100-P.s2.t2)), rv:eur(re), i:tot?eur(tot*P.s6.t2/100):t('sin_dato'), iv:eur(n(g.ingresos_habilitados))}); }
    case 'S45': return t('m_s45',{k:Math.max(1, Math.ceil(prod*P.s4.t2/100)), kv:n((E.s4||{}).itp2_verificada)??t('sin_dato'), j:Math.max(1, Math.ceil(prod*P.s5.t2/100)), jv:n((E.s5||{}).itp3_supervision)??t('sin_dato')});
    case 'SUMA': return t('m_suma',{u:P.perfil.suma_min, v:r.suma});
    case 'TAC': return t('m_tactica');
  }
  return c;
}

/* =========================================================
   Cálculo desde un registro T01 (esquema 0.1 a 0.3): lo que el registro contiene
   ========================================================= */
function desdeT01(reg, fecha){
  const fc = new Date(fecha+'T00:00:00'), dia = 864e5;
  const en = (f, meses) => { if(!f) return true; const d = new Date(f+'T00:00:00'); return d<=fc && (fc-d)/dia <= meses*30.44; };
  const ini = reg.iniciativas||[], val = reg.valores||[], dg = reg.decisiones_gate||[];
  const esf = I => (I.clasificacion||{}).esfera_principal, per = ini.filter(I => /^0[1-7]$/.test(esf(I)||''));
  const nivel = I => (I.clasificacion||{}).ambicion_real || (I.clasificacion||{}).ambicion_confirmada || null;
  const cerrada = I => ['parada','retirada'].includes((I.ciclo||{}).estado);
  const enProd = I => ['en_produccion','pendiente_g7'].includes((I.ciclo||{}).estado);
  // último importe realizado de un tipo en la ventana, por área (esquema 0.3: una iniciativa transversal registra cada unidad aparte)
  const ultimo = (id, tipo, meses) => {
    const ult = {};
    for(const v of val){ if(v.iniciativa!==id || v.momento!=='realizado' || v.tipo!==tipo || !en(v.fecha, meses) || v.importe==null) continue;
      const k = v.area||''; if(!ult[k] || String(v.fecha||'')>String(ult[k].fecha||'')) ult[k] = v; }
    const l = Object.values(ult); if(!l.length) return null;
    return { importe: l.reduce((a,v)=>a+v.importe,0), validado: l.filter(v=>v.estado==='validado').reduce((a,v)=>a+v.importe,0) };
  };
  const activas = ini.filter(I => !cerrada(I));
  const gob = activas.filter(I => (I.ciclo||{}).estado!=='registrada' && dg.some(d=>d.iniciativa===I.id && d.resultado) && ((I.clasificacion||{}).ambicion_confirmada || (I.clasificacion||{}).ambicion_real));
  let vVal=0, vTot=0; for(const I of ini) for(const tp of ['eficiencias','retorno']){ const v=ultimo(I.id,tp,12); if(v){ vTot+=v.importe; vVal+=v.validado; } }
  const prod = per.filter(enProd);
  const prodValor = prod.filter(I => ['eficiencias','retorno'].some(tp => ultimo(I.id,tp,12)));
  // Señal 1: inversión realizada (acumulada) + último coste recurrente realizado en la ventana
  const coste = {optimizar:0, aumentar:0, transformar:0, sin:0}; let cTot=0;
  for(const I of per){ const inv=((I.inversion||{}).realizada)||0, cr=ultimo(I.id,'coste_recurrente',12), c=inv+(cr?cr.importe:0); if(!c) continue; cTot+=c; coste[nivel(I)||'sin']+=c; }
  // Señal 2: último importe validado de eficiencias y retorno
  let ef=0, re=0, nRe=0; for(const I of per){ const e=ultimo(I.id,'eficiencias',12), r=ultimo(I.id,'retorno',12); if(e) ef+=e.validado; if(r && r.validado>0){ re+=r.validado; nRe++; } }
  // Señal 7: G2 superado en 24 meses y resultado (G5, parada o estancada más del doble de los plazos de las fases 3 a 5)
  const plz = ((reg.meta||{}).configuracion||{}).plazos_fase || {};
  const ok = d => d && ['continuar','continuar_condiciones'].includes(d.resultado);
  const dec = (id, g) => dg.filter(d => d.iniciativa===id && d.gate===g && ok(d)).sort((a,b)=>String(a.fecha_decision).localeCompare(String(b.fecha_decision)))[0];
  const grupo = {at:{sup:0,res:0,pr:0,dias:[],pl:[]}, opt:{sup:0,res:0,pr:0,dias:[],pl:[]}};
  for(const I of per){ const nv=nivel(I); if(!nv) continue; const g2=dec(I.id,'G2'); if(!g2 || !en(g2.fecha_decision,24)) continue;
    const G = grupo[nv==='optimizar'?'opt':'at']; G.sup++; const g5=dec(I.id,'G5'), p=plz[(I.clasificacion||{}).intensidad]||{}, suma=(p['3']||0)+(p['4']||0)+(p['5']||0);
    if(suma) G.pl.push(suma);
    const dias = g5 ? (new Date(g5.fecha_decision)-new Date(g2.fecha_decision))/dia : (fc-new Date(g2.fecha_decision))/dia;
    if(g5 && new Date(g5.fecha_decision)<=fc){ G.res++; G.pr++; G.dias.push(dias); }
    else if((I.ciclo||{}).estado==='parada' || (suma && dias>2*suma)) G.res++; }
  const med = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=Math.floor(s.length/2); return Math.round(s.length%2 ? s[m] : (s[m-1]+s[m])/2); };
  const hayGates = dg.some(d => d.fecha_decision && en(d.fecha_decision,12));
  // Sobredeclaración (24 meses)
  const rango = {optimizar:1, aumentar:2, transformar:3};
  const conReal = per.filter(I => (I.clasificacion||{}).ambicion_real && (I.clasificacion||{}).ambicion_confirmada);
  const inf = I => rango[I.clasificacion.ambicion_real] < rango[I.clasificacion.ambicion_confirmada];
  const trReal = conReal.filter(I => I.clasificacion.ambicion_confirmada==='transformar');
  // Esquema 0.5 de T01 (opcional): evidencia del índice por iniciativa, oferta habilitada por IA y decisiones del consejo.
  // Si el registro no trae esos campos, las señales 3 a 6 y 8 quedan «sin dato» para completarlas a mano (nunca se estiman).
  const conIndice = ini.some(I => I.indice && typeof I.indice==='object');
  const capac = per.map(I => (I.indice||{}).capacidad).filter(c => c && c.horas_liberadas!=null);
  const s3 = capac.length ? {horas_liberadas:capac.reduce((a,c)=>a+(c.horas_liberadas||0),0), horas_materializadas:capac.reduce((a,c)=>a+(c.horas_materializadas||0),0), horas_reasignadas:capac.reduce((a,c)=>a+(c.horas_reasignadas||0),0)} : {horas_liberadas:null, horas_materializadas:null, horas_reasignadas:null};
  const ver = (I,k) => ((I.indice||{})[k]) || null, verif = (I,k) => { const v=ver(I,k); return !!v && v.estado==='verificada'; };
  const resp = (I,k) => (((I.clasificacion_ambicion||{}).respuestas)||{})[k]===true;

  const DC = Array.isArray(reg.decisiones_consejo) ? reg.decisiones_consejo.filter(d => d.fecha && d.fecha<=fecha) : null;
  let s8 = {tesis_aprobada:null, apuestas_transformar:null, con_limite_etapa:null, revisiones:null, decisiones_etapa:null}, d1 = null;
  if(DC && DC.length){ const apr = d => d.resultado==='aprobada' || d.resultado==='aprobada_condiciones', en12 = d => en(d.fecha,12);
    const tesis = DC.filter(d=>d.asunto==='tesis' && apr(d)).sort((a,b)=>a.fecha<b.fecha?-1:1).pop() || null, ap = DC.filter(d=>d.asunto==='transformar_g2' && apr(d) && en12(d));

    s8,

    sobredeclaracion:{real_registrada:conReal.length, real_inferior:conReal.filter(inf).length, transf_real_registrada:trReal.length, transf_real_inferior:trReal.filter(inf).length}

  const marca = (g, o) => { const k = Object.keys(o).filter(x => o[x]!=null); if(k.length) deT01[g] = k; };

  return {entradas:E, de_t01:deT01};

  return '<h1>'+esc(t('tit_datos'))+'</h1><p class="ayuda">'+esc(t('sub_datos'))+'</p><div class="fila">'+
    '<button type="button" class="primario" data-acc="exportar">'+esc(t('exportar'))+'</button><button type="button" data-acc="importar">'+esc(t('importar'))+'</button>'+
    '<button type="button" data-acc="desde-t01">'+esc(t('cargar_t01'))+'</button><button type="button" data-acc="restaurar">'+esc(t('restaurar'))+'</button><button type="button" class="peligro" data-acc="vaciar">'+esc(t('vaciar'))+'</button></div>'+
    '<p class="ayuda" style="margin-top:12px">'+esc(t('pie_priv'))+'</p>';
}

/* ---------------- render ---------------- */
function ruta(){ const v=(location.hash||'#/calculo').replace(/^#\/?/,'').split('/')[0]; return ['calculo','evolucion','umbrales','datos'].includes(v)?v:'calculo'; }
function render(){
  document.documentElement.lang = lang;
  document.title = t('app');
  document.getElementById('txt-app').textContent = t('app');
  document.getElementById('saltar').textContent = t('saltar');
  document.getElementById('lbl-lang').textContent = t('idioma'); document.getElementById('lbl-tema').textContent = t('tema');
  const st = document.getElementById('sel-tema'); st.options[0].text=t('t_auto'); st.options[1].text=t('t_claro'); st.options[2].text=t('t_oscuro'); st.value=UI.tema;
  document.getElementById('sel-lang').value = lang;
  document.getElementById('btn-legal').textContent = t('legal_link');
  const ld = document.getElementById('lnk-doc'); ld.textContent = t('doc12'); ld.href = t('doc12_href');
  document.getElementById('lnk-t01').textContent = t('reg_t01');
  document.getElementById('nav').setAttribute('aria-label', t('vistas'));
  const v = ruta();
  document.getElementById('nav').innerHTML = ['calculo','evolucion','umbrales','datos'].map(x=>'<a href="#/'+x+'"'+(x===v?' aria-current="page"':'')+'>'+esc(t('v_'+x))+'</a>').join('');
  document.getElementById('aviso-demo').innerHTML = (D.meta||{}).datos_ilustrativos ? '<div>'+esc(t('demo'))+'</div>' : '';
  const m = document.getElementById('principal');
  m.innerHTML = v==='evolucion' ? vistaEvolucion() : v==='umbrales' ? vistaUmbrales() : v==='datos' ? vistaDatos() : vistaCalculo();
  document.getElementById('pie').innerHTML = '<p class="pie-legal"><b>'+esc(t('legal_tit'))+'.</b> '+esc(t('legal_txt'))+'</p><span>'+esc(t('pie_lic'))+'</span><span>'+esc(t('pie_priv'))+'</span>';
}
function refrescarResultado(){ const c = calcSel(), e = document.getElementById('res'); if(c && e) e.innerHTML = resultadoHTML(c); }

/* ---------------- eventos ---------------- */
document.addEventListener('input', ev => {
  const el = ev.target, c = calcSel();
  if(el.dataset.g && c){
    const g = el.dataset.g, k = el.dataset.k; c.entradas[g] = c.entradas[g] || {};
    let v; if(el.dataset.tp==='bool') v = el.value==='' ? null : el.value==='1'; else if(el.dataset.tp==='txt') v = el.value; else v = el.value==='' ? null : Number(el.value);
    c.entradas[g][k] = v; if(c.de_t01 && c.de_t01[g]) c.de_t01[g] = c.de_t01[g].filter(x=>x!==k);
    guardar(); refrescarResultado(); return;
  }
  if(el.dataset.cab && c && ['notas','acciones'].includes(el.dataset.cab)){ c[el.dataset.cab] = el.value; guardar(); refrescarResultado(); return; }
  if(el.dataset.pg){ const u = D.umbrales.find(x=>x.version===UI.umb) || D.umbrales[D.umbrales.length-1]; if(el.value!=='') { u.parametros[el.dataset.pg][el.dataset.pk] = Number(el.value); guardar(); } return; }
  if(el.dataset.umeta){ const u = D.umbrales.find(x=>x.version===UI.umb) || D.umbrales[D.umbrales.length-1]; u[el.dataset.umeta] = el.value || null; guardar(); }
});
document.addEventListener('change', ev => {
  const el = ev.target, c = calcSel();
  if(el.id==='sel-lang'){ lang = UI.lang = el.value; guardar(); render(); return; }
  if(el.id==='sel-tema'){ UI.tema = el.value; aplicarTema(); guardar(); return; }
  if(el.dataset.cab==='sel'){ UI.sel = el.value; guardar(); render(); return; }
  if(el.dataset.cab && c && ['fecha_corte','tipo','version_umbrales'].includes(el.dataset.cab)){ c[el.dataset.cab] = el.value; guardar(); render(); return; }
  if(el.dataset.umb==='sel'){ UI.umb = el.value; guardar(); render(); return; }
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-acc]'); if(!b) return;
  const a = b.dataset.acc, c = calcSel();
  if(a==='aviso-legal'){ const d=document.getElementById('dlg-legal'); d.innerHTML='<div class="dlg-cab"><h2 id="legal-t">'+esc(t('legal_tit'))+'</h2><button type="button" data-acc="cerrar-legal">'+esc(t('legal_ok'))+'</button></div><div class="dlg-cuerpo"><p>'+esc(t('legal_txt'))+'</p></div>'; d.showModal(); return; }
  if(a==='cerrar-legal'){ document.getElementById('dlg-legal').close(); return; }
  if(a==='nuevo'){ const f=hoy(), x={id:nuevoId(f), fecha_corte:f, tipo:'seguimiento', version_umbrales:D.umbrales[D.umbrales.length-1].version, origen:'manual', entradas:vacias(), notas:'', acciones:''}; D.calculos.push(x); UI.sel=x.id; guardar(); location.hash='#/calculo'; render(); toast(t('ok_nuevo')); return; }
  if(a==='duplicar' && c){ const x=clon(c); x.id=nuevoId(c.fecha_corte); x.origen='manual'; delete x.de_t01; D.calculos.push(x); UI.sel=x.id; guardar(); render(); toast(t('ok_nuevo')); return; }
  if(a==='eliminar' && c){ if(!confirm(t('conf_eliminar',{f:fF(c.fecha_corte)}))) return; D.calculos=D.calculos.filter(x=>x!==c); UI.sel=null; guardar(); render(); toast(t('ok_eliminado')); return; }
  if(a==='imprimir'){ window.print(); return; }
  if(a==='ver'){ UI.sel=b.dataset.id; guardar(); location.hash='#/calculo'; render(); return; }
  if(a==='desde-t01'){ document.getElementById('f-t01').click(); return; }
  if(a==='importar'){ document.getElementById('f-t14').click(); return; }
  if(a==='exportar'){ const x=clon(D); x.version_esquema=VERSION_ESQUEMA; x.herramienta='T14'; x.meta=Object.assign({}, x.meta, {exportado:hoy(), aviso_legal:TX.es.legal_txt});
    x.calculos.forEach((cc,i)=>{ cc.resultado = resultadoExport(D.calculos[i]); });
    const blob=new Blob([JSON.stringify(x,null,2)],{type:'application/json'}), u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download='t14_indice_transformacion_'+hoy()+'.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); toast(t('ok_export')); return; }
  if(a==='restaurar'){ if(!confirm(t('conf_restaurar'))) return; D=cargarDemo(); UI.sel=null; UI.umb=null; guardar(); render(); return; }
  if(a==='vaciar'){ if(!confirm(t('conf_vaciar'))) return; D.calculos=[]; D.meta=Object.assign({}, D.meta, {datos_ilustrativos:false}); UI.sel=null; guardar(); render(); return; }
  if(a==='nueva-version'){ const nom=(document.getElementById('u-nueva').value||'').trim(); if(!nom){ document.getElementById('u-nueva').focus(); return; } if(D.umbrales.some(x=>x.version===nom)){ toast(t('ya_existe')); return; }
    const base = D.umbrales.find(x=>x.version===UI.umb) || D.umbrales[D.umbrales.length-1]; D.umbrales.push({version:nom, fecha:hoy(), origen:'v'+base.version, aprobado_por:null, nota:'', parametros:clon(base.parametros)}); UI.umb=nom; guardar(); render(); toast(t('ok_version',{v:nom})); return; }
  if(a==='recalcular' && c){ c.version_umbrales = UI.umb || D.umbrales[D.umbrales.length-1].version; guardar(); location.hash='#/calculo'; render(); return; }
});
function leerFichero(inp, fn){ const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ let x=null; try{ x=JSON.parse(rd.result); }catch(e){} inp.value=''; fn(x); }; rd.readAsText(f); }
document.getElementById('f-t14').addEventListener('change', ev => leerFichero(ev.target, x => {
  if(!valido(x)){ toast(t('err_json')); return; } if(!confirm(t('conf_importar'))) return;
  x.calculos.forEach(c=>{ delete c.resultado; }); D=x; UI.sel=null; UI.umb=null; guardar(); render(); toast(t('ok_import')); }));
document.getElementById('f-t01').addEventListener('change', ev => leerFichero(ev.target, reg => {
  if(!reg || !Array.isArray(reg.iniciativas) || !Array.isArray(reg.valores) || !Array.isArray(reg.decisiones_gate)){ toast(t('err_t01')); return; }
  const def = (reg.meta||{}).fecha_referencia || hoy(); let f = prompt(t('t01_pide_fecha'), def); if(f===null) return; f = /^\d{4}-\d{2}-\d{2}$/.test(f.trim()) ? f.trim() : def;
  const d = desdeT01(reg, f), x = {id:nuevoId(f), fecha_corte:f, tipo:'seguimiento', version_umbrales:D.umbrales[D.umbrales.length-1].version, origen:'t01', entradas:d.entradas, de_t01:d.de_t01, notas:t('t01_nota',{f:fF(f)}), acciones:''};
  D.calculos.push(x); UI.sel=x.id; guardar(); location.hash='#/calculo'; render(); toast(t('ok_t01',{o:(reg.meta||{}).organizacion||'', f:fF(f)})); }));
function aplicarTema(){ if(UI.tema==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', UI.tema); }
window.addEventListener('hashchange', render);

/* ---------------- arranque ---------------- */
(function(){
  try{ const u = JSON.parse(lsGet(LS_UI)||'null'); if(u) UI = Object.assign(UI, u); }catch(e){}
  try{ const d = JSON.parse(lsGet(LS_DATOS)||'null'); if(valido(d)) D = d; }catch(e){}
  if(!D) D = cargarDemo();
  const q = new URLSearchParams(location.search);
  if(q.get('lang')==='en' || q.get('lang')==='es') UI.lang = q.get('lang');
  else if(!lsGet(LS_UI) && /^en\b/i.test(navigator.language||'')) UI.lang = 'en';
  lang = UI.lang==='en' ? 'en' : 'es';
  aplicarTema(); render();
})();
</script>
</body>
