h1{font-size:clamp(24px,4vw,34px);margin:4px 0 6px;font-weight:600}

.cab{border-bottom:1px solid var(--regla);background:var(--papel)}

.aviso-demo{max-width:1280px;margin:0 auto;padding:0 16px}

main{max-width:1280px;margin:0 auto;padding:6px 16px 48px}

.pie-legal{flex:1 1 100%;margin:0 0 8px;font-size:12px;line-height:1.5;color:var(--tinta-2)}
.pie-legal b{color:var(--negro)}
button,.btn,select,input,textarea{font:inherit;color:var(--tinta)}
.btn,button{cursor:pointer;background:var(--papel);border:1px solid var(--regla);border-radius:2px;padding:7px 11px;font-weight:600;font-size:14px;line-height:1.2;min-height:36px;text-decoration:none;display:inline-block}
.btn:hover,button:hover{border-color:var(--tinta-2)}
.btn.primario,button.primario{background:var(--negro);color:var(--papel);border-color:var(--negro)}
.btn.peligro,button.peligro{border-color:var(--claret);color:var(--claret)}
button.pestana{background:var(--papel)}
button.pestana[aria-pressed="true"]{background:var(--negro);color:var(--papel);border-color:var(--negro)}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--tarjeta);border:1px solid var(--regla);border-radius:2px;padding:6px 8px;min-height:36px;max-width:100%}
textarea{width:100%;min-height:56px}
label{font-weight:600;font-size:13px;color:var(--tinta-2)}
.campo{display:flex;flex-direction:column;gap:3px;min-width:0}
.campo input,.campo select,.campo textarea{width:100%}

.ayuda{font-size:12.5px;color:var(--tinta-3)}
.enlace-btn,button.enlace-btn{background:none;border:0;padding:0;min-height:0;color:var(--oxford);text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:inherit;line-height:inherit;cursor:pointer}

.et.ok{background:var(--ok-bg);border-color:var(--teal)}
.et.med{background:var(--med-bg);border-color:var(--ambar)}
.et.ko{background:var(--ko-bg);border-color:var(--claret)}
.et.info{background:var(--info-bg);border-color:var(--oxford)}
.sd{font-style:italic;color:var(--tinta-3)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.tabla{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 16px}
.tabla th{text-align:left;font-size:12.5px;color:var(--tinta-2);border-bottom:2px solid var(--negro);padding:6px 10px 6px 0;vertical-align:bottom}
.tabla td{border-bottom:1px solid var(--regla);padding:7px 10px 7px 0;vertical-align:top}
.tabla td small{display:block;color:var(--tinta-3);font-size:12px}
.tabla input,.tabla select,.tabla textarea{width:100%}
.tblx{overflow-x:auto;max-width:100%}

  .tabla.resp thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  .tabla.resp td::before{content:attr(data-l);font-size:12px;font-weight:600;color:var(--tinta-3)}

}

.global{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:0 24px;border-top:1px solid var(--negro);border-bottom:1px solid var(--regla);padding:12px 0;margin:10px 0 6px}
@media (max-width:760px){.global{grid-template-columns:1fr}}
.global .rotulo{font-size:12.5px;font-weight:700;color:var(--tinta-3);text-transform:uppercase;letter-spacing:.05em}
.global .nombre{font:600 clamp(24px,3.4vw,34px)/1.15 var(--serif);color:var(--negro);margin:4px 0 6px}

.global .cifras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;align-content:start}
.global .cifras b{display:block;font:600 24px/1.1 var(--serif);color:var(--oxford)}
.global .cifras span{font-size:12.5px;color:var(--tinta-2)}
.escala{display:flex;gap:3px;margin:10px 0 4px;flex-wrap:wrap}
.escala span{flex:1 1 90px;font-size:12px;padding:5px 6px;border-top:4px solid var(--regla);color:var(--tinta-3)}
.escala span.act{border-top-color:var(--oxford);color:var(--negro);font-weight:700;background:var(--info-bg)}
.barras{display:inline-flex;gap:2px;vertical-align:middle}

#toast.ver{display:block}

const GUIA = {
es:{
 entrev:['Cada dimensión se cubre con al menos dos entrevistas a personas de funciones distintas (sección 3).','Guion de 45–60 minutos: rol y decisiones que toma; práctica real en los últimos 12 meses; dónde está la evidencia; casos en que la práctica no se aplicó; mejoras en curso.','<b>Una entrevista es un indicio, no una evidencia.</b> Sirve para localizar evidencias y contrastar la práctica. Un "Sí" exige triangulación: documento aprobado, registro o sistema que muestre su aplicación y, cuando proceda, testimonio de quien la aplica.','Las respuestas se anonimizan por rol en el informe.'],
 valida:'Una evidencia es válida si <b>existe</b>, es <b>trazable</b> (autor, fecha y versión), está <b>aprobada</b> por quien corresponde, está <b>vigente</b> (en vigor o de los últimos 12 meses), muestra <b>aplicación</b> y es <b>anterior a la fecha de corte</b>. No son evidencias las presentaciones sin aprobación, los borradores (salvo donde se piden), las declaraciones verbales ni los documentos elaborados para la evaluación: estos se anotan como acciones en curso.',
 resp:[['Sí','La evidencia es válida y, si la pregunta se refiere a una práctica, la muestra la cumple en su totalidad.'],['Parcial','Hay evidencia válida pero la cobertura es incompleta: la muestra cumple en un 80 % o más, o falta un elemento no esencial. Computa como no cumplido para el nivel.'],['No','No hay evidencia válida o la muestra cumple por debajo del 80 %. El informe distingue "No, sin evidencia" de "No, evidencia contraria".'],['No aplica','Solo en preguntas (si aplica), con justificación verificada. Computa como cumplido.']],
 muestras:'Las preguntas sobre prácticas que deben aplicarse a "todas" las iniciativas o sistemas se verifican sobre una muestra del registro (T01) o del inventario (T02). La muestra es <b>estratificada</b>: incluye, si existen, al menos una iniciativa Enterprise, una en producción, una de Aumentar o Transformar, una de terceros y una de IA generativa o agentes. La selecciona el equipo evaluador, no el área evaluada.',
 verif:'El verificador independiente revisa <b>todas</b> las respuestas "Sí" de D1 y D6 (por su efecto en el nivel global), todas las preguntas <b>(§14)</b> y al menos el 25 % de las demás respuestas "Sí", elegidas por él.',
 tam:[['1–5','Todas'],['6–20','5'],['21–60','8'],['Más de 60','12']]
},
en:{
 entrev:['Each dimension is covered by at least two interviews with people from different functions (section 3).','45–60 minute script: role and decisions taken; actual practice in the last 12 months; where the evidence is; cases in which the practice was not applied; improvements under way.','<b>An interview is an indication, not evidence.</b> It serves to locate evidence and corroborate the practice. A "Yes" requires triangulation: an approved document, a record or system showing its application and, where appropriate, testimony from whoever applies it.','Answers are anonymised by role in the report.'],
 valida:'Evidence is valid if it <b>exists</b>, is <b>traceable</b> (author, date and version), is <b>approved</b> by whoever is responsible, is <b>current</b> (in force or from the last 12 months), shows <b>application</b> and <b>predates the cut-off date</b>. Presentations without approval, drafts (except where requested), verbal statements and documents prepared for the assessment are not evidence: these are noted as actions under way.',
 resp:[['Yes','The evidence is valid and, if the question refers to a practice, the sample complies in full.'],['Partial','There is valid evidence but coverage is incomplete: the sample complies at 80 % or more, or a non-essential element is missing. It counts as not met for the level.'],['No','There is no valid evidence or the sample complies below 80 %. The report distinguishes "No, no evidence" from "No, contrary evidence".'],['Not applicable','Only for questions marked (if applicable), with verified justification. It counts as met.']],
 muestras:'Questions about practices that must be applied to "all" initiatives or systems are verified on a sample from the register (T01) or the inventory (T02). The sample is <b>stratified</b>: it includes, where they exist, at least one Enterprise initiative, one in production, one Augment or Transform initiative, one third-party initiative and one generative AI or agent initiative. It is selected by the assessment team, not by the assessed area.',
 verif:'The independent verifier reviews <b>all</b> "Yes" answers in D1 and D6 (because of their effect on the overall level), all <b>(§14)</b> questions and at least 25 % of the other "Yes" answers, chosen by the verifier.',

function nivelNombre(n){ const x = Q.niveles.find(v=>v.nivel===n); return x ? L(x.nombre) : ''; }
function dimNombre(c){ const d = DIMS.find(x=>x.codigo===c); return d ? c+' · '+L(d.nombre) : c; }
function pesosIguales(){ const p={}; for(const d of DIMS) p[d.codigo]=1; return p; }

/* =========================================================
   Motor de cálculo (documento 11 §5)
   ========================================================= */
function resp(ev, cod){ return (ev.respuestas||{})[cod] || {}; }
function contestada(a){ return a.r==='si' || a.r==='parcial' || a.r==='no' || a.r==='na'; }
function cumple(q, a){ return a.r==='si' || (a.r==='na' && q.si_aplica); }
function rotResp(a){ if(!contestada(a)) return t('r_'); if(a.r==='no' && a.no_tipo) return t('r_no')+', '+t(a.no_tipo==='contraria'?'no_contraria':'no_sin_evidencia'); return t('r_'+a.r); }
/* 11 §5.1: N = nivel más alto para el que todas las preguntas de 1 a N están en Sí o No aplica.
   Si lo que impide subir de nivel son solo preguntas sin responder, el nivel es «sin dato» (se informa el mínimo). */
function calcDim(ev, d){
  const qs = d.preguntas, porNivel = n => qs.filter(q=>q.nivel===n);
  let nivel = 0, indet = false;
  for(let n=1; n<=5; n++){
    const f = porNivel(n).filter(q=>!cumple(q, resp(ev,q.codigo)));
    if(!f.length){ nivel = n; continue; }
    if(!f.some(q=>contestada(resp(ev,q.codigo)))) indet = true;
    break;
  }
  const r = { codigo:d.codigo, minimo:nivel, nivel: indet ? null : nivel, indet, sd: qs.filter(q=>!contestada(resp(ev,q.codigo))).length };
  // 11 §5.2: avance = (Sí + 0,5 × Parcial) ÷ preguntas aplicables del nivel N + 1
  if(nivel<5){ const sig = porNivel(nivel+1).filter(q=>resp(ev,q.codigo).r!=='na');
    const s = sig.filter(q=>resp(ev,q.codigo).r==='si').length, p = sig.filter(q=>resp(ev,q.codigo).r==='parcial').length;
    r.avance = sig.length ? (s + 0.5*p)/sig.length*100 : 100; }
  else r.avance = null;
  r.bloqueantes = qs.filter(q=>q.nivel<=nivel+1 && !cumple(q, resp(ev,q.codigo)));
  r.adelantados = qs.filter(q=>q.nivel>nivel && resp(ev,q.codigo).r==='si');
  r.fortalezas = nivel>0 ? qs.filter(q=>q.nivel===nivel && cumple(q, resp(ev,q.codigo))) : [];
  // bloqueante principal: el primero del nivel siguiente, con prioridad a los «No» sobre los «Parcial» y los «sin dato»
  const orden = a => a.r==='no' ? 0 : a.r==='parcial' ? 1 : 2;
  r.principal = [...r.bloqueantes].sort((a,b)=>orden(resp(ev,a.codigo))-orden(resp(ev,b.codigo)) || a.codigo.localeCompare(b.codigo))[0] || null;
  r.invalidas = qs.filter(q=>resp(ev,q.codigo).r==='na' && !q.si_aplica).map(q=>q.codigo);
  r.na_sin_just = qs.filter(q=>resp(ev,q.codigo).r==='na' && !String(resp(ev,q.codigo).na_just||'').trim()).map(q=>q.codigo);
  return r;
}
/* 11 §5.3: media ponderada con dos decimales, redondeada hacia abajo y limitada a mín (D1, D6) + 1 */
function calcular(ev){
  const dims = DIMS.map(d=>calcDim(ev,d)), por = {}; dims.forEach(x=>por[x.codigo]=x);
  const P = Object.assign(pesosIguales(), ev.pesos||{}); let sw = 0; for(const d of DIMS) sw += Number(P[d.codigo])||0;
  const cuotas = {}; for(const d of DIMS) cuotas[d.codigo] = sw ? (Number(P[d.codigo])||0)/sw*100 : 0;
  const r = { dims, por, pesos:P, cuotas, contestadas: Object.keys(PREG).filter(c=>contestada(resp(ev,c))).length };
  r.fuera = DIMS.filter(d=>cuotas[d.codigo] < 10-1e-9 || cuotas[d.codigo] > 25+1e-9).map(d=>d.codigo);
  const pond = campo => { let s=0; for(const x of dims) s += (Number(P[x.codigo])||0) * x[campo]; return sw ? s/sw : 0; };
  const cierre = campo => { const media = Math.round(pond(campo)*100)/100, red = Math.floor(media + 1e-9), tope = Math.min(por.D1[campo], por.D6[campo]) + 1;
    const lim = ['D1','D6'].filter(c=>por[c][campo]===tope-1);
    return { media, red, tope, nivel: Math.min(red, tope), tope_aplicado: tope < red, limitante: lim }; };
  r.indet = dims.filter(x=>x.indet).map(x=>x.codigo);
  const m = cierre('minimo');
  if(r.indet.length){ r.nivel = null; r.minimo = m.nivel; r.media = null; r.tope = null; r.tope_aplicado = false; r.limitante = []; }
  else Object.assign(r, m, {minimo:m.nivel});
  // Verificación independiente (11 §4.6)
  const ver = a => a.verif==='conforme' || a.verif==='modificada';
  const sis = Object.values(PREG).filter(q=>resp(ev,q.codigo).r==='si');
  const d16 = sis.filter(q=>(q.dim==='D1'||q.dim==='D6') && !ver(resp(ev,q.codigo))).length;
  const s14 = Object.values(PREG).filter(q=>q.s14 && contestada(resp(ev,q.codigo)) && !ver(resp(ev,q.codigo))).length;
  const otros = sis.filter(q=>q.dim!=='D1' && q.dim!=='D6' && !q.s14), otrosV = otros.filter(q=>ver(resp(ev,q.codigo))).length;
  const po = otros.length ? otrosV/otros.length*100 : 100;
  r.verif = { d16, s14, po, ok: d16===0 && s14===0 && po>=25-1e-9 };
  // Declaración de aplicación (11 §7.3)
  r.s14 = Object.values(PREG).filter(q=>q.s14);
  r.s14_fallan = r.s14.filter(q=>resp(ev,q.codigo).r!=='si').map(q=>q.codigo);
  r.declara = ev.modalidad!=='autodiagnostico' && r.verif.ok && !r.s14_fallan.length;
  // Lectura cruzada (11 §7.2)
  const lc = ev.lectura||{}, pf = lc.perfil_indice||'', g = r.nivel, n1 = por.D1.nivel, n6 = por.D6.nivel, n7 = por.D7.nivel;
  r.lecturas = [];
  if(pf){ if(g!=null && g>=3 && pf==='escala') r.lecturas.push('lc_1');
    if(pf==='curso' && n7!=null && n7<2) r.lecturas.push('lc_2');
    if(g!=null && g>=3 && pf==='exploracion') r.lecturas.push('lc_4'); }
  if(lc.apuestas_transformar===true && ((n1!=null && n1<2) || (n6!=null && n6<2))) r.lecturas.push('lc_3');
  r.validez = ev.modalidad==='autodiagnostico' ? 'auto' : r.verif.ok ? 'ok' : 'pend';
  return r;
}
function tamMinimo(p){ p = Number(p); if(!p || p<1) return null; return p<=5 ? p : p<=20 ? 5 : p<=60 ? 8 : 12; }

/* Mensajes para el consejo: los que haya escrito el evaluador o, si están vacíos, una propuesta calculada */
function mensajes(ev, r){
  const escritos = (ev.mensajes||[]).map(m=>String(m||'').trim());
  const auto = [];
  if(r.nivel==null) auto.push(t('ms_1sd'));
  else auto.push(t('ms_1',{n:r.nivel, nn:nivelNombre(r.nivel), f:fF(ev.fecha_corte), m:nf(r.media,2), tope: r.tope_aplicado ? t('ms_tope',{d:r.limitante.join(lang==='en'?' and ':' y ')}) : t('ms_notope')}));
  const conN = r.dims.filter(x=>x.nivel!=null), max = Math.max(...conN.map(x=>x.nivel), -1);
  auto.push(max>=0 ? t('ms_2',{l:conN.filter(x=>x.nivel===max).map(x=>dimNombre(x.codigo)).join('; ')+' ('+t('nivel').toLowerCase()+' '+max+')'}) : t('ms_1sd'));
  const min = [...conN].sort((a,b)=>a.nivel-b.nivel || (a.codigo==='D1'||a.codigo==='D6'?-1:1))[0];
  let m3 = min ? t('ms_3',{d:dimNombre(min.codigo), n:min.nivel, b: min.bloqueantes.map(q=>q.codigo+' ('+rotResp(resp(ev,q.codigo))+')').join(', ')||t('ninguno')}) : '';
  const decl = r.declara ? t('decl_corta_si') : r.s14_fallan.length ? t('decl_corta_no',{l:listaCod(r.s14_fallan)}) : ev.modalidad==='autodiagnostico' ? t('decl_auto') : faltasVerif(r);
  m3 += (m3?' ':'') + t('ms_3b',{x: decl});
  auto.push(m3);
  return [0,1,2].map(i=>escritos[i] || auto[i]);
}

function tablaArr(ev, arr, cols, extra){
  const filas = ev[arr]||[];
  let h = '<div class="tblx"><table class="tabla resp"><thead><tr>'+cols.map(c=>'<th>'+esc(t(c[1]))+'</th>').join('')+'<th></th></tr></thead><tbody>';
  filas.forEach((f,i)=>{
    h += '<tr>'+cols.map(([k,et,tp])=>{ const id='a-'+arr+'-'+i+'-'+k, at='id="'+id+'" data-arr="'+arr+'" data-i="'+i+'" data-k="'+k+'" aria-label="'+esc(t(et))+'"'; let c;
      if(tp==='area') c = '<textarea '+at+'>'+esc(f[k]||'')+'</textarea>';
      else if(tp==='bool') c = '<select '+at+' data-tp="bool"><option value="0"'+(f[k]?'':' selected')+'>'+esc(t('no'))+'</option><option value="1"'+(f[k]?' selected':'')+'>'+esc(t('si'))+'</option></select>';
      else if(tp==='dim') c = '<select '+at+'>'+DIMS.map(d=>'<option value="'+d.codigo+'"'+(f[k]===d.codigo?' selected':'')+'>'+d.codigo+'</option>').join('')+'</select>';
      else if(tp==='estado') c = '<select '+at+'>'+['abierta','en_curso','cerrada'].map(x=>'<option value="'+x+'"'+(f[k]===x?' selected':'')+'>'+esc(t('e_'+x))+'</option>').join('')+'</select>';
      else c = '<input type="'+tp+'" '+at+(tp==='number'?' min="0" data-tp="num"':'')+' value="'+esc(f[k]??'')+'">';
      return '<td data-l="'+esc(t(et))+'">'+c+(k==='tamano' && extra ? extra(f) : '')+'</td>'; }).join('')+
      '<td><button type="button" data-acc="quitar" data-arr="'+arr+'" data-i="'+i+'">'+esc(t('quitar'))+'</button></td></tr>';
  });
  return h+'</tbody></table></div><p><button type="button" data-acc="anadir" data-arr="'+arr+'">'+esc(t('anadir'))+'</button></p>';
}

function setResp(ev, cod, f, v){
  ev.respuestas = ev.respuestas || {}; const a = ev.respuestas[cod] = ev.respuestas[cod] || {};
  if(v==='' && f!=='evidencia' && f!=='na_just' && f!=='verif_nota') v = null;
  a[f] = v;
  if(f==='r'){ if(v!=='no') delete a.no_tipo; else if(!a.no_tipo) a.no_tipo='sin_evidencia'; if(v!=='na') delete a.na_just; }
  if(f==='verif' && v!=='modificada'){ delete a.original; delete a.verif_nota; }
  if(f==='verif' && v==='modificada' && a.original==null) a.original = a.r ?? null;
}

const LS_TEMA_SITIO = 'seveng-tema', LS_TEMA_AUTO = 'seveng-herramientas-tema-auto';
let TEMA_SITIO_LEIDO = false;
function temaSitioInicial(){
  if(TEMA_SITIO_LEIDO) return; TEMA_SITIO_LEIDO = true;
  try{ if(localStorage.getItem(LS_TEMA_AUTO)) return; const m = ({salmon:'salmon', claro:'claro', noche:'oscuro'})[localStorage.getItem(LS_TEMA_SITIO)]; if(m){ UI.tema = m; const s = document.getElementById('sel-tema'); if(s) s.value = m; } }catch(e){}
}
function temaSitioGuardar(v){
  try{ if(v === 'auto'){ localStorage.setItem(LS_TEMA_AUTO, '1'); } else { localStorage.removeItem(LS_TEMA_AUTO); localStorage.setItem(LS_TEMA_SITIO, ({salmon:'salmon', claro:'claro', oscuro:'noche'})[v] || 'salmon'); } }catch(e){}
}
function sitioNav(){
  const n = document.getElementById('sitio-nav'); if(!n) return; const en = UI.lang === 'en', l = en ? 'en' : 'es';
  const e = [[en ? '../../../en/index.html' : '../../../index.html', en ? '⌂ Home' : '⌂ Portada'], ['../../html/'+l+'/00_SEVEN-G_Que_es_y_para_que_sirve.html', en ? 'What SEVEN-G is' : 'Qué es SEVEN-G'], ['../../html/'+l+'/index.html', en ? 'Library' : 'Biblioteca'], ['../../html/'+l+'/curso/M00_SEVEN-G_Curso_Guia_del_curso.html', en ? 'Course' : 'Curso'], ['../T01_registro_iniciativas/registro.html', en ? 'Initiative register' : 'Registro de iniciativas'], ['../T17_panel_consejo/index.html', en ? 'Board dashboard' : 'Panel del consejo']];
  n.setAttribute('aria-label', en ? 'Site' : 'Sitio');
  n.innerHTML = '<span class="sitio-marca" style="color:var(--papel)">SEVEN-G</span>' + e.map(x => '<a href="'+x[0]+'">'+x[1]+'</a>').join('');
}function aplicarTema(){ temaSitioInicial(); if(UI.tema==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', UI.tema); }
window.addEventListener('hashchange', render);

/* ---------------- arranque ---------------- */
(function(){
  try{ const u = JSON.parse(lsGet(LS_UI)||'null'); if(u) UI = Object.assign(UI, u); }catch(e){}
  try{ const d = JSON.parse(lsGet(LS_DATOS)||'null'); if(valido(d)) D = d; }catch(e){}
  if(!D) D = cargarDemo();
  const q = new URLSearchParams(location.search);
  if(q.get('lang')==='en' || q.get('lang')==='es') UI.lang = q.get('lang');
  else if(!lsGet(LS_UI) && /^en\b/i.test(navigator.language||'')) UI.lang = 'en';
  lang = UI.lang==='en' ? 'en' : 'es';
  aplicarTema(); render();
})();
