/* =========================================================
   Motor de cálculo (documento 11 §5)
   ========================================================= */
function resp(ev, cod){ return (ev.respuestas||{})[cod] || {}; }
function contestada(a){ return a.r==='si' || a.r==='parcial' || a.r==='no' || a.r==='na'; }
function cumple(q, a){ return a.r==='si' || (a.r==='na' && q.si_aplica); }
function rotResp(a){ if(!contestada(a)) return t('r_'); if(a.r==='no' && a.no_tipo) return t('r_no')+', '+t(a.no_tipo==='contraria'?'no_contraria':'no_sin_evidencia'); return t('r_'+a.r); }
/* 11 §5.1: N = nivel más alto para el que todas las preguntas de 1 a N están en Sí o No aplica.
   Si lo que impide subir de nivel son solo preguntas sin responder, el nivel es «sin dato» (se informa el mínimo). */
function calcDim(ev, d){
  const qs = d.preguntas, porNivel = n => qs.filter(q=>q.nivel===n);
  let nivel = 0, indet = false;
  for(let n=1; n<=5; n++){
    const f = porNivel(n).filter(q=>!cumple(q, resp(ev,q.codigo)));
    if(!f.length){ nivel = n; continue; }
    if(!f.some(q=>contestada(resp(ev,q.codigo)))) indet = true;
    break;
  }
  const r = { codigo:d.codigo, minimo:nivel, nivel: indet ? null : nivel, indet, sd: qs.filter(q=>!contestada(resp(ev,q.codigo))).length };
  // 11 §5.2: avance = (Sí + 0,5 × Parcial) ÷ preguntas aplicables del nivel N + 1
  if(nivel<5){ const sig = porNivel(nivel+1).filter(q=>resp(ev,q.codigo).r!=='na');
    const s = sig.filter(q=>resp(ev,q.codigo).r==='si').length, p = sig.filter(q=>resp(ev,q.codigo).r==='parcial').length;
    r.avance = sig.length ? (s + 0.5*p)/sig.length*100 : 100; }
  else r.avance = null;
  r.bloqueantes = qs.filter(q=>q.nivel<=nivel+1 && !cumple(q, resp(ev,q.codigo)));
  r.adelantados = qs.filter(q=>q.nivel>nivel && resp(ev,q.codigo).r==='si');
  r.fortalezas = nivel>0 ? qs.filter(q=>q.nivel===nivel && cumple(q, resp(ev,q.codigo))) : [];
  // bloqueante principal: el primero del nivel siguiente, con prioridad a los «No» sobre los «Parcial» y los «sin dato»
  const orden = a => a.r==='no' ? 0 : a.r==='parcial' ? 1 : 2;
  r.principal = [...r.bloqueantes].sort((a,b)=>orden(resp(ev,a.codigo))-orden(resp(ev,b.codigo)) || a.codigo.localeCompare(b.codigo))[0] || null;
  r.invalidas = qs.filter(q=>resp(ev,q.codigo).r==='na' && !q.si_aplica).map(q=>q.codigo);
  r.na_sin_just = qs.filter(q=>resp(ev,q.codigo).r==='na' && !String(resp(ev,q.codigo).na_just||'').trim()).map(q=>q.codigo);
  return r;
}
/* 11 §5.3: media ponderada con dos decimales, redondeada hacia abajo y limitada a mín (D1, D6) + 1 */
function calcular(ev){
  const dims = DIMS.map(d=>calcDim(ev,d)), por = {}; dims.forEach(x=>por[x.codigo]=x);
  const P = Object.assign(pesosIguales(), ev.pesos||{}); let sw = 0; for(const d of DIMS) sw += Number(P[d.codigo])||0;
  const cuotas = {}; for(const d of DIMS) cuotas[d.codigo] = sw ? (Number(P[d.codigo])||0)/sw*100 : 0;
  const r = { dims, por, pesos:P, cuotas, contestadas: Object.keys(PREG).filter(c=>contestada(resp(ev,c))).length };
  r.fuera = DIMS.filter(d=>cuotas[d.codigo] < 10-1e-9 || cuotas[d.codigo] > 25+1e-9).map(d=>d.codigo);
  const pond = campo => { let s=0; for(const x of dims) s += (Number(P[x.codigo])||0) * x[campo]; return sw ? s/sw : 0; };
  const cierre = campo => { const media = Math.round(pond(campo)*100)/100, red = Math.floor(media + 1e-9), tope = Math.min(por.D1[campo], por.D6[campo]) + 1;
    const lim = ['D1','D6'].filter(c=>por[c][campo]===tope-1);
    return { media, red, tope, nivel: Math.min(red, tope), tope_aplicado: tope < red, limitante: lim }; };
  r.indet = dims.filter(x=>x.indet).map(x=>x.codigo);
  const m = cierre('minimo');
  if(r.indet.length){ r.nivel = null; r.minimo = m.nivel; r.media = null; r.tope = null; r.tope_aplicado = false; r.limitante = []; }
  else Object.assign(r, m, {minimo:m.nivel});
  // Verificación independiente (11 §4.6)
  const ver = a => a.verif==='conforme' || a.verif==='modificada';
  const sis = Object.values(PREG).filter(q=>resp(ev,q.codigo).r==='si');
  const d16 = sis.filter(q=>(q.dim==='D1'||q.dim==='D6') && !ver(resp(ev,q.codigo))).length;
  const s14 = Object.values(PREG).filter(q=>q.s14 && contestada(resp(ev,q.codigo)) && !ver(resp(ev,q.codigo))).length;
  const otros = sis.filter(q=>q.dim!=='D1' && q.dim!=='D6' && !q.s14), otrosV = otros.filter(q=>ver(resp(ev,q.codigo))).length;
  const po = otros.length ? otrosV/otros.length*100 : 100;
  r.verif = { d16, s14, po, ok: d16===0 && s14===0 && po>=25-1e-9 };
  // Declaración de aplicación (11 §7.3)
  r.s14 = Object.values(PREG).filter(q=>q.s14);
  r.s14_fallan = r.s14.filter(q=>resp(ev,q.codigo).r!=='si').map(q=>q.codigo);
  r.declara = ev.modalidad!=='autodiagnostico' && r.verif.ok && !r.s14_fallan.length;
  // Lectura cruzada (11 §7.2)
  const lc = ev.lectura||{}, pf = lc.perfil_indice||'', g = r.nivel, n1 = por.D1.nivel, n6 = por.D6.nivel, n7 = por.D7.nivel;
  r.lecturas = [];
  if(pf){ if(g!=null && g>=3 && pf==='escala') r.lecturas.push('lc_1');
    if(pf==='curso' && n7!=null && n7<2) r.lecturas.push('lc_2');
    if(g!=null && g>=3 && pf==='exploracion') r.lecturas.push('lc_4'); }
  if(lc.apuestas_transformar===true && ((n1!=null && n1<2) || (n6!=null && n6<2))) r.lecturas.push('lc_3');
  r.validez = ev.modalidad==='autodiagnostico' ? 'auto' : r.verif.ok ? 'ok' : 'pend';
  return r;
}
function tamMinimo(p){ p = Number(p); if(!p || p<1) return null; return p<=5 ? p : p<=20 ? 5 : p<=60 ? 8 : 12; }

/* Mensajes para el consejo: los que haya escrito el evaluador o, si están vacíos, una propuesta calculada */
function mensajes(ev, r){
  const escritos = (ev.mensajes||[]).map(m=>String(m||'').trim());

  document.getElementById('txt-app').textContent = t('app');
  document.getElementById('saltar').textContent = t('saltar');
  document.getElementById('lbl-lang').textContent = t('idioma'); document.getElementById('lbl-tema').textContent = t('tema');
  const st = document.getElementById('sel-tema'); st.options[0].text=t('t_auto'); st.options[1].text=t('t_claro'); st.options[2].text=t('t_oscuro'); st.value=UI.tema;
  document.getElementById('sel-lang').value = lang;
  document.getElementById('btn-legal').textContent = t('legal_link');
  const ld = document.getElementById('lnk-doc'); ld.textContent = t('doc11'); ld.href = t('doc11_href');
  const lp = document.getElementById('lnk-p34'); lp.textContent = t('p34'); lp.href = t('p34_href');
  document.getElementById('lnk-t14').textContent = t('t14');
  document.getElementById('nav').setAttribute('aria-label', t('vistas'));
  const v = ruta();
  document.getElementById('nav').innerHTML = VISTAS.map(x=>'<a href="#/'+x+'"'+(x===v?' aria-current="page"':'')+'>'+esc(t('v_'+x))+'</a>').join('');
  document.getElementById('aviso-demo').innerHTML = (D.meta||{}).datos_ilustrativos ? '<div>'+esc(t('demo'))+'</div>' : '';
  const m = document.getElementById('principal');
  m.innerHTML = v==='cuestionario' ? vistaCuestionario() : v==='informe' ? vistaInforme() : v==='evolucion' ? vistaEvolucion() : v==='guia' ? vistaGuia() : v==='datos' ? vistaDatos() : vistaEvaluacion();
  document.getElementById('pie').innerHTML = '<p class="pie-legal"><b>'+esc(t('legal_tit'))+'.</b> '+esc(t('legal_txt'))+'</p><span>'+esc(t('pie_lic'))+'</span><span>'+esc(t('pie_priv'))+'</span>';
  if(foco && render._mantener){ const e = document.getElementById(foco); if(e){ e.focus({preventScroll:true}); window.scrollTo(0, y); } }
  render._mantener = false;
}
function rerender(){ render._mantener = true; render(); }
function refrescarResultado(){ const ev = evSel(), e = document.getElementById('res'); if(ev && e) e.innerHTML = resultadoHTML(ev); }

/* ---------------- eventos ---------------- */
function setResp(ev, cod, f, v){
  ev.respuestas = ev.respuestas || {}; const a = ev.respuestas[cod] = ev.respuestas[cod] || {};
  if(v==='' && f!=='evidencia' && f!=='na_just' && f!=='verif_nota') v = null;
  a[f] = v;
  if(f==='r'){ if(v!=='no') delete a.no_tipo; else if(!a.no_tipo) a.no_tipo='sin_evidencia'; if(v!=='na') delete a.na_just; }
  if(f==='verif' && v!=='modificada'){ delete a.original; delete a.verif_nota; }
  if(f==='verif' && v==='modificada' && a.original==null) a.original = a.r ?? null;
}
document.addEventListener('input', ev => {
  const el = ev.target, e = evSel(); if(!e) return;
  if(el.dataset.q && el.tagName==='TEXTAREA'){ setResp(e, el.dataset.q, el.dataset.f, el.value); guardar(); return; }
  if(el.dataset.ev && !el.dataset.re){ e[el.dataset.ev] = el.value; guardar(); refrescarResultado(); return; }
  if(el.dataset.msg){ e.mensajes = e.mensajes || []; e.mensajes[Number(el.dataset.msg)] = el.value; guardar(); return; }
  if(el.dataset.arr && el.tagName!=='SELECT'){ const f = e[el.dataset.arr][Number(el.dataset.i)]; f[el.dataset.k] = el.dataset.tp==='num' ? (el.value===''?null:Number(el.value)) : el.value; guardar(); return; }
  if(el.dataset.lect==='referencia_indice'){ e.lectura = e.lectura||{}; e.lectura.referencia_indice = el.value; guardar(); refrescarResultado(); return; }
  if(el.dataset.peso){ e.pesos = Object.assign(pesosIguales(), e.pesos||{}); e.pesos[el.dataset.peso] = el.value==='' ? 0 : Number(el.value); guardar(); refrescarResultado(); return; }
  if(el.dataset.ui==='pob'){ const n = tamMinimo(el.value); document.getElementById('g-out').textContent = n==null ? '' : t('g_res',{n: Number(el.value)<=5 ? t('todas')+' ('+n+')' : n}); return; }
});
document.addEventListener('change', ev => {
  const el = ev.target, e = evSel();
  if(el.id==='sel-lang'){ lang = UI.lang = el.value; guardar(); render(); return; }
  if(el.id==='sel-tema'){ UI.tema = el.value; aplicarTema(); guardar(); return; }
  if(el.dataset.cab==='sel'){ UI.sel = el.value; guardar(); render(); return; }
  if(el.dataset.ui==='filtro'){ UI.filtro = el.value; guardar(); rerender(); return; }
  if(!e) return;
  if(el.dataset.q && el.tagName==='SELECT'){ setResp(e, el.dataset.q, el.dataset.f, el.value); guardar(); rerender(); return; }
  if(el.dataset.ev && el.dataset.re){ e[el.dataset.ev] = el.value; guardar(); rerender(); return; }
  if(el.dataset.ev && el.type==='date'){ e[el.dataset.ev] = el.value; guardar(); return; }
  if(el.dataset.arr && el.tagName==='SELECT'){ const f = e[el.dataset.arr][Number(el.dataset.i)]; f[el.dataset.k] = el.dataset.tp==='bool' ? el.value==='1' : el.value; guardar(); return; }
  if(el.dataset.lect && el.tagName==='SELECT'){ e.lectura = e.lectura||{}; e.lectura[el.dataset.lect] = el.dataset.lect==='apuestas_transformar' ? (el.value===''?null:el.value==='1') : el.value; guardar(); refrescarResultado(); return; }
  if(el.dataset.obj){ e.objetivos = e.objetivos||{}; if(el.value==='') delete e.objetivos[el.dataset.obj]; else e.objetivos[el.dataset.obj] = Number(el.value); guardar(); refrescarResultado(); return; }
  if(el.dataset.peso){ rerender(); return; }
});
function descargar(nombre, txt, tipo){ const blob=new Blob([txt],{type:tipo}), u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download=nombre; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
function csvCelda(v){ if(v==null) return ''; const s=String(v); return /[;"\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-acc]'); if(!b) return;
  const a = b.dataset.acc, e = evSel();
  if(a==='aviso-legal'){ const d=document.getElementById('dlg-legal'); d.innerHTML='<div class="dlg-cab"><h2 id="legal-t">'+esc(t('legal_tit'))+'</h2><button type="button" data-acc="cerrar-legal">'+esc(t('legal_ok'))+'</button></div><div class="dlg-cuerpo"><p>'+esc(t('legal_txt'))+'</p></div>'; d.showModal(); return; }
  if(a==='cerrar-legal'){ document.getElementById('dlg-legal').close(); return; }
  if(a==='nueva'){ const x=evVacia(); D.evaluaciones.push(x); UI.sel=x.id; guardar(); location.hash='#/evaluacion'; render(); toast(t('ok_nueva')); return; }
  if(a==='duplicar' && e){ const x=clon(e), f=hoy(); x.id=nuevoId(f); x.fecha_corte=f; x.ciclo='seguimiento'; x.fecha_aprobacion=''; x.mensajes=[]; x.notas=''; x.entrevistas=[]; x.muestras=[];
    for(const k in x.respuestas){ const r=x.respuestas[k]; r.verif='sin_verificar'; delete r.original; delete r.verif_nota; }
    x.acciones=(x.acciones||[]).filter(c=>c.estado!=='cerrada'); D.evaluaciones.push(x); UI.sel=x.id; guardar(); render(); toast(t('ok_nueva')); return; }
  if(a==='eliminar' && e){ if(!confirm(t('conf_eliminar',{id:e.id}))) return; D.evaluaciones=D.evaluaciones.filter(x=>x!==e); UI.sel=null; guardar(); render(); toast(t('ok_eliminada')); return; }
  if(a==='imprimir'){ if(ruta()!=='informe'){ location.hash='#/informe'; render(); } setTimeout(()=>window.print(), 60); return; }
  if(a==='ver'){ UI.sel=b.dataset.id; guardar(); location.hash='#/evaluacion'; render(); return; }
  if(a==='dim' || a==='ir-dim'){ UI.dim=b.dataset.dim; guardar(); if(a==='ir-dim'){ ev.preventDefault(); location.hash='#/cuestionario'; } render(); return; }
  if(a==='pesos-iguales' && e){ e.pesos=pesosIguales(); guardar(); rerender(); return; }
  if(a==='anadir' && e){ const arr=b.dataset.arr; e[arr]=e[arr]||[]; e[arr].push(arr==='acciones'?{id:'AM-'+hoy().slice(0,4)+'-'+String(e.acciones.length+1).padStart(2,'0'), dimension:'D1', accion:'', responsable:'', plazo:'', criterio_cierre:'', t18:false, estado:'abierta'}:arr==='muestras'?{preguntas:'', poblacion:null, tamano:null, seleccion:''}:{rol:'', dimensiones:'', fecha:''}); guardar(); rerender(); return; }
  if(a==='quitar' && e){ e[b.dataset.arr].splice(Number(b.dataset.i),1); guardar(); rerender(); return; }
  if(a==='importar'){ document.getElementById('f-t15').click(); return; }
  if(a==='exportar'){ const x=clon(D); x.version_esquema=VERSION_ESQUEMA; x.herramienta='T15'; x.meta=Object.assign({}, x.meta, {exportado:hoy(), aviso_legal:TX.es.legal_txt});
    x.evaluaciones.forEach((cc,i)=>{ const r=calcular(D.evaluaciones[i]); cc.resultado={nivel_global:r.nivel, nivel_minimo:r.minimo, media:r.media, tope:r.tope, tope_aplicado:r.tope_aplicado, limitante:r.limitante, validez:r.validez, declaracion_posible:r.declara, s14_no_si:r.s14_fallan,
      dimensiones:r.dims.map(d=>({dimension:d.codigo, nivel:d.nivel, nivel_minimo:d.minimo, avance:d.avance==null?null:Math.round(d.avance*10)/10, bloqueantes:d.bloqueantes.map(q=>q.codigo), adelantados:d.adelantados.map(q=>q.codigo), sin_dato:d.sd})), lecturas:r.lecturas}; });
    descargar('t15_diagnostico_madurez_'+hoy()+'.json', JSON.stringify(x,null,2), 'application/json'); toast(t('ok_export')); return; }
  if(a==='csv' && e){ const cab=['evaluacion','fecha_corte','modalidad','version_cuestionario','dimension','codigo','nivel_pregunta','s14','si_aplica','pregunta','respuesta','tipo_no','evidencia','justificacion_no_aplica','verificacion','respuesta_original','nota_verificador'];
    const filas = Object.values(PREG).map(q=>{ const r=resp(e,q.codigo); return [e.id,e.fecha_corte,e.modalidad,e.version_cuestionario,q.dim,q.codigo,q.nivel,q.s14?1:0,q.si_aplica?1:0,L(q.texto),r.r||'',r.no_tipo||'',r.evidencia||'',r.na_just||'',r.verif||'sin_verificar',r.original||'',r.verif_nota||''].map(csvCelda).join(';'); });
    descargar('T15_respuestas_'+e.id+'_'+hoy()+'.csv', '﻿'+cab.join(';')+'\r\n'+filas.join('\r\n')+'\r\n', 'text/csv;charset=utf-8'); toast(t('ok_export')); return; }
  if(a==='restaurar'){ if(!confirm(t('conf_restaurar'))) return; D=cargarDemo(); UI.sel=null; guardar(); render(); return; }
  if(a==='vaciar'){ if(!confirm(t('conf_vaciar'))) return; D.evaluaciones=[]; D.meta=Object.assign({}, D.meta, {datos_ilustrativos:false}); UI.sel=null; guardar(); render(); return; }
});
document.getElementById('f-t15').addEventListener('change', ev => { const inp=ev.target, f=inp.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ let x=null; try{ x=JSON.parse(rd.result); }catch(e){} inp.value='';
    if(!valido(x)){ toast(t('err_json')); return; } if(!confirm(t('conf_importar'))) return;
    x.evaluaciones.forEach(c=>{ delete c.resultado; c.respuestas=c.respuestas||{}; });
    D=x; UI.sel=null; guardar(); render();
    const otras = [...new Set(x.evaluaciones.map(c=>c.version_cuestionario).filter(v=>v!==Q.version_cuestionario))];
    toast(otras.length ? t('aviso_version',{v:otras.join(', ')}) : t('ok_import')); };
  rd.readAsText(f); });
function aplicarTema(){ if(UI.tema==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', UI.tema); }
window.addEventListener('hashchange', render);

/* ---------------- arranque ---------------- */
(function(){
  try{ const u = JSON.parse(lsGet(LS_UI)||'null'); if(u) UI = Object.assign(UI, u); }catch(e){}
  try{ const d = JSON.parse(lsGet(LS_DATOS)||'null'); if(valido(d)) D = d; }catch(e){}
  if(!D) D = cargarDemo();
  const q = new URLSearchParams(location.search);
  if(q.get('lang')==='en' || q.get('lang')==='es') UI.lang = q.get('lang');
  else if(!lsGet(LS_UI) && /^en\b/i.test(navigator.language||'')) UI.lang = 'en';
  lang = UI.lang==='en' ? 'en' : 'es';
  aplicarTema(); render();
})();
