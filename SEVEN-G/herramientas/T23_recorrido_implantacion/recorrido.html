ion on the portfolio, then the rest."}},{"codigo":"PP-F","nombre":{"es":"A escala","en":"At scale"},"reconoce":{"es":"Al menos dos de estas tres cosas en producción: ML predictivo, IA generativa integrada en procesos y agentes que actúan (A2/A3).","en":"At least two of these three things in production: predictive ML, generative AI integrated into processes and agents that act (A2/A3)."},"riesgo":{"es":"Exposición regulatoria y de seguridad ya real; gobierno por detrás del uso.","en":"Regulatory and security exposure that is already real; governance lagging behind use."},"empieza":{"es":"Roles separados y auditor de IA de inmediato; inventario completo con clasificación; seguridad de agentes (35) y proveedores (36); regularización priorizada por riesgo; panel del consejo e índice de transformación.","en":"Segregated roles and AI Auditor immediately; complete inventory with classification; agent security (35) and suppliers (36); regularisation prioritised by risk; board dashboard and transformation index."},"espera":{"es":"Nada: todo es obligatorio y urgente.","en":"Nothing: everything is mandatory and urgent."}}],"asignacion":[{"orden":1,"arquetipo":"PP-F","condicion":{"es":"Al menos dos de {ML predictivo, IA generativa integrada en procesos, agentes A2 o A3} en producción.","en":"At least two of {predictive ML, generative AI integrated into processes, A2 or A3 agents} in production."}},{"orden":2,"arquetipo":"PP-E","condicion":{"es":"Tres o más pilotos de IA en curso, en su mayoría de IA generativa, y como mucho uno de IA generativa en producción.","en":"Three or more AI pilots under way, mostly generative AI, and at most one generative AI system in production."}},{"orden":3,"arquetipo":"PP-D","condicion":{"es":"ML predictivo, visión u optimización con aprendizaje en producción.","en":"Predictive ML, vision or optimisation with learning in production."}},{"orden":4,"arquetipo":"PP-C","condicion":{"es":"Reglas o RPA en producción, sin IA que aprenda en producción.","     'PP-D': t('u_d',{s:sn(ml)}), 'PP-C': t('u_c',{s:sn(rpa), l:sn(aprende)}), 'PP-B': t('u_b',{s:sn(terc), l:sn(aprende)}), 'PP-A': t('u_a') };

function prioridades(res){

  const q04 = ['si','nsnc'].includes(v('Q04')), mp = x => res.modificadores.includes(x);

/* =========================================================
   Registro T01: propuesta de Q01 a Q03 (D100, D102: una respuesta manual no se pisa)
   ========================================================= */
function propuestaT01(reg){
  const c = I => I.clasificacion || {}, ci = I => I.ciclo || {};
  const vivo = I => !['parada','retirada'].includes(ci(I).estado);
  const enUso = reg.iniciativas.filter(I => [6,7].includes(Number(ci(I).fase)) && vivo(I));
  const pilotos = reg.iniciativas.filter(I => { const f = Number(ci(I).fase); return f>=1 && f<=5 && vivo(I); });
  const tipos = new Set(); let nGen = 0;
  for(const I of enUso){
    const tec = Array.isArray(c(I).tecnologia) ? c(I).tecnologia : [], aut = String(c(I).autonomia||''), actua = aut==='A2' || aut==='A3';
    let esGen = false;
    for(const k of tec){
      if(k==='reglas') tipos.add('reglas');
      else if(k==='ia_terceros_embebida') tipos.add('terceros');
      else if(['ml_predictivo','vision','optimizacion','lenguaje_documentos'].includes(k)) tipos.add('ml');
      else if(k==='ia_generativa'){ tipos.add('generativa'); esGen = true; }
      else if(k==='agente'){ if(actua) tipos.add('agentes'); else { tipos.add('generativa'); esGen = true; } }
    }
    if(actua) tipos.add('agentes');
    if(esGen) nGen++;
  }
  const q01 = tipos.size ? ['reglas','terceros','ml','generativa','agentes'].filter(k=>tipos.has(k)) : ['ninguno'];
  const nP = pilotos.length, gP = pilotos.filter(I => { const tec = Array.isArray(c(I).tecnologia) ? c(I).tecnologia : []; return tec.includes('ia_generativa') || tec.includes('agente'); }).length;
  return {
    Q01:{v:q01, gen_varios: tipos.has('generativa') ? nGen>1 : undefined, fuente:'t01'},
    Q02:{v: nP===0 ? '0' : nP<=2 ? '1-2' : nP<=5 ? '3-5' : 'mas5', fuente:'t01'},
    Q03:{v: gP===0 ? 'ninguno' : gP*2>nP ? 'mayoria' : 'alguno', fuente:'t01'},
    det:{u:enUso.map(I=>I.id).join(', ')||'—', p:nP, g:gP}
  };
}
function proponerT01(){
  const reg = registroT01Local(); if(!reg){ toast(t('t01_local_no')); return; }
  const p = propuestaT01(reg), cambiadas = [], manuales = [];
  for(const q of ['Q01','Q02','Q03']){
    const a = D.respuestas[q];
    if(a && a.fuente==='manual' && a.v!=null && !(Array.isArray(a.v) && !a.v.length)){ manuales.push(q); continue; }
    const n = clon(p[q]); if(n.gen_varios===undefined) delete n.gen_varios; D.respuestas[q] = n; cambiadas.push(q);
  }
  if(!D.meta.organizacion) D.meta.organizacion = (reg.meta||{}).organizacion || '';
  guardar(); rerender();
  toast(t('ok_t01',{c:cambiadas.join(', ')||'—'}) + (manuales.length ? t('ok_t01_manual',{m:manuales.join(', ')}) : ''));
}

  if(el.id==='sel-tema'){ UI.tema = el.value; temaSitioGuardar(el.value); aplicarTema(); guardar(); return; }
  if(el.dataset.ui==='filtro'){ UI.filtro = el.value; guardar(); rerender(); return; }
  if(el.dataset.meta){ D.meta = D.meta || {}; D.meta[el.dataset.meta] = el.value; guardar(); return; }
  if(el.dataset.q){ if(el.value==='') delete D.respuestas[el.dataset.q]; else D.respuestas[el.dataset.q] = {v:el.value, fuente:'manual'}; guardar(); rerender(); return; }
  if(el.dataset.q01){ const a = D.respuestas.Q01 = Object.assign({v:[]}, D.respuestas.Q01||{}); let s = Array.isArray(a.v) ? a.v.slice() : [];
    const k = el.dataset.q01;
    if(el.checked){ if(k==='ninguno') s = ['ninguno']; else { s = s.filter(x=>x!=='ninguno'); if(!s.includes(k)) s.push(k); } } else s = s.filter(x=>x!==k);
    const ordenQ = PREG.Q01.respuestas.map(o=>o.clave); s.sort((x,y)=>ordenQ.indexOf(x)-ordenQ.indexOf(y));
    a.v = s; a.fuente = 'manual'; if(!s.includes('generativa')) delete a.gen_varios; if(!s.length) delete D.respuestas.Q01; guardar(); rerender(); return; }
  if(el.dataset.gen){ const a = D.respuestas.Q01; if(!a) return; if(el.value==='') delete a.gen_varios; else a.gen_varios = el.value==='varios'; a.fuente = 'manual'; guardar(); rerender(); return; }
  if(el.dataset.estado){ const m = hitoDe(el.dataset.estado); m.estado = el.value; if(!m.fecha && (el.value==='cumplido' || el.value==='convalidado')) m.fecha = hoy(); guardar(); rerender(); return; }
  if(el.dataset.nota){ const m = hitoDe(el.dataset.nota); m.nota = el.value; limpiarHito(el.dataset.nota); guardar(); return; }
  if(el.dataset.cubierto){ const m = hitoDe(el.dataset.cubierto); m.cubierto = el.checked; guardar(); rerender(); return; }
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-acc]'); if(!b) return;
  const a = b.dataset.acc;
  if(a==='aviso-legal'){ const d=document.getElementById('dlg-legal'); d.innerHTML='<div class="dlg-cab"><h2 id="legal-t">'+esc(t('legal_tit'))+'</h2><button type="button" data-acc="cerrar-legal">'+esc(t('legal_ok'))+'</button></div><div class="dlg-cuerpo"><p>'+esc(t('legal_txt'))+'</p></div>'; d.showModal(); return; }
  if(a==='cerrar-legal'){ document.getElementById('dlg-legal').close(); return; }
  if(a==='proponer-t01'){ proponerT01(); return; }
  if(a==='quitar-estado'){ const m = hitoDe(b.dataset.hito); delete m.estado; delete m.fecha; limpiarHito(b.dataset.hito); guardar(); rerender(); return; }
  if(a==='imprimir'){ window.print(); return; }
  if(a==='csv'){ descargar('T23_recorrido_'+hoy()+'.csv', csvRecorrido(), 'text/csv;charset=utf-8'); toast(t('ok_export')); return; }
  if(a==='exportar'){ descargar('t23_recorrido_implantacion_'+hoy()+'.json', JSON.stringify(datosExportables(),null,2), 'application/json'); toast(t('ok_export')); return; }
  if(a==='importar'){ document.getElementById('f-t23').click(); return; }
  if(a==='ejemplo-b'){ if(!confirm(t('conf_restaurar'))) return; D = cargarEjemploB(); guardar(); location.hash = '#/partida'; render(); toast(t('ok_ejemplo',{o:'PP-B'})); return; }
  if(a==='restaurar'){ if(!confirm(t('conf_restaurar'))) return; D = cargarDemo(); SevengDatos.reiniciar('demo'); guardar(); render(); return; }
  if(a==='vaciar'){ if(!confirm(t('conf_vaciar'))) return; D = vacio(); guardar(); location.hash = '#/partida'; render(); return; }
});
document.getElementById('f-t23').addEventListener('change', ev => { const inp=ev.target, f=inp.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ let x=null; try{ x=JSON.parse(rd.result); }catch(e){} inp.value='';
    if(!valido(x)){ toast(t('err_json')); return; } if(!confirm(t('conf_importar'))) return;
    D = normalizar(x); guardar(); render(); toast(t('ok_import')); };
  rd.readAsText(f); });
// ---- integración en el sitio: barra de navegación y tema general compartido (clave «seveng-tema»: salmon, claro o noche) ----
const LS_TEMA_SITIO = 'seveng-tema', LS_TEMA_AUTO = 'seveng-herramientas-tema-auto';
let TEMA_SITIO_LEIDO = false;
function temaSitioInicial(){
  if(TEMA_SITIO_LEIDO) return; TEMA_SITIO_LEIDO = true;
  try{ if(localStorage.getItem(LS_TEMA_AUTO)) return; const m = ({salmon:'salmon', claro:'claro', noche:'oscuro'})[localStorage.getItem(LS_TEMA_SITIO)]; if(m){ UI.tema = m; const s = document.getElementById('sel-tema'); if(s) s.value = m; } }catch(e){}
}
function temaSitioGuardar(v0){
  try{ if(v0 === 'auto'){ localStorage.setItem(LS_TEMA_AUTO, '1'); } else { localStorage.removeItem(LS_TEMA_AUTO); localStorage.setItem(LS_TEMA_SITIO, ({salmon:'salmon', claro:'claro', oscuro:'noche'})[v0] || 'salmon'); } }catch(e){}
}
// control «Buscador de documentos» del sitio (D88, D99, D105): carga el índice del idioma activo, SEVEN-G/html/<idioma>/codigos.js
function irCodigoCargar(l){
  if(window.sevengIrCodigo && window.sevengIrCodigo.lang===l){ window.sevengIrCodigo.iniciar(); return; }
  const previo=document.getElementById('ir-codigo-js'); if(previo) previo.parentNode.removeChild(previo);
  const s=document.createElement('script'); s.id='ir-codigo-js'; s.src='../../html/'+l+'/codigos.js'; document.head.appendChild(s);
}
function sitioNav(){
  const n = document.getElementById('sitio-nav'); if(!n) return; const en = lang === 'en', l = en ? 'en' : 'es';
  const e = [[en ? '../../../en/index.html' : '../../../index.html', en ? '⌂ Home' : '⌂ Portada'], ['../../html/'+l+'/00_SEVEN-G_Que_es_y_para_que_sirve.html', en ? 'What SEVEN-G is' : 'Qué es SEVEN-G'], ['../../html/'+l+'/index.html', en ? 'Library' : 'Biblioteca'], ['../../html/'+l+'/curso/M00_SEVEN-G_Curso_Guia_del_curso.html', en ? 'Course' : 'Curso'], ['../T01_registro_iniciativas/registro.html', en ? 'Initiative register' : 'Registro de iniciativas'], ['../T17_panel_consejo/index.html', en ? 'Board dashboard' : 'Panel del consejo']];
  n.setAttribute('aria-label', en ? 'Site' : 'Sitio');
  n.innerHTML = '<span class="sitio-marca" style="color:var(--papel)">SEVEN-G</span>' + e.map(x => '<a href="'+x[0]+'">'+x[1]+'</a>').join('') + '<span data-ir-codigo style="margin-left:auto"></span>';
  irCodigoCargar(l);
}
function aplicarTema(){ temaSitioInicial(); if(UI.tema==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', UI.tema); }
window.addEventListener('hashchange', render);

/* ---------------- arranque ---------------- */
(function(){
  try{ const u = JSON.parse(lsGet(LS_UI)||'null'); if(u) UI = Object.assign(UI, u); }catch(e){}
  try{ const d = JSON.parse(lsGet(LS_DATOS)||'null'); if(valido(d)) D = normalizar(d); }catch(e){}

})();
