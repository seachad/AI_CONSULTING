/* =========================================================
   Motor de cálculo · documento 40 (F1–F4, F7–F9) y documento 42
   ========================================================= */
function amt(l){ if(!l) return null; const u=n(l.unidades), v=n(l.valor_unitario); if(u!=null && v!=null) return u*v; return n(l.importe); }
function conFormula(l){ return n(l.unidades)!=null && n(l.valor_unitario)!=null; }
/* Reparto de un coste compartido al caso (42 §6.1 a §6.6) */
function reparto(s, tol){
  const tot=n(s.coste_total); if(tot==null) return {imp:null};
  const base = tot*(1-(n(s.estructura_pct)||0)/100);
  const ca=n(s.clave_caso);
  if(s.metodo==='consumo'){ const sin=n(s.sin_etiquetar_pct)||0; if(ca==null || sin>=100) return {imp:null};
    if(sin<=tol) return {imp: base*ca/(100-sin), base};
    return {imp: base*ca/100, base, fuera:true, no_atribuido: base*sin/100}; }
  const ct=n(s.clave_total); if(ca==null||ct==null||ct===0) return {imp:null};
  return {imp: base*ca/ct, base};
}
/* Flujo por año y F7, F8, F9 (40 §8) */
function flujo(bruto, rec, I, c, Hc, r, retirada){
  if(bruto==null || rec==null || I==null || !Hc) return null;
  const retIn = ((c.costes||{}).retirada_en_horizonte===true);
  if(retIn && retirada==null) return null;
  const anios=[]; let prev=null, cum=0, van=-I, pb=null, pbDet=null, suma=0;
  for(let a=1; a<=Hc; a++){
    let rp = n((c.rampa||[])[a-1]); if(rp==null) rp = prev ?? 100; prev = rp;
    const valor = bruto*rp/100, ret = (retIn && a===Hc) ? retirada : 0, neto = valor - rec - ret, f = Math.pow(1+r, a), va = neto/f;
    if(pb==null && neto>0 && cum+neto>=I){ pb = (a-1) + (I-cum)/neto; pbDet = {a:a-1, c:cum, n:neto}; }
    cum += neto; suma += neto; van += va;
    anios.push({a, rampa:rp, valor, coste:rec, ret, neto, f, va, acum:cum-I});
  }
  return {anios, van, suma, roi: I>0 ? (suma-I)/I : null, pb, pbDet};
}
function calcular(c, P){

  R.H = H; R.vida = vu; R.Hc = (H!=null && vu!=null && vu<H) ? vu : H; if(H!=null && vu!=null && vu<H) al('med','al_vida',{h:H,v:vu});
  R.r = (n(P.tasa_descuento_pct)||0)/100;
  // --- valor (F1)
  const L = c.lineas||[];
  const nom = (l,i) => l.concepto || ('#'+(i+1));
  const sumTipo = tp => { let s=0, sd=0, k=0; L.forEach(l=>{ if(l.tipo!==tp) return; k++; const a=amt(l); if(a==null) sd++; else s+=a; }); return {total: sd?null:s, parcial:s, sd, n:k}; };
  R.ef = sumTipo('eficiencias'); R.re = sumTipo('retorno'); R.cap = sumTipo('capacidad_liberada');
  L.forEach((l,i)=>{ const a=amt(l), suma=['eficiencias','retorno'].includes(l.tipo);
    if(suma && a==null) al('ko','al_linea_sd',{c:nom(l,i)});
    if(suma && a!=null && !conFormula(l)) al('med','al_sin_formula',{c:nom(l,i)});
    if(l.estado==='validado') al('ko','al_validado',{c:nom(l,i)});
    if(!l.estado) al('med','al_sin_estado',{c:nom(l,i)}); });
  const bases = new Set(L.filter(l=>l.tipo==='retorno').map(l=>l.base).filter(Boolean));
  if(bases.size>1) al('ko','al_mezcla'); else if(bases.has('ingreso')) al('info','al_ingreso');
  if(R.cap.n) al('info','al_capacidad',{v:R.cap.total==null?t('sd_opt'):eurF(R.cap.total)});
  if(L.some(l=>['riesgo_evitado','cumplimiento'].includes(l.tipo))) al('info','al_nosumable');
  R.bruto = (R.ef.total==null||R.re.total==null) ? null : R.ef.total+R.re.total;
  // --- hipótesis, método y criterios de parada
  const h = c.hipotesis||{};
  if(!h.metodo_atribucion) al('ko','al_metodo');
  else if(h.metodo_atribucion==='experta') A.push(['med', t('al_experta')+(c.ambicion==='optimizar'?t('al_experta_opt'):'')]);
  if(!(h.enunciado||'').trim() || !(h.refutacion||'').trim()) al('med','al_hipotesis');
  const tiposCP = new Set((c.criterios_parada||[]).filter(x=>(x.criterio||'').trim()).map(x=>x.tipo));
  const faltanCP = TCRIT.filter(x=>!tiposCP.has(x[0])).map(x=>lab(TCRIT,x[0]).toLowerCase());
  if(faltanCP.length) al('med','al_parada',{f:faltanCP.join(', ')});
  if(!(c.rampa||[]).some(x=>n(x)!=null)) al('med','al_rampa');

  CL.forEach((l,i)=>{ if(!l.categoria) al('med','al_cat',{c:nom(l,i)}); if(!COMPS.some(x=>x[0]===l.componente)) al('ko','al_comp',{c:nom(l,i)}); if(amt(l)==null) al('ko','al_coste_sd',{c:nom(l,i)}); });
  const comp = k => { let s=0, sd=0, inc=0, m=0; CL.forEach(l=>{ if(l.componente!==k) return; m++; const a=amt(l); if(a==null) sd++; else { s+=a; if(l.incremental!==false) inc+=a; } }); return {total: (sd||!m)?null:s, inc: (sd||!m)?null:inc, sd, n:m}; };

  let sh=0, shInc=0, shSd=0;

    if(x.imp==null){ shSd++; al('ko','al_comp_sd',{c:nm}); } else { sh+=x.imp; if(s.incremental===true) shInc+=x.imp; }
    if(x.fuera) al('ko','al_tol',{c:nm, p:nf(n(s.sin_etiquetar_pct),1), t:nf(tol,1), e:eurF(x.no_atribuido)});
    if(s.clave_aprobada!==true) al('med','al_clave',{c:nm}); });
  R.shared = shSd ? null : sh; R.sharedInc = shSd ? null : shInc;
  const hayRec = R.recDir.n>0 || CS.length>0;
  const recDirT = R.recDir.n ? R.recDir.total : 0, recDirI = R.recDir.n ? R.recDir.inc : 0;
  R.rec = (!hayRec || recDirT==null || R.shared==null) ? null : recDirT + R.shared;
  R.recInc = (!hayRec || recDirI==null || R.sharedInc==null) ? null : recDirI + R.sharedInc;
  if(R.rec==null) al('ko','al_rec_sd');
  let adop = R.adop.total;
  if(R.adop.n===0){ if(['aumentar','transformar'].includes(c.ambicion)){ adop=null; al('ko','al_adop_obl'); } else { adop=0; al('info','al_adop_cero'); } }
  R.adopV = adop;
  R.I = (R.constr.total==null || adop==null) ? null : R.constr.total + adop;
  if(R.I==null) al('ko','al_inv_sd');
  R.retirada = R.ret.n ? R.ret.total : null; if(R.retirada==null) al('med','al_ret_sd');
  // --- neto (F2), flujo, VAN (F7), ROI (F8), plazo (F9)
  R.neto = (R.bruto==null||R.rec==null) ? null : R.bruto - R.rec;

  if(R.neto!=null && R.neto<0) al('ko','al_neto_neg');
  R.fl = flujo(R.bruto, R.rec, R.I, c, R.Hc, R.r, R.retirada);
  R.van = R.fl ? R.fl.van : null; R.roi = R.fl ? R.fl.roi : null; R.payback = R.fl ? R.fl.pb : null;
  R.tco = (R.constr.total==null || adop==null || R.rec==null || R.retirada==null || !R.Hc) ? null : R.constr.total + adop + R.Hc*R.rec + R.retirada;
  // --- F3 (regla 9)
  const na = n(c.neto_actual), inv = n(c.inversion_adicional) ?? R.I;

  R.esc = [['prudente', E.prudente||m1], ['central', m1], ['favorable', E.favorable||m1]].map(([k,m])=>{
    const b = R.bruto==null?null:R.bruto*m.valor, rc = R.rec==null?null:R.rec*m.coste_recurrente, i = R.I==null?null:R.I*m.inversion, f = flujo(b, rc, i, c, R.Hc, R.r, R.retirada);
    return {k, m, neto:(b==null||rc==null)?null:b-rc, I:i, van:f?f.van:null, roi:f?f.roi:null, pb:f?f.pb:null}; });

    if(!et.length) al('ko','al_etapas');
    else if(R.I!=null && R.limEtapas!=null && R.I>R.limEtapas) al('med','al_etapas_lim',{i:eurF(R.I), l:eurF(R.limEtapas)});

    const u1=n(AC.aviso_pct)??50, u2=n(AC.alerta_pct)??80, u3=n(AC.limite_pct)??100;
    x.nivel = x.pct>=u3 ? '100' : (x.pct>=u2 || (x.prevPct!=null && x.prevPct>100)) ? '80' : x.pct>=u1 ? '50' : null;
    const ud=n(cs.ultimo_dia), mr=n(cs.media_reciente), fa=n(AC.anomalia_factor); x.anom = (ud!=null && mr && fa) ? ud>=fa*mr : false;
    if(x.nivel) A.push([x.nivel==='100'?'ko':'med', x.nivel==='100'?t('cons_100'):t('cons_'+x.nivel,{u:x.nivel==='50'?u1:u2})]);
    if(x.anom) A.push(['ko', t('cons_anom',{f:fa})]);
    R.cons = x; }
  // --- coste por unidad de resultado (42 §9)
  const u = C.unidad_resultado||{}, uu=n(u.unidades_utiles), vt=n(u.volumen_total), res=n(u.coste_humano_residual), cb=n(u.coste_unitario_base);
  R.uni = {ia:(R.rec!=null && uu)?R.rec/uu:null, proc:(R.rec!=null && res!=null && vt)?(R.rec+res)/vt:null, base:cb};
  R.uni.pot = (R.uni.proc!=null && cb!=null && vt) ? (cb-R.uni.proc)*vt : null;
  // --- coste de parar (42 §10)
  const pa = C.parada||{}, apr=n(pa.presupuesto_aprobado), gas=n(pa.gastado), com=n(pa.compromisos), pen=n(pa.penalizaciones), cie=n(pa.cierre);
  R.par = {coste:(pen!=null&&cie!=null)?pen+cie:null, evitada:(apr!=null&&gas!=null&&com!=null)?apr-gas-com:null, hundido:gas};
  R.par.neto = (R.par.coste!=null && R.par.evitada!=null) ? R.par.evitada-R.par.coste : null;
  // --- conciliación (42 §11)
  const co = C.conciliacion||{}, reales = co.reales||[];
  const sumReal = reales.length ? (reales.some(x=>n(x.importe)==null) ? null : reales.reduce((a,x)=>a+n(x.importe),0)) : null;
  const saldo = n(co.saldo_contable);
  R.conc = {real:sumReal, saldo, dif:(sumReal!=null && saldo!=null) ? saldo-sumReal : null};
  if(R.conc.dif!=null && Math.abs(R.conc.dif)>=0.5 && !(co.explicacion||'').trim()) al('ko','al_conc');
  if(sumReal!=null && R.I!=null && sumReal>R.I) al('ko','al_sobrecoste',{r:eurF(sumReal), i:eurF(R.I)});
  // --- por categoría y componente
  const pc = {}; const addC=(cat,cm,v)=>{ const k=cat||''; pc[k]=pc[k]||{construccion:0,adopcion:0,recurrente:0,retirada:0,sd:{}}; if(v==null) pc[k].sd[cm]=true; else pc[k][cm]+=v; };
  CL.forEach(l=>addC(l.categoria, l.componente, amt(l))); CS.forEach((s,i)=>addC(s.categoria,'recurrente',R.comp[i].imp));
  R.porCat = pc;
  const realCat = {}; reales.forEach(x=>{ const k=x.categoria||''; realCat[k]=(realCat[k]||0)+(n(x.importe)||0); }); R.realCat = realCat;
  return R;
}

function respuesta(c, R){
  const faltas = [];
  if(R.neto==null || R.I==null || R.van==null) faltas.push(t('falta_datos'));
  if(!(c.hipotesis||{}).metodo_atribucion) faltas.push(t('falta_metodo'));
  if(!(c.criterios_parada||[]).some(x=>(x.criterio||'').trim())) faltas.push(t('falta_parada'));
  if(c.ambicion==='transformar' && !(c.etapas||[]).length) faltas.push(t('falta_etapas'));
  if(faltas.length) return t('resp_falta',{c:faltas.join('; ')});
  if(c.ambicion!=='transformar' && R.van<0) return t('resp_no',{c:t('van_neg')});
  if(R.alertas.some(a=>a[0]==='ko')) return t('resp_cond',{c:t('cond_alertas')});
  return t('resp_si');
}

function casoDesdeT01(reg, id){
  const I = reg.iniciativas.find(x=>x.id===id); if(!I) return null;
  const cl = I.clasificacion||{}, c = casoVacio(nuevoId(I.id));
  Object.assign(c, {nombre:I.nombre||'', descripcion:I.descripcion||'', ambicion:cl.ambicion_confirmada||cl.ambicion_propuesta||null, intensidad:cl.intensidad||null, fase:(I.ciclo||{}).fase??null, origen:'t01'});
  const vals = (reg.valores||[]).filter(v=>v.iniciativa===I.id && v.momento==='esperado');
  for(const v of vals){
    const base = {concepto:v.formula||v.tipo, importe:n(v.importe), fuente:'T01 '+(v.id||'')+(v.fuente?' · '+v.fuente:'')};
    if(['eficiencias','retorno','capacidad_liberada','riesgo_evitado','cumplimiento'].includes(v.tipo)) c.lineas.push(Object.assign(FILAS.lineas(), base, {tipo:v.tipo, estado:v.estado||null, supuestos:v.formula||''}));
    else if(v.tipo==='coste_recurrente') c.costes.lineas.push(Object.assign(FILAS['costes.lineas'](), base, {componente:'recurrente'}));
    else if(v.tipo==='inversion') c.costes.lineas.push(Object.assign(FILAS['costes.lineas'](), base, {componente:'construccion'}));
  }
  const inv = I.inversion||{};
  if(!vals.some(v=>v.tipo==='inversion') && (inv.realizada!=null || inv.pendiente!=null)){
    const ok = inv.realizada!=null && inv.pendiente!=null;
    c.costes.lineas.push(Object.assign(FILAS['costes.lineas'](), {componente:'construccion', concepto:ok?t('t01_inv'):t('t01_inv_sd'), importe: ok ? n(inv.realizada)+n(inv.pendiente) : null, fuente:'T01'}));
  }
  if(inv.realizada!=null) c.costes.parada.gastado = n(inv.realizada);
  c.notas = t('t01_nota',{o:(reg.meta||{}).organizacion||'', f:fF(hoy())});
  return c;
}

  if(a==='crear-t01'){ const id = document.getElementById('t01-ini').value, x = T01_PEND && casoDesdeT01(T01_PEND, id); document.getElementById('dlg-t01').close(); T01_PEND=null; if(!x) return; D.casos.push(x); UI.sel=x.id; guardar(); location.hash='#/hipotesis'; render(); toast(t('ok_t01',{c:x.id})); return; }
  if(a==='nuevo'){ const x = casoVacio(nuevoId('CASO-'+String(D.casos.length+1).padStart(2,'0'))); D.casos.push(x); UI.sel=x.id; guardar(); render(); toast(t('ok_nuevo')); return; }
  if(a==='duplicar' && c){ const x=clon(c); x.id=nuevoId(c.id); x.origen='manual'; D.casos.push(x); UI.sel=x.id; guardar(); render(); toast(t('ok_nuevo')); return; }
  if(a==='eliminar' && c){ if(!confirm(t('conf_eliminar',{c:c.id}))) return; D.casos=D.casos.filter(x=>x!==c); UI.sel=null; guardar(); render(); toast(t('ok_eliminado')); return; }
  if(a==='imprimir'){ if(ruta()!=='decision'){ location.hash='#/decision'; render(); } setTimeout(()=>window.print(), 50); return; }
  if(a==='anadir' && c){ const lista=b.dataset.lista; let arr=getP(c, lista); if(!Array.isArray(arr)){ setP(c, lista, []); arr=getP(c, lista); } arr.push(FILAS[lista](c)); guardar(); render(); return; }
  if(a==='quitar' && c){ const arr=getP(c, b.dataset.lista); if(Array.isArray(arr)) arr.splice(Number(b.dataset.i),1); guardar(); render(); return; }
  if(a==='anadir-ch'){ const p=parSel(); if(!parEditable(p)) return; (p.coste_horario=p.coste_horario||[]).push({perfil:'', importe:null}); guardar(); render(); return; }
  if(a==='desde-t01'){ document.getElementById('f-t01').click(); return; }
  if(a==='importar'){ document.getElementById('f-t11').click(); return; }
  if(a==='exportar'){ const x=clon(D); x.version_esquema=VERSION_ESQUEMA; x.herramienta='T11'; x.meta=Object.assign({}, x.meta, {exportado:hoy(), aviso_legal:TX.es.legal_txt}); x.casos.forEach((cc,i)=>{ cc.resultado = resultadoExport(D.casos[i]); });
    descargar('t11_calculadora_valor_'+hoy()+'.json', JSON.stringify(x,null,2), 'application/json'); toast(t('ok_export')); return; }
  if(a==='exp-caso' && c){ const x = {herramienta:'T11', version_esquema:VERSION_ESQUEMA, exportado:hoy(), aviso_legal:TX.es.legal_txt, datos_ilustrativos:!!(D.meta||{}).datos_ilustrativos, caso:c.id, iniciativa:{id:c.id, nombre:c.nombre, ambicion:c.ambicion, intensidad:c.intensidad, fase:c.fase}, resultado:resultadoExport(c),
      valores_t01:valoresT01(c), nota_valores_t01:'Importes esperados en el formato de valores[] de T01, sin código VAL: T01 lo asigna al darlos de alta. El valor esperado nunca se marca como validado.'};
    descargar('t11_resultado_'+c.id+'_'+hoy()+'.json', JSON.stringify(x,null,2), 'application/json'); toast(t('ok_caso_json')); return; }
  if(a==='exp-csv' && c){ descargar('t11_t13_'+c.id+'_'+hoy()+'.csv', csvCaso(c), 'text/csv;charset=utf-8'); toast(t('ok_csv')); return; }
  if(a==='restaurar'){ if(!confirm(t('conf_restaurar'))) return; D=cargarDemo(); UI.sel=null; UI.par=null; guardar(); render(); return; }
  if(a==='vaciar'){ if(!confirm(t('conf_vaciar'))) return; D.casos=[]; D.meta=Object.assign({}, D.meta, {datos_ilustrativos:false}); UI.sel=null; guardar(); render(); return; }
  if(a==='nueva-version'){ const nom=(document.getElementById('p-nueva').value||'').trim(); if(!nom){ document.getElementById('p-nueva').focus(); return; } if(D.parametros.some(x=>x.version===nom)){ toast(t('ya_existe')); return; }
    const base = parSel(), x = clon(base); Object.assign(x, {version:nom, fecha:hoy(), origen:'v'+base.version, aprobado_por:null, nota:''}); D.parametros.push(x); UI.par=nom; guardar(); render(); toast(t('ok_version',{v:nom})); return; }
});
function leerFichero(inp, fn){ const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ let x=null; try{ x=JSON.parse(rd.result); }catch(e){} inp.value=''; fn(x); }; rd.readAsText(f); }
document.getElementById('f-t11').addEventListener('change', ev => leerFichero(ev.target, x => {
  if(!valido(x)){ toast(t('err_json')); return; } if(!confirm(t('conf_importar'))) return;
  x.casos.forEach(c=>{ delete c.resultado; }); D=x; UI.sel=null; UI.par=null; guardar(); render(); toast(t('ok_import')); }));
document.getElementById('f-t01').addEventListener('change', ev => leerFichero(ev.target, reg => {
  if(!reg || !Array.isArray(reg.iniciativas) || !Array.isArray(reg.valores) || !reg.iniciativas.length){ toast(t('err_t01')); return; }
  abrirDlgT01(reg); }));
// ---- integración en el sitio: barra de navegación y tema general compartido (clave «seveng-tema»: salmon, claro o noche) ----
const LS_TEMA_SITIO = 'seveng-tema', LS_TEMA_AUTO = 'seveng-herramientas-tema-auto';
let TEMA_SITIO_LEIDO = false;
function temaSitioInicial(){
  if(TEMA_SITIO_LEIDO) return; TEMA_SITIO_LEIDO = true;
  try{ if(localStorage.getItem(LS_TEMA_AUTO)) return; const m = ({salmon:'salmon', claro:'claro', noche:'oscuro'})[localStorage.getItem(LS_TEMA_SITIO)]; if(m){ UI.tema = m; const s = document.getElementById('sel-tema'); if(s) s.value = m; } }catch(e){}
}
function temaSitioGuardar(v){
  try{ if(v === 'auto'){ localStorage.setItem(LS_TEMA_AUTO, '1'); } else { localStorage.removeItem(LS_TEMA_AUTO); localStorage.setItem(LS_TEMA_SITIO, ({salmon:'salmon', claro:'claro', oscuro:'noche'})[v] || 'salmon'); } }catch(e){}
}
function sitioNav(){
  const n = document.getElementById('sitio-nav'); if(!n) return; const en = UI.lang === 'en', l = en ? 'en' : 'es';
  const e = [[en ? '../../../en/index.html' : '../../../index.html', en ? '⌂ Home' : '⌂ Portada'], ['../../html/'+l+'/00_SEVEN-G_Que_es_y_para_que_sirve.html', en ? 'What SEVEN-G is' : 'Qué es SEVEN-G'], ['../../html/'+l+'/index.html', en ? 'Library' : 'Biblioteca'], ['../../html/'+l+'/curso/M00_SEVEN-G_Curso_Guia_del_curso.html', en ? 'Course' : 'Curso'], ['../T01_registro_iniciativas/registro.html', en ? 'Initiative register' : 'Registro de iniciativas'], ['../T17_panel_consejo/index.html', en ? 'Board dashboard' : 'Panel del consejo']];
  n.setAttribute('aria-label', en ? 'Site' : 'Sitio');
  n.innerHTML = '<span class="sitio-marca" style="color:var(--papel)">SEVEN-G</span>' + e.map(x => '<a href="'+x[0]+'">'+x[1]+'</a>').join('');
}function aplicarTema(){ temaSitioInicial(); if(UI.tema==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', UI.tema); }
window.addEventListener('hashchange', render);

  lang = UI.lang==='en' ? 'en' : 'es';
  aplicarTema(); render();
})();
