*{box-sizing:border-box}
html{background:var(--papel);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.5 var(--sans);overflow-wrap:break-word}

h1,h2,h3{font-family:var(--serif);color:var(--negro);line-height:1.2}
h1{font-size:clamp(24px,4vw,34px);margin:4px 0 6px;font-weight:600}

/* Controles */
button,.btn,select,input,textarea{font:inherit;color:var(--tinta)}
.btn,button{cursor:pointer;background:var(--papel);border:1px solid var(--regla);border-radius:2px;padding:7px 11px;font-weight:600;font-size:14px;line-height:1.2;min-height:36px}
.btn:hover,button:hover{border-color:var(--tinta-2)}
.btn.primario,button.primario{background:var(--negro);color:var(--papel);border-color:var(--negro)}
.btn.peligro,button.peligro{border-color:var(--claret);color:var(--claret)}
button:disabled{opacity:.55;cursor:not-allowed}
select,input[type=text],input[type=date],input[type=number],input[type=search],textarea{background:var(--tarjeta);border:1px solid var(--regla);border-radius:2px;padding:6px 8px;min-height:36px;max-width:100%}
textarea{width:100%;min-height:64px}
label{font-weight:600;font-size:13px;color:var(--tinta-2)}
.campo{display:flex;flex-direction:column;gap:3px;min-width:0}
.campo input,.campo select,.campo textarea{width:100%}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fila-fin{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:12px}
fieldset{border:1px solid var(--regla);padding:8px 12px 12px;margin:10px 0;min-width:0}
legend{font-weight:700;padding:0 4px;color:var(--negro)}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px}
.checks label{font-weight:500;color:var(--tinta);display:flex;gap:6px;align-items:center}
.ayuda{font-size:12.5px;color:var(--tinta-3)}
.errores{color:var(--claret);font-weight:600}

.et.med{background:var(--med-bg);border-color:var(--ambar)}

.tabla{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 16px}
.tabla caption{text-align:left;font-weight:700;padding:4px 0;color:var(--tinta-2)}
.tabla th{text-align:left;font-size:12.5px;color:var(--tinta-2);border-bottom:2px solid var(--negro);padding:6px 10px 6px 0;vertical-align:bottom}
.tabla td{border-bottom:1px solid var(--regla);padding:7px 10px 7px 0;vertical-align:top}
.tabla tr.clic:hover td{background:var(--papel-2)}

.embudo .et-fase small{display:block;font-weight:500;color:var(--tinta-3);font-size:12px}
.barra-emb{display:flex;align-items:center;gap:8px;min-width:0}

.barra-emb i.cero{background:var(--regla)}
.barra-emb b{font:600 18px/1 var(--serif)}
.emb-det{grid-column:2;font-size:12.5px;color:var(--tinta-2);display:flex;flex-wrap:wrap;gap:4px 10px}
@media (max-width:560px){.embudo li{grid-template-columns:1fr}.emb-det{grid-column:1}}

.tablero{display:grid;grid-template-columns:repeat(9,minmax(200px,1fr));gap:10px;align-items:start}
.col{background:var(--papel-2);padding:8px;min-width:0}

.tarjeta{background:var(--tarjeta);border:1px solid var(--regla);border-left:4px solid var(--oxford);padding:8px;margin:0 0 8px;font-size:13.5px}

.cab-ficha{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}

.barra-h{height:10px;background:var(--regla-2);position:relative;min-width:60px}

.apilada{display:flex;height:16px;min-width:80px;background:var(--regla-2)}

.leyenda{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--tinta-2)}
.leyenda i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:middle}
/* Diálogo */
dialog{border:0;border-top:4px solid var(--negro);background:var(--papel);color:var(--tinta);padding:0;width:min(760px,calc(100vw - 16px));max-height:calc(100vh - 24px)}

@media print{.cab,.nav,details.filtros,button,.btn,dialog{display:none!important}.pie{border-top:1px solid #000}}
</style>

<script type="application/json" id="catalogo-criterios">[{"c":"G0.01","g":"G0","t":"La carta define el problema u objetivo de negocio, el alcance, el presupuesto de las fases 1 a 3 y el compromiso firmado del patrocinador.","e":"P01","o":"si","l":"simpl","n":"si","a":"Transformar: patrocinador de alta dirección.","te":"The charter defines the business problem or objective, the scope, the budget for phases 1 to 3 and the signed commitment of the sponsor.","ae":"Transform: senior management sponsor.","s":[]},{"c":"G0.02","g":"G0","t":"La iniciativa encaja con la tesis de IA y la cartera aprobadas en C2 y C3, con referencia a la esfera y a la prioridad asignada.","e":"P01","o":"condicionable","l":"si","n":"si","a":"Transformar: figura en la cartera con previsión de decisión del consejo en G2.","te":"The initiative fits the AI thesis and the portfolio approved in C2 and C3, with a reference to the sphere and the priority assigned.","ae":"Transform: it appears in the portfolio with a board decision expected at G2.","s":[]},{"c":"G0.03","g":"G0","t":"La declaración de contexto recoge las restricciones regulatorias (incluida la sectorial), éticas, de datos, presupuestarias y de plazo.","e":"P02","o":"condicionable","l":"simpl","n":"si","a":"","te":"The context statement sets out the regulatory (including sector-specific), ethical, data, budgetary and time constraints.","ae":"","s":[]},{"c":"G0.04","g":"G0","t":"El cribado preliminar descarta que la iniciativa persiga una práctica prohibida por la regulación aplicable.","e":"P02","o":"si_critico","l":"si","n":"si","a":"","te":"The preliminary screening rules out the initiative pursuing a practice prohibited by applicable regulation.","ae":"","s":[]},{"c":"G0.05","g":"G0","t":"Los roles están asignados con nombre: en Lite, al menos patrocinador, producto, técnico y riesgos (operación, como tarde, en G4); en Enterprise, los seis roles de 01 §8.1.","e":"P03","o":"si","l":"si","n":"si","a":"","te":"The roles are assigned by name: in Lite, at least sponsor, product, technical and risk (operations, at the latest, at G4); in Enterprise, the six roles in 01 §8.1.","ae":"","s":[]},{"c":"G0.06","g":"G0","t":"La asignación respeta las incompatibilidades de 01 §8.2 y el auditor de IA no depende jerárquicamente del patrocinador.","e":"P03","o":"si","l":"si","n":"si","a":"","te":"The assignment respects the incompatibilities in 01 §8.2 and the AI auditor does not report hierarchically to the sponsor.","ae":"","s":[]},{"c":"G0.07","g":"G0","t":"La intensidad está determinada con los ocho criterios Enterprise de 01 §9.2, con respuesta justificada a cada uno.","e":"P04 · T04","o":"si","l":"si","n":"si","a":"Transformar: siempre Enterprise.","te":"The intensity is determined with the eight Enterprise criteria in 01 §9.2, with a justified answer to each one.","ae":"Transform: always Enterprise.","s":[]},{"c":"G0.08","g":"G0","t":"La iniciativa está dada de alta en el registro con código IA-AAAA-NNN y los sistemas previstos figuran en el inventario con tecnología, exposición y proveedor.","e":"P05 · T01 · T02","o":"si","l":"si","n":"si","a":"","te":"The initiative is registered in the register with code IA-AAAA-NNN, and the planned systems appear in the inventory with technology, exposure and supplier.","ae":"","s":[]},{"c":"G0.09","g":"G0","t":"No se ha consumido presupuesto de construcción ni se ha accedido a datos de producción antes de la decisión.","e":"P01 · T01","o":"si","l":"si","n":"si","a":"","te":"No construction budget has been consumed and no production data have been accessed before the decision.","ae":"","s":[]},{"c":"G0.10","g":"G0","t":"Si se prevé tratar datos personales, la función de protección de datos ha sido informada.","e":"P02","o":"condicionable","l":"rec","n":"si","a":"","te":"If personal data are expected to be processed, the data protection function has been informed.","ae":"","s":[]},{"c":"G1.01","g":"G1","t":"La oportunidad nace de una necesidad de negocio concreta: proceso o decisión afectada, área responsable y problema descrito.","e":"P06","o":"si","l":"si","n":"si","a":"","te":"The opportunity arises from a specific business need: affected process or decision, responsible area and described problem.","ae":"","s":[]},{"c":"G1.02","g":"G1","t":"La ficha de caso de uso explica qué es y para qué se usa en lenguaje comprensible para un no especialista.","e":"P31","o":"condicionable","l":"simpl","n":"si","a":"","te":"The use case sheet explains what it is and what it is used for in language understandable to a non-specialist.","ae":"","s":[]},{"c":"G1.03","g":"G1","t":"Se han analizado alternativas sin IA y se justifica qué aporta la IA que esas alternativas no aportan.","e":"P06","o":"si","l":"si","n":"si","a":"","te":"Non-AI alternatives have been analysed and it is justified what AI provides that those alternatives do not.","ae":"","s":[]},{"c":"G1.04","g":"G1","t":"Las notas de filtrado registran las oportunidades descartadas y su motivo.","e":"P06","o":"condicionable","l":"simpl","n":"si","a":"","te":"The screening notes record the discarded opportunities and the reason.","ae":"","s":[]},{"c":"G1.05","g":"G1","t":"El valor potencial está estimado en orden de magnitud, con supuestos explícitos y estado \"estimado\".","e":"P06","o":"condicionable","l":"si","n":"si","a":"","te":"The potential value is estimated as an order of magnitude, with explicit assumptions and \"estimated\" status.","ae":"","s":[]},{"c":"G1.06","g":"G1","t":"La esfera y el nivel de ambición están propuestos con las cinco preguntas del clasificador.","e":"P07 · T05","o":"si","l":"si","n":"si","a":"Transformar: la propuesta se comunica al comité de IA antes de iniciar la fase 2.","te":"The sphere and the ambition level are proposed using the five questions of the classifier.","ae":"Transform: the proposal is communicated to the AI Committee before phase 2 begins.","s":[]},{"c":"G1.07","g":"G1","t":"El cribado de la oportunidad concreta descarta prácticas prohibidas, y la intensidad se ha revisado si han aparecido decisiones sobre personas, datos especialmente protegidos o exposición directa.","e":"P07 · P04","o":"si_critico","l":"si","n":"si","a":"","te":"The screening of the specific opportunity rules out prohibited practices, and the intensity has been reviewed if decisions about people, specially protected data or direct exposure have emerged.","ae":"","s":[]},{"c":"G1.08","g":"G1","t":"Se ha comprobado de forma preliminar que los datos necesarios existen, quién es su propietario y que su uso es plausiblemente lícito.","e":"P06","o":"condicionable","l":"si","n":"si","a":"","te":"It has been checked on a preliminary basis that the necessary data exist, who owns them and that their use is plausibly lawful.","ae":"","s":[]},{"c":"G1.09","g":"G1","t":"[TER] Si se prevé comprar o aliarse, se identifica la opción de proveedor y un nivel de exigencia preliminar (N1–N3).","e":"P06","o":"condicionable","l":"rec","n":"si","a":"","te":"[TER] If buying or partnering is envisaged, the supplier option and a preliminary requirement level (N1–N3) are identified.","ae":"","s":["TER"]},{"c":"G1.10","g":"G1","t":"Se identifican los roles y equipos afectados para anticipar el impacto en las personas.","e":"P06","o":"condicionable","l":"si","n":"si","a":"Optimizar: recomendado.","te":"The affected roles and teams are identified in order to anticipate the impact on people.","ae":"Optimise: recommended.","s":[]},{"c":"G2.01","g":"G2","t":"La hipótesis es falsable: indica qué cambia, en qué métrica, cuánto, en qué plazo y qué resultado la refutaría.","e":"P08 · T11","o":"si","l":"si","n":"si","a":"Transformar: admite mayor incertidumbre si se cumple G2.11.","te":"The hypothesis is falsifiable: it states what changes, in which metric, by how much, within what time frame and which result would refute it.","ae":"Transform: allows greater uncertainty if G2.11 is met.","s":[]},{"c":"G2.02","g":"G2","t":"La métrica principal y las secundarias tienen definición, fórmula, fuente de datos y responsable de medición.","e":"P08","o":"si","l":"simpl","n":"si","a":"","te":"The main and secondary metrics have a definition, formula, data source and measurement owner.","ae":"","s":[]},{"c":"G2.03","g":"G2","t":"La línea base está medida con datos reales (periodo, fuente y método); si es estimada, se justifica y la aprueba el decisor.","e":"P09","o":"condicionable","l":"si","n":"si","a":"Optimizar: coste, tiempo o errores. Aumentar: rendimiento y coste. Transformar: situación de partida del mercado o del cliente, cuando exista.","te":"The baseline is measured with real data (period, source and method); if it is estimated, this is justified and approved by the decision-maker.","ae":"Optimise: cost, time or errors. Augment: performance and cost. Transform: starting position of the market or customer, where it exists.","s":[]},{"c":"G2.04","g":"G2","t":"El objetivo y el umbral de éxito son explícitos y cuantificados.","e":"P08","o":"si","l":"si","n":"si","a":"","te":"The target and the success threshold are explicit and quantified.","ae":"","s":[]},{"c":"G2.05","g":"G2","t":"El método de atribución está elegido y justificado; en Enterprise, grupo de control o motivo por el que no es posible.","e":"P08","o":"condicionable","l":"si","n":"si","a":"","te":"The attribution method is chosen and justified; in Enterprise, a control group or the reason why one is not possible.","ae":"","s":[]},{"c":"G2.06","g":"G2","t":"El valor esperado se expresa en dinero con fórmula (unidades × valor unitario), es incremental, separa eficiencias, retorno y coste recurrente, y declara el reparto si otro caso comparte el resultado.","e":"P08 · T11","o":"si","l":"si","n":"si","a":"Optimizar: ahorro esperado con fórmula. Aumentar: efecto económico del rendimiento y del coste. Transformar: hipótesis de retorno por etapas.","te":"The expected value is expressed in money with a formula (units × unit value), is incremental, separates efficiencies, return and recurring cost, and declares the allocation if another case shares the result.","ae":"Optimise: expected savings with a formula. Augment: economic effect of performance and cost. Transform: staged return hypothesis.","s":[]},{"c":"G2.07","g":"G2","t":"La capacidad liberada se informa separada del ahorro, con el modo previsto de materializarla o reasignarla.","e":"P08","o":"condicionable","l":"si","n":"si","a":"","te":"Released capacity is reported separately from savings, with the planned way of realising or reallocating it.","ae":"","s":[]},{"c":"G2.08","g":"G2","t":"Los criterios de parada están definidos antes de invertir, con umbral y fecha o hito de evaluación.","e":"P08","o":"si","l":"si","n":"si","a":"Transformar: criterios de parada por etapa.","te":"The stop criteria are defined before investing, with a threshold and an evaluation date or milestone.","ae":"Transform: stop criteria per stage.","s":[]},{"c":"G2.09","g":"G2","t":"El nivel de ambición está confirmado con evidencia y se explica cualquier cambio respecto a G1.","e":"P07 · T05","o":"si","l":"si","n":"si","a":"","te":"The ambition level is confirmed with evidence, and any change with respect to G1 is explained.","ae":"","s":[]},{"c":"G2.10","g":"G2","t":"Existe objetivo de adopción: usuarios, uso y frecuencia esperados.","e":"P08 · P20","o":"condicionable","l":"si","n":"si","a":"Optimizar: recomendado.","te":"There is an adoption target: expected users, use and frequency.","ae":"Optimise: recommended.","s":[]},{"c":"G2.11","g":"G2","t":"Transformar: la hipótesis incluye hitos de aprendizaje, límite de inversión por etapa y criterios de parada por etapa.","e":"P08","o":"si","l":"na","n":"si","a":"Solo Transformar.","te":"Transform: the hypothesis includes learning milestones, an investment limit per stage and stop criteria per stage.","ae":"Transform only.","s":["TRANSFORMAR"]},{"c":"G2.12","g":"G2","t":"Transformar: el consejo o su comisión delegada ha aprobado expresamente la apuesta y consta en el registro.","e":"P29","o":"si","l":"na","n":"si","a":"Solo Transformar.","te":"Transform: the board or its board committee has expressly approved the bet and this is recorded in the register.","ae":"Transform only.","s":["TRANSFORMAR"]},{"c":"G2.13","g":"G2","t":"La inversión estimada hasta G5 y el neto adicional por euro preliminar están calculados.","e":"P08 · T11","o":"condicionable","l":"simpl","n":"si","a":"Transformar: por etapa.","te":"The estimated investment up to G5 and the preliminary additional net value per euro are calculated.","ae":"Transform: per stage.","s":[]},{"c":"G3.01","g":"G3","t":"La viabilidad técnica está demostrada con datos reales de la compañía (prueba técnica o análisis sobre muestra representativa), no solo con supuestos.","e":"P10","o":"si","l":"si","n":"si","a":"Transformar: viabilidad de la primera etapa.","te":"Technical feasibility is demonstrated with the company's real data (technical proof or analysis on a representative sample), not only with assumptions.","ae":"Transform: feasibility of the first stage.","s":[]},{"c":"G3.02","g":"G3","t":"Los datos están disponibles, con calidad evaluada (completitud, representatividad, actualidad y sesgos conocidos) y propietario identificado.","e":"P10","o":"condicionable","l":"simpl","n":"si","a":"","te":"The data are available, with assessed quality (completeness, representativeness, timeliness and known biases) and an identified owner.","ae":"","s":[]},{"c":"G3.03","g":"G3","t":"La base legal del tratamiento de datos personales y la minimización están confirmadas por la función de protección de datos.","e":"P11","o":"si_critico","l":"si","n":"si","a":"","te":"The legal basis for processing personal data and data minimisation are confirmed by the data protection function.","ae":"","s":[]},{"c":"G3.04","g":"G3","t":"Los costes completos están estimados por categoría: construcción, recurrentes (licencias, consumo de modelos, cómputo, operación) y adopción.","e":"P10 · T13","o":"si","l":"simpl","n":"si","a":"","te":"Full costs are estimated by category: construction, recurring (licences, model consumption, compute, operation) and adoption.","ae":"","s":[]},{"c":"G3.05","g":"G3","t":"El neto esperado es coherente con el apetito de riesgo y el horizonte de retorno fijados en C2.","e":"P10 · P08","o":"si","l":"si","n":"si","a":"Optimizar: neto anual esperado positivo dentro del horizonte. Aumentar: además, viabilidad de la adopción y del cambio de rol. Transformar: viabilidad de la primera etapa, criterios de parada por etapa y valor de opción documentado.","te":"The expected net value is consistent with the risk appetite and the return horizon set in C2.","ae":"Optimise: positive expected annual net value within the horizon. Augment: in addition, feasibility of adoption and of the role change. Transform: feasibility of the first stage, stop criteria per stage and documented option value.","s":[]},{"c":"G3.06","g":"G3","t":"Los criterios de parada aprobados en G2 siguen vigentes y no se han relajado sin aprobación del órgano que autorizó la iniciativa.","e":"P08 · P29","o":"si","l":"si","n":"si","a":"","te":"The stop criteria approved at G2 remain in force and have not been relaxed without the approval of the body that authorised the initiative.","ae":"","s":[]},{"c":"G3.07","g":"G3","t":"La clasificación regulatoria está hecha con criterio jurídico cualificado, fechada y firmada, e indica el rol de la compañía (proveedor o responsable del despliegue).","e":"P11 · T07","o":"si_critico","l":"si","n":"si","a":"","te":"The regulatory classification has been carried out with qualified legal judgement, is dated and signed, and states the company's role (provider or deployer).","ae":"","s":[]},{"c":"G3.08","g":"G3","t":"No hay ninguna práctica prohibida. Si la hay, el único resultado posible es Parar.","e":"P11","o":"si_critico","l":"si","n":"si","a":"","te":"There is no prohibited practice. If there is one, the only possible outcome is Stop.","ae":"","s":[]},{"c":"G3.09","g":"G3","t":"Está determinado qué evaluaciones de impacto proceden (protección de datos, derechos fundamentales, sectoriales) y las exigibles antes del tratamiento están realizadas o iniciadas con cierre previsto antes de G4.","e":"P11","o":"si_critico","l":"si","n":"si","a":"","te":"It has been determined which impact assessments are required (data protection, fundamental rights, sector-specific), and those required before processing have been carried out or started with completion expected before G4.","ae":"","s":[]},{"c":"G3.10","g":"G3","t":"Las obligaciones regulatorias aplicables están vinculadas a fase, rol y evidencia.","e":"P11","o":"condicionable","l":"simpl","n":"si","a":"","te":"The applicable regulatory obligations are linked to phase, role and evidence.","ae":"","s":[]},{"c":"G3.11","g":"G3","t":"Los riesgos están identificados en las categorías aplicables y valorados con la escala del documento 33 (probabilidad × impacto, inherente y residual).","e":"P12 · T06","o":"si","l":"simpl","n":"si","a":"","te":"The risks are identified in the applicable categories and assessed using the scale in document 33 (probability × impact, inherent and residual).","ae":"","s":[]},{"c":"G3.12","g":"G3","t":"Ningún riesgo residual Crítico carece de aprobación expresa del consejo o de su comisión delegada dentro del apetito de riesgo; los Altos están aceptados por el comité de IA y los Medios por el patrocinador con conformidad de riesgos.","e":"P12 · P29","o":"si_critico","l":"si","n":"si","a":"","te":"No Critical residual risk lacks the express approval of the board or its board committee within the risk appetite; High risks are accepted by the AI Committee and Medium risks by the sponsor with risk clearance.","ae":"","s":[]},{"c":"G3.13","g":"G3","t":"Cada riesgo residual Alto o Crítico tiene plan de mitigación y contingencia con control, responsable y plazo.","e":"P13","o":"si","l":"si","n":"si","a":"","te":"Each High or Critical residual risk has a mitigation and contingency plan with a control, owner and time limit.","ae":"","s":[]},{"c":"G3.14","g":"G3","t":"Los riesgos Medios tienen respuesta decidida (evitar, mitigar, transferir o aceptar) y responsable.","e":"P13","o":"condicionable","l":"simpl","n":"si","a":"","te":"Medium risks have a decided response (avoid, mitigate, transfer or accept) and an owner.","ae":"","s":[]},{"c":"G3.15","g":"G3","t":"La intensidad se ha revisado con la información de la fase 3.","e":"P04 · T04","o":"si","l":"si","n":"si","a":"","te":"The intensity has been reviewed with the information from phase 3.","ae":"","s":[]},{"c":"G3.16","g":"G3","t":"Se ha valorado el impacto en las personas: roles y tareas afectados, capacidades necesarias y, cuando proceda, información o consulta a la representación de los trabajadores.","e":"P10 · P20","o":"condicionable","l":"simpl","n":"si","a":"Optimizar: impacto en tareas. Aumentar: viabilidad del cambio de rol. Transformar: impacto en el modelo operativo.","te":"The impact on people has been assessed: affected roles and tasks, required capabilities and, where appropriate, information to or consultation with workers' representatives.","ae":"Optimise: impact on tasks. Augment: feasibility of the role change. Transform: impact on the operating model.","s":[]},{"c":"G3.17","g":"G3","t":"[GEN] Están valorados los riesgos tipo RT-GEN y RT-SEG: inyección de instrucciones directa e indirecta, fuga de información, contenido erróneo o inventado, permisos excesivos y acciones no autorizadas.","e":"P12","o":"si_critico","l":"si","n":"si","a":"","te":"[GEN] The RT-GEN and RT-SEG typical risks are assessed: direct and indirect prompt injection, information leakage, erroneous or fabricated content, excessive permissions and unauthorised actions.","ae":"","s":["GEN"]},{"c":"G3.18","g":"G3","t":"[GEN] El nivel de autonomía objetivo (A0–A3) está propuesto y justificado; si es A2 o A3 con efecto sobre terceros, dinero, datos personales o sistemas de producción, la intensidad es Enterprise.","e":"P04 · P12","o":"si_critico","l":"si","n":"si","a":"","te":"[GEN] The target autonomy level (A0–A3) is proposed and justified; if it is A2 or A3 with an effect on third parties, money, personal data or production systems, the intensity is Enterprise.","ae":"","s":["GEN"]},{"c":"G3.19","g":"G3","t":"[GEN] Está definido el enfoque de evaluación: conjuntos de prueba representativos, métricas de calidad y de seguridad y umbrales de aceptación.","e":"P10","o":"condicionable","l":"simpl","n":"si","a":"","te":"[GEN] The evaluation approach is defined: representative test sets, quality and security metrics and acceptance thresholds.","ae":"","s":["GEN"]},{"c":"G3.20","g":"G3","t":"[TER] Cada proveedor está evaluado al nivel de exigencia que le corresponde (N1–N3): seguridad, tratamiento y ubicación de los datos, uso de los datos para entrenar, propiedad intelectual, continuidad, dependencia y estrategia de salida.","e":"P14 · T09","o":"si","l":"simpl","n":"si","a":"","te":"[TER] Each supplier is assessed at the requirement level that corresponds to it (N1–N3): security, processing and location of data, use of data for training, intellectual property, continuity, dependency and exit strategy.","ae":"","s":["TER"]},{"c":"G3.21","g":"G3","t":"[TER] Las condiciones contractuales mínimas están fijadas como requisito de contratación: confidencialidad, prohibición de usar los datos para otros fines, notificación de incidentes, derecho de auditoría o informes equivalentes (N2–N3) y devolución o borrado de datos al terminar.","e":"P14","o":"si_critico","l":"si","n":"si","a":"","te":"[TER] The minimum contractual terms are set as a procurement requirement: confidentiality, prohibition on using the data for other purposes, incident notification, right to audit or equivalent reports (N2–N3) and return or deletion of data on termination.","ae":"","s":["TER"]},{"c":"G3.22","g":"G3","t":"[TER] El proveedor aporta, o se compromete a aportar, la documentación que la regulación le exige y que la compañía necesita para cumplir sus propias obligaciones.","e":"P14 · P11","o":"condicionable","l":"rec","n":"si","a":"","te":"[TER] The supplier provides, or undertakes to provide, the documentation that regulation requires of it and that the company needs to meet its own obligations.","ae":"","s":["TER"]},{"c":"G4.01","g":"G4","t":"El registro de arquitectura describe componentes, integraciones, entornos, dependencias de terceros y decisiones con sus alternativas.","e":"P15","o":"condicionable","l":"simpl","n":"si","a":"","te":"The architecture record describes components, integrations, environments, third-party dependencies and decisions with their alternatives.","ae":"","s":[]},{"c":"G4.02","g":"G4","t":"La arquitectura garantiza trazabilidad: registro automático de entradas, salidas, versiones y decisiones relevantes, con periodo de conservación definido.","e":"P15","o":"si_critico","l":"simpl","n":"si","a":"","te":"The architecture guarantees traceability: automatic logging of inputs, outputs, versions and relevant decisions, with a defined retention period.","ae":"","s":[]},{"c":"G4.03","g":"G4","t":"El linaje documenta fuentes y transformaciones de datos, versiones de modelos, datos de entrenamiento o ajuste y modelos de base de terceros.","e":"P16","o":"condicionable","l":"simpl","n":"si","a":"","te":"The lineage documents data sources and transformations, model versions, training or fine-tuning data and third-party foundation models.","ae":"","s":[]},{"c":"G4.04","g":"G4","t":"El diseño de supervisión humana fija qué decide el sistema, qué valida una persona y qué no se delega nunca, y designa quién interviene, con qué autoridad y con qué medios.","e":"P17","o":"si_critico","l":"si","n":"si","a":"","te":"The human oversight design sets out what the system decides, what a person validates and what is never delegated, and designates who intervenes, with what authority and with what means.","ae":"","s":[]},{"c":"G4.05","g":"G4","t":"Las obligaciones de transparencia están diseñadas: aviso de interacción con IA o de contenido generado cuando proceda, e información y vía de revisión humana en decisiones automatizadas que afecten a personas.","e":"P17","o":"si_critico","l":"si","n":"si","a":"","te":"The transparency obligations are designed: notice of interaction with AI or of generated content where appropriate, and information and a route to human review in automated decisions about people.","ae":"","s":[]},{"c":"G4.06","g":"G4","t":"Cada riesgo Medio o superior de la fase 3 tiene un control diseñado y trazable al registro de riesgos.","e":"P12 · P18","o":"si","l":"si","n":"si","a":"","te":"Each Medium or higher risk from phase 3 has a designed control that is traceable to the risk register.","ae":"","s":[]},{"c":"G4.07","g":"G4","t":"El diseño de seguridad cubre identidad y accesos, cifrado, segregación de entornos, gestión de secretos y amenazas específicas de IA (envenenamiento de datos, extracción de modelos, evasión).","e":"P18","o":"si_critico","l":"simpl","n":"si","a":"","te":"The security design covers identity and access, encryption, environment segregation, secrets management and AI-specific threats (data poisoning, model extraction, evasion).","ae":"","s":[]},{"c":"G4.08","g":"G4","t":"La monitorización está definida (rendimiento, degradación, sesgo, coste, seguridad y uso) con umbrales, alertas y responsable de operación asignado.","e":"P15 · P03","o":"condicionable","l":"simpl","n":"si","a":"","te":"Monitoring is defined (performance, degradation, bias, cost, security and use) with thresholds, alerts and an assigned operations owner.","ae":"","s":[]},{"c":"G4.09","g":"G4","t":"Existe mecanismo de parada (desactivación o paso a modo manual) con responsable y tiempo objetivo de activación.","e":"P19","o":"si_critico","l":"si","n":"si","a":"","te":"There is a stop mechanism (deactivation or switch to manual mode) with an owner and a target activation time.","ae":"","s":[]},{"c":"G4.10","g":"G4","t":"El plan de reversión define criterios de activación, procedimiento, responsable, alternativa operativa y tratamiento de los datos, y prevé su prueba en la fase 5.","e":"P19","o":"si","l":"simpl","n":"si","a":"","te":"The rollback plan defines activation criteria, procedure, owner, operational alternative and treatment of data, and provides for its testing in phase 5.","ae":"","s":[]},{"c":"G4.11","g":"G4","t":"Existe plan de adopción con formación, comunicación, apoyo y medición del uso.","e":"P20 · T20","o":"condicionable","l":"simpl","n":"si","a":"Optimizar: cómo se materializará la capacidad liberada. Aumentar: cambio de rol y reasignación de capacidad. Transformar: cambio del modelo operativo de la primera etapa.","te":"There is an adoption plan with training, communication, support and measurement of use.","ae":"Optimise: how released capacity will be realised. Augment: role change and capacity reallocation. Transform: change in the operating model for the first stage.","s":[]},{"c":"G4.12","g":"G4","t":"El plan de pruebas (funcionales, rendimiento, sesgo, robustez y seguridad) y el diseño del piloto con el método de atribución aprobado tienen criterios de aceptación.","e":"P22","o":"condicionable","l":"simpl","n":"si","a":"Transformar: el piloto mide la evidencia de mercado o de cliente prevista.","te":"The test plan (functional, performance, bias, robustness and security) and the pilot design with the approved attribution method have acceptance criteria.","ae":"Transform: the pilot measures the planned market or customer evidence.","s":[]},{"c":"G4.13","g":"G4","t":"Las evaluaciones de impacto exigibles están completadas y sus medidas incorporadas al diseño.","e":"P11","o":"si_critico","l":"si","n":"si","a":"","te":"The required impact assessments are completed and their measures incorporated into the design.","ae":"","s":[]},{"c":"G4.14","g":"G4","t":"Si el sistema es de alto riesgo, están planificadas con responsable las obligaciones que correspondan al rol de la compañía (gestión de riesgos, gobernanza de datos, documentación técnica, registros, instrucciones de uso, supervisión humana, precisión y robustez).","e":"P11 · P15","o":"si_critico","l":"na","n":"si","a":"","te":"If the system is high-risk, the obligations corresponding to the company's role (risk management, data governance, technical documentation, logs, instructions for use, human oversight, accuracy and robustness) are planned with an owner.","ae":"","s":[]},{"c":"G4.15","g":"G4","t":"[AG] El agente tiene identidad propia, distinta de la de cualquier persona, con credenciales gestionadas, rotadas y revocables.","e":"P18 · T10","o":"si_critico","l":"si","n":"si","a":"","te":"[AG] The agent has its own identity, distinct from that of any person, with managed, rotated and revocable credentials.","ae":"","s":["AG"]},{"c":"G4.16","g":"G4","t":"[AG] Los permisos son mínimos y los límites de actuación explícitos: herramientas, operaciones, sistemas, importes, destinatarios y volúmenes permitidos.","e":"P18 · T10","o":"si_critico","l":"si","n":"si","a":"","te":"[AG] Permissions are minimal and the limits of action are explicit: permitted tools, operations, systems, amounts, recipients and volumes.","ae":"","s":["AG"]},{"c":"G4.17","g":"G4","t":"[AG] Existe control de intención: cada acción queda vinculada a la instrucción y a la finalidad que la originan y, si es sensible, se contrasta con la finalidad autorizada antes de ejecutarse.","e":"P18 · T10","o":"si_critico","l":"si","n":"si","a":"","te":"[AG] There is intent-based access control: each action is linked to the instruction and purpose that originate it and, if it is sensitive, is checked against the authorised purpose before being executed.","ae":"","s":["AG"]},{"c":"G4.18","g":"G4","t":"[AG] Existe interruptor de parada que detiene de inmediato al agente y revoca sus credenciales, con responsable y prueba prevista.","e":"P18 · P19","o":"si_critico","l":"si","n":"si","a":"","te":"[AG] There is a kill switch that immediately stops the agent and revokes its credentials, with an owner and a planned test.","ae":"","s":["AG"]},{"c":"G4.19","g":"G4","t":"[AG] Las acciones sensibles o irreversibles requieren validación humana previa según el nivel de autonomía aprobado.","e":"P17","o":"si_critico","l":"si","n":"si","a":"","te":"[AG] Sensitive or irreversible actions require prior human validation according to the approved autonomy level.","ae":"","s":["AG"]},{"c":"G4.20","g":"G4","t":"[GEN] Hay defensas frente a inyección de instrucciones y fuga de información: separación entre instrucciones y datos, contenido externo tratado como no confiable, filtrado de entradas y salidas y restricción de herramientas.","e":"P18 · T10","o":"si_critico","l":"si","n":"si","a":"","te":"[GEN] There are defences against prompt injection and information leakage: separation between instructions and data, external content treated as untrusted, input and output filtering and restriction of tools.","ae":"","s":["GEN"]},{"c":"G4.21","g":"G4","t":"[GEN] El conjunto de evaluación y sus umbrales (calidad, fundamentación de las respuestas, contenido dañino y seguridad) están aprobados antes de construir.","e":"P22","o":"condicionable","l":"simpl","n":"si","a":"","te":"[GEN] The evaluation set and its thresholds (quality, grounding of responses, harmful content and security) are approved before building.","ae":"","s":["GEN"]},{"c":"G4.22","g":"G4","t":"[TER] Las cláusulas exigidas en G3.21 están incorporadas al contrato o al borrador en negociación, y la integración con el proveedor está documentada.","e":"P14 · P15","o":"condicionable","l":"si","n":"si","a":"","te":"[TER] The clauses required in G3.21 are incorporated into the contract or the draft under negotiation, and the integration with the supplier is documented.","ae":"","s":["TER"]},{"c":"G5.01","g":"G5","t":"El informe de entrega describe lo construido o integrado y las desviaciones respecto al diseño aprobado en G4, con su aprobación.","e":"P21","o":"condicionable","l":"simpl","n":"si","a":"","te":"The delivery report describes what has been built or integrated and the deviations from the design approved at G4, with their approval.","ae":"","s":[]},{"c":"G5.02","g":"G5","t":"Las pruebas funcionales y de rendimiento cumplen los criterios de aceptación.","e":"P22","o":"si","l":"si","n":"si","a":"","te":"The functional and performance tests meet the acceptance criteria.","ae":"","s":[]},{"c":"G5.03","g":"G5","t":"Si el sistema afecta a personas, las pruebas de sesgo y no discriminación están hechas y los resultados están dentro de los umbrales.","e":"P22","o":"si_critico","l":"si","n":"si","a":"","te":"If the system affects people, the bias and non-discrimination tests have been carried out and the results are within the thresholds.","ae":"","s":[]},{"c":"G5.04","g":"G5","t":"Las pruebas de robustez y seguridad están hechas y no quedan vulnerabilidades críticas o altas abiertas.","e":"P22","o":"si_critico","l":"simpl","n":"si","a":"","te":"The robustness and security tests have been carried out and no critical or high vulnerabilities remain open.","ae":"","s":[]},{"c":"G5.05","g":"G5","t":"[GEN] Las evaluaciones sobre el conjunto aprobado alcanzan los umbrales y se han superado pruebas de inyección de instrucciones directa e indirecta y de fuga de información.","e":"P22 · T10","o":"si_critico","l":"si","n":"si","a":"","te":"[GEN] The evaluations on the approved set reach the thresholds, and direct and indirect prompt injection and information leakage tests have been passed.","ae":"","s":["GEN"]},{"c":"G5.06","g":"G5","t":"[AG] Las pruebas demuestran que los límites de actuación y el control de intención bloquean acciones no autorizadas y que el interruptor de parada detiene al agente y revoca sus credenciales.","e":"P22 · P19 · T10","o":"si_critico","l":"si","n":"si","a":"","te":"[AG] The tests demonstrate that the limits of action and intent-based access control block unauthorised actions and that the kill switch stops the agent and revokes its credentials.","ae":"","s":["AG"]},{"c":"G5.07","g":"G5","t":"[AG] El nivel de autonomía autorizado para producción es el probado; cualquier aumento posterior exige volver a G4 y G5.","e":"P18 · P23","o":"si_critico","l":"si","n":"si","a":"","te":"[AG] The autonomy level authorised for production is the one tested; any subsequent increase requires returning to G4 and G5.","ae":"","s":["AG"]},{"c":"G5.08","g":"G5","t":"El piloto se ha ejecutado con el método de atribución aprobado y sus resultados alcanzan el umbral de éxito o lo hacen con condiciones aceptadas.","e":"P22 · T11","o":"condicionable","l":"si","n":"si","a":"Optimizar: eficiencia validada frente a la línea base. Aumentar: adopción real y mejora de rendimiento medidas. Transformar: evidencia de mercado o de cliente (uso, conversión, ingresos iniciales o cambio operativo verificado).","te":"The pilot has been run with the approved attribution method and its results reach the success threshold or do so with accepted conditions.","ae":"Optimise: efficiency validated against the baseline. Augment: actual adoption and performance improvement measured. Transform: market or customer evidence (use, conversion, initial revenue or verified operational change).","s":[]},{"c":"G5.09","g":"G5","t":"No se ha alcanzado ningún criterio de parada o, si se ha alcanzado, el órgano que autorizó la iniciativa ha decidido expresamente continuar.","e":"P22 · P29","o":"si","l":"si","n":"si","a":"","te":"No stop criterion has been reached or, if one has been reached, the body that authorised the initiative has expressly decided to proceed.","ae":"","s":[]},{"c":"G5.10","g":"G5","t":"Hay plan para materializar o reasignar la capacidad liberada, con responsable y fecha.","e":"P20","o":"condicionable","l":"si","n":"si","a":"Optimizar: materializar. Aumentar: reasignar. Transformar: solo si hay capacidad liberada.","te":"There is a plan to realise or reallocate the released capacity, with an owner and a date.","ae":"Optimise: realise. Augment: reallocate. Transform: only if there is released capacity.","s":[]},{"c":"G5.11","g":"G5","t":"El plan de reversión se ha probado y el tiempo real de reversión cumple el objetivo.","e":"P19","o":"si","l":"si","n":"si","a":"","te":"The rollback plan has been tested and the actual rollback time meets the target.","ae":"","s":[]},{"c":"G5.12","g":"G5","t":"El registro de riesgos está actualizado con los resultados de las pruebas y las aceptaciones del riesgo residual constan al nivel que corresponde (G3.12).","e":"P12 · T06","o":"si_critico","l":"si","n":"si","a":"","te":"The risk register is updated with the test results, and the acceptances of residual risk are recorded at the corresponding level (G3.12).","ae":"","s":[]},{"c":"G5.13","g":"G5","t":"Los controles críticos de seguridad, cumplimiento y supervisión humana están activos y verificados en el entorno de producción, no solo diseñados.","e":"P22 · P25","o":"si_critico","l":"si","n":"si","a":"","te":"The critical security, compliance and human oversight controls are active and verified in the production environment, not only designed.","ae":"","s":[]},{"c":"G5.14","g":"G5","t":"Las personas que ejercen la supervisión humana están designadas, formadas y disponen de autoridad y medios para intervenir.","e":"P17 · P20","o":"si_critico","l":"si","n":"si","a":"","te":"The people who exercise human oversight are designated, trained and have the authority and means to intervene.","ae":"","s":[]},{"c":"G5.15","g":"G5","t":"Las obligaciones regulatorias previas a la puesta en servicio están cumplidas según el rol de la compañía (por ejemplo, en alto riesgo: evaluación de conformidad, registro e instrucciones de uso cuando correspondan; transparencia en todos los casos aplicables).","e":"P11","o":"si_critico","l":"si","n":"si","a":"","te":"The regulatory obligations prior to putting into service are met according to the company's role (for example, for high-risk: conformity assessment, registration and instructions for use where applicable; transparency in all applicable cases).","ae":"","s":[]},{"c":"G5.16","g":"G5","t":"La monitorización y las alertas están configuradas y probadas.","e":"P25","o":"si","l":"simpl","n":"si","a":"","te":"Monitoring and alerts are configured and tested.","ae":"","s":[]},{"c":"G5.17","g":"G5","t":"El plan de respuesta a incidentes define severidades S1–S4, escalado y notificaciones regulatorias aplicables (incidente grave de IA, protección de datos, DORA o NIS2) con sus plazos.","e":"P26 · T08","o":"si_critico","l":"simpl","n":"si","a":"","te":"The incident response plan defines severities S1–S4, escalation and applicable regulatory notifications (serious AI incident, data protection, DORA or NIS2) with their time limits.","ae":"","s":[]},{"c":"G5.18","g":"G5","t":"El manual de operación está disponible y aceptado por el responsable de operación.","e":"P24","o":"condicionable","l":"simpl","n":"si","a":"","te":"The operations manual is available and accepted by the operations owner.","ae":"","s":[]},{"c":"G5.19","g":"G5","t":"Los usuarios están formados y hay evidencia de alfabetización en IA del personal que usa o supervisa el sistema.","e":"P20","o":"condicionable","l":"si","n":"si","a":"","te":"Users are trained and there is evidence of AI literacy among the staff who use or oversee the system.","ae":"","s":[]},{"c":"G5.20","g":"G5","t":"[TER] El contrato está firmado con las cláusulas exigidas y el proveedor figura en el registro de proveedores.","e":"P14 · T09","o":"si_critico","l":"si","n":"si","a":"","te":"[TER] The contract is signed with the required clauses and the supplier appears in the supplier register.","ae":"","s":["TER"]},{"c":"G5.21","g":"G5","t":"El seguimiento de valor está configurado (periodicidad, fuente y responsable de validación) y los resultados del piloto constan con su estado (validado, declarado o estimado).","e":"P28 · T12","o":"condicionable","l":"simpl","n":"si","a":"","te":"Value tracking is configured (frequency, source and validation owner) and the pilot results are recorded with their status (validated, declared or estimated).","ae":"","s":[]},{"c":"G5.22","g":"G5","t":"Las condiciones de *gates* anteriores están cerradas o, si no afectan a controles críticos, dentro de plazo.","e":"P29 · T03","o":"si","l":"si","n":"si","a":"","te":"The conditions from previous *gates* are closed or, if they do not affect critical controls, within their time limit.","ae":"","s":[]},{"c":"G5.23","g":"G5","t":"La puesta en producción está firmada: en Lite, con conformidad de riesgos; en Enterprise, con firma multinivel sin ningún veto vigente (sección 9).","e":"P23 · T03","o":"si_critico","l":"si","n":"si","a":"","te":"Go-live is signed off: in Lite, with risk clearance; in Enterprise, with multi-level sign-off and no veto in force (section 9).","ae":"","s":[]},{"c":"R6.01","g":"R6","t":"La revisión se realiza dentro de su periodicidad.","e":"P29 · T01","o":"si","l":"si","n":"si","a":"","te":"The review is carried out within its frequency.","ae":"","s":[]},{"c":"R6.02","g":"R6","t":"El valor realizado se mide frente a la hipótesis, con estado de validación y proporción de valor validado.","e":"P28 · T12","o":"si","l":"simpl","n":"si","a":"Optimizar: ahorro materializado o capacidad reasignada. Aumentar: rendimiento y adopción sostenidos. Transformar: avance frente a los hitos de la etapa.","te":"The realised value is measured against the hypothesis, with validation status and proportion of validated value.","ae":"Optimise: realised savings or reassigned capacity. Augment: sustained performance and adoption. Transform: progress against the stage milestones.","s":[]},{"c":"R6.03","g":"R6","t":"Los costes reales se comparan con los estimados y las desviaciones están explicadas.","e":"P28 · T13","o":"condicionable","l":"simpl","n":"si","a":"","te":"Actual costs are compared with estimated costs and deviations are explained.","ae":"","s":[]},{"c":"R6.04","g":"R6","t":"El rendimiento está dentro de umbrales y los cambios de modelo o reentrenamientos están registrados.","e":"P25 · P27","o":"condicionable","l":"si","n":"si","a":"","te":"Performance is within thresholds and model changes or retraining are recorded.","ae":"","s":[]},{"c":"R6.05","g":"R6","t":"Si el sistema afecta a personas, el sesgo monitorizado está dentro de umbrales.","e":"P25","o":"si_critico","l":"si","n":"si","a":"","te":"If the system affects people, the monitored bias is within thresholds.","ae":"","s":[]},{"c":"R6.06","g":"R6","t":"Los incidentes están registrados con severidad, contención y cierre, y los notificables se notificaron en plazo.","e":"P27 · T08","o":"si_critico","l":"si","n":"si","a":"","te":"Incidents are recorded with severity, containment and closure, and notifiable incidents were notified on time.","ae":"","s":[]},{"c":"R6.07","g":"R6","t":"Los cambios significativos (finalidad, modelo, datos, autonomía, proveedor o alcance) se han evaluado y, cuando procedía, han pasado por G4 y G5.","e":"P27","o":"si","l":"si","n":"si","a":"","te":"Significant changes (purpose, model, data, autonomy, supplier or scope) have been assessed and, where appropriate, have gone through G4 and G5.","ae":"","s":[]},{"c":"R6.08","g":"R6","t":"La clasificación regulatoria, las evaluaciones de impacto y la intensidad siguen vigentes ante los cambios de uso o de regulación.","e":"P11 · P04","o":"si_critico","l":"si","n":"si","a":"","te":"The regulatory classification, the impact assessments and the intensity remain valid in the light of changes in use or regulation.","ae":"","s":[]},{"c":"R6.09","g":"R6","t":"El registro de riesgos está actualizado y los riesgos nuevos están valorados y aceptados al nivel que corresponde.","e":"P12 · T06","o":"condicionable","l":"simpl","n":"si","a":"","te":"The risk register is updated and new risks are assessed and accepted at the corresponding level.","ae":"","s":[]},{"c":"R6.10","g":"R6","t":"Hay evidencia de que los controles críticos funcionan: supervisión humana ejercida, registros conservados y mecanismo de parada disponible.","e":"P25 · P17","o":"si_critico","l":"si","n":"si","a":"","te":"There is evidence that the critical controls work: human oversight exercised, logs retained and stop mechanism available.","ae":"","s":[]},{"c":"R6.11","g":"R6","t":"[AG] Se han revisado permisos y credenciales, registros de intención y acciones bloqueadas o anómalas, y se ha probado el interruptor de parada en el periodo.","e":"P18 · P27 · T10","o":"si_critico","l":"si","n":"si","a":"","te":"[AG] Permissions and credentials, intent logs and blocked or anomalous actions have been reviewed, and the kill switch has been tested in the period.","ae":"","s":["AG"]},{"c":"R6.12","g":"R6","t":"[TER] Se han revisado los cambios del proveedor (modelo, condiciones, subencargados), sus incidentes y el cumplimiento del contrato.","e":"P14 · T09","o":"condicionable","l":"simpl","n":"si","a":"","te":"[TER] Supplier changes (model, terms, sub-processors), its incidents and compliance with the contract have been reviewed.","ae":"","s":["TER"]},{"c":"R6.13","g":"R6","t":"Se realiza la vigilancia posterior a la comercialización cuando la regulación la exige.","e":"P25 · P11","o":"si_critico","l":"na","n":"si","a":"","te":"Post-market monitoring is carried out where regulation requires it.","ae":"","s":[]},{"c":"R6.14","g":"R6","t":"La adopción se mide frente al objetivo.","e":"P20 · P28","o":"condicionable","l":"si","n":"si","a":"Optimizar: recomendado.","te":"Adoption is measured against the target.","ae":"Optimise: recommended.","s":[]},{"c":"R6.15","g":"R6","t":"Las condiciones y las no conformidades abiertas están dentro de plazo.","e":"P29 · T08","o":"si","l":"si","n":"si","a":"","te":"Open conditions and nonconformities are within their time limit.","ae":"","s":[]},{"c":"R6.16","g":"R6","t":"Se ha evaluado si concurre alguna desviación que obliga a adelantar G7 y la conclusión consta en el registro.","e":"P29","o":"si","l":"si","n":"si","a":"","te":"It has been assessed whether any deviation requiring G7 to be brought forward has occurred, and the conclusion is recorded in the register.","ae":"","s":[]},{"c":"G7.01","g":"G7","t":"El valor realizado está consolidado con su estado de validación; para Escalar, el valor que lo justifica está validado.","e":"P28 · T12","o":"si","l":"si","n":"si","a":"Optimizar: ahorro materializado, no solo capacidad liberada. Aumentar: rendimiento sostenido y capacidad reasignada. Transformar: retorno medido y cambio verificado del modelo operativo o de la oferta.","te":"The realised value is consolidated with its validation status; to Scale, the value that justifies it is validated.","ae":"Optimise: realised savings, not just released capacity. Augment: sustained performance and reassigned capacity. Transform: measured return and verified change in the operating model or the offering.","s":[]},{"c":"G7.02","g":"G7","t":"Hay conclusión explícita sobre la hipótesis (confirmada, parcialmente confirmada o refutada) frente al umbral y a los criterios de parada.","e":"P30","o":"si","l":"si","n":"si","a":"","te":"There is an explicit conclusion on the hypothesis (confirmed, partially confirmed or refuted) against the threshold and the stop criteria.","ae":"","s":[]},{"c":"G7.03","g":"G7","t":"La ambición real se ha revisado con el clasificador y cualquier diferencia con la declarada consta en el registro.","e":"P07 · T05","o":"si","l":"si","n":"si","a":"","te":"The actual ambition has been reviewed with the classifier and any difference from the declared ambition is recorded in the register.","ae":"","s":[]},{"c":"G7.04","g":"G7","t":"Se han evaluado los riesgos acumulados, los incidentes y las no conformidades del periodo.","e":"P12 · P27","o":"si","l":"simpl","n":"si","a":"","te":"The accumulated risks, incidents and nonconformities for the period have been assessed.","ae":"","s":[]},{"c":"G7.05","g": function L(grupo, codigo){ if(codigo==null||codigo==='') return ''; const g = (LB[UI.lang]||LB.es)[grupo]; const r = g && g[codigo]; return r ?? String(codigo); }
function faseTxt(f){ return f==null?'':(f+' · '+L('fase',f)); }
function gateTxt(g){ return g+' · '+L('gate',g); }

/* ---------------- utilidades ---------------- */
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
function esc(s){ return s==null?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iso(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function hoy(){ return (DB && DB.meta && DB.meta.fecha_referencia) || iso(new Date()); }
function ms(s){ return Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)); }
function dias(a,b){ return Math.round((ms(b)-ms(a))/864e5); }
function sumarDias(s,n){ const d=new Date(ms(s)+n*864e5); return d.toISOString().slice(0,10); }
function habiles(a,b){ if(!a||!b||b<=a) return 0; let n=0; let d=ms(a); const fin=ms(b); while(d<fin){ d+=864e5; const w=new Date(d).getUTCDay(); if(w!==0&&w!==6) n++; } return n; }
function esFecha(s){ return typeof s==='string' && /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(s); }
function sd(){ return '<span class="sd">'+esc(t('sin_dato'))+'</span>'; }
function fF(s){ return s? s.slice(8,10)+'-'+s.slice(5,7)+'-'+s.slice(0,4) : sd(); }
function fE(n){ if(n==null||isNaN(n)) return sd(); try{ return new Intl.NumberFormat(UI.lang==='es'?'es-ES':'en-GB',{style:'currency',currency:(DB.meta.moneda||'EUR'),maximumFractionDigits:0}).format(n); }catch(e){ return Math.round(n)+' '+(DB.meta.moneda||''); } }
function fN(n,dec){ if(n==null||isNaN(n)) return sd(); return new Intl.NumberFormat(UI.lang==='es'?'es-ES':'en-GB',{maximumFractionDigits:dec??1,minimumFractionDigits:0}).format(n); }
function fP(n){ return n==null||isNaN(n)? sd() : fN(n,0)+' %'; }
function sum(a){ return a.reduce((x,y)=>x+y,0); }
function percentil(arr,p){ if(!arr.length) return null; const s=[...arr].sort((a,b)=>a-b); const pos=(s.length-1)*p; const lo=Math.floor(pos), hi=Math.ceil(pos); return s[lo]+(s[hi]-s[lo])*(pos-lo); }
function mediana(a){ return percentil(a,.5); }
function agrupar(arr,fn){ const m=new Map(); arr.forEach(x=>{ const k=fn(x); if(!m.has(k)) m.set(k,[]); m.get(k).push(x); }); return m; }
function et(txt,cls){ return '<span class="et '+(cls||'')+'">'+esc(txt)+'</span>'; }

/* Cifras de la iniciativa en un momento dado: suma de sus importes esperados y realizados por tipo (null = sin dato, nunca cero).
   Se guardan en cada evento que cambia el estado de la iniciativa (alta, entrada en fase, parada y retirada), para conservar cómo
   evolucionan el coste, las eficiencias y el retorno a lo largo del embudo; el panel del consejo (T17) las muestra en el ciclo de vida. */
const EVENTOS_CON_CIFRAS = ['alta','entrada_fase','parada','retirada'];
function cifrasDe(iniciativaId){ const vs=DB.valores.filter(v=>v.iniciativa===iniciativaId); const r={};
  ['esperado','realizado'].forEach(m=>{ r[m]={}; ['inversion','coste_recurrente','eficiencias','retorno'].forEach(tp=>{ const xs=vs.filter(v=>v.momento===m && v.tipo===tp && v.importe!=null); r[m][tp]=xs.length? xs.reduce((a,v)=>a+v.importe,0) : null; }); });
  return r; }
function nuevoEvento(o){ const e=Object.assign({id:nextId(DB.eventos,'EVT-',6), fecha:hoy(), registrado:new Date().toISOString()}, o); if(e.iniciativa && EVENTOS_CON_CIFRAS.includes(e.tipo) && e.cifras===undefined) e.cifras=cifrasDe(e.iniciativa); if(!e.autor) e.autor = UI.autor || t('oficina'); DB.eventos.push(e); return e; }

/* ---------------- cálculos del embudo ---------------- */
const ACTIVOS = ['registrada','en_fase','pendiente_gate','en_espera','en_produccion','pendiente_g7'];
const GATE_DE_FASE = ['G0','G1','G2','G3','G4','G5','R6','G7'];
const FASE_DE_GATE = {G0:0,G1:1,G2:2,G3:3,G4:4,G5:5,R6:6,G7:7};
function cerrada(I){ return I.ciclo.estado==='parada'||I.ciclo.estado==='retirada'; }
function eventosDe(I){ return M.ev.get(I.id)||[]; }
function decisionesDe(I){ return M.dg.get(I.id)||[]; }
function condicionesDe(I){ return M.cnd.get(I.id)||[]; }
function estadoCond(c){ if(c.estado==='abierta' && c.plazo < hoy()) return 'vencida'; return c.estado; }
function intervalos(I){
  const out=[], esperas=[]; let cur=null, hold=null;
  for(const e of eventosDe(I)){
    if(e.tipo==='entrada_fase'){ if(cur && !cur.hasta){ if(hold){ cur.espera+=dias(hold.desde,e.fecha); } cur.hasta=e.fecha; } cur={fase:e.fase,desde:e.fecha,hasta:null,espera:0}; out.push(cur); }
    else if(e.tipo==='salida_fase'){ if(cur && !cur.hasta){ if(hold){ cur.espera+=dias(hold.desde,e.fecha); hold.hasta=e.fecha; hold=null; } cur.hasta=e.fecha; } }
    else if(e.tipo==='espera_inicio'){ hold={desde:e.fecha,hasta:null,motivo:e.despues||null,fase:e.fase}; esperas.push(hold); }
    else if(e.tipo==='espera_fin'){ if(hold){ if(cur && !cur.hasta) cur.espera+=dias(hold.desde,e.fecha); hold.hasta=e.fecha; hold=null; } }
  }
  const h=hoy();
  if(hold && cur && !cur.hasta) cur.espera+=dias(hold.desde,h);
  out.forEach(x=>{ x.dias=Math.max(0, dias(x.desde, x.hasta||h) - x.espera); });
  esperas.forEach(x=>{ x.dias=dias(x.desde, x.hasta||h); });
  return {intervalos:out, esperas};
}
function plazoFase(I){ if(I.ciclo.fase===6) return null; const p=DB.meta.configuracion.plazos_fase[I.clasificacion.intensidad]; return p? (p[String(I.ciclo.fase)] ?? null) : null; }
function plazoDecision(int){ return DB.meta.configuracion.plazo_decision_dias_habiles[int]; }
function decisionAbierta(I){ return decisionesDe(I).find(d=>!d.fecha_decision) || null; }
function sit(I){
  if(M.cache.has(I.id)) return M.cache.get(I.id);
  const iv=intervalos(I); const ult=iv.intervalos[iv.intervalos.length-1];
  const actual = ult && !ult.hasta ? ult : null;
  const plazo = plazoFase(I);
  const diasFase = actual? actual.dias : null;
  const estancada = !cerrada(I) && I.ciclo.estado!=='registrada' && I.ciclo.estado!=='en_produccion' && plazo!=null && diasFase!=null && diasFase>plazo;
  const dg = decisionAbierta(I);
  const s = {iv, diasFase, plazo, estancada, dg, valor:valorDe(I)};
  s.alertas = alertasDe(I, s);
  M.cache.set(I.id, s); return s;
}
function valorDe(I){
  const vs = M.val.get(I.id)||[];
  const de=(m,tp)=>vs.filter(v=>v.momento===m && v.tipo===tp);
  function neto(m){ const ben=[...de(m,'eficiencias'),...de(m,'retorno')], cos=de(m,'coste_recurrente'); if(!ben.length||!cos.length) return null; if([...ben,...cos].some(v=>v.importe==null)) return null; return sum(ben.map(v=>v.importe))-sum(cos.map(v=>v.importe)); }
  const real=[...de('realizado','eficiencias'),...de('realizado','retorno')].filter(v=>v.importe!=null);
  const tot=sum(real.map(v=>v.importe)); const val=sum(real.filter(v=>v.estado==='validado').map(v=>v.importe));
  const inv=de('esperado','inversion')[0];
  return {esperado:neto('esperado'), realizado:neto('realizado'), pctValidado: real.length&&tot? val/tot*100 : null, inversionEsperada: inv? inv.importe : null, lista:vs};
}
function alertasDe(I, s){
  const A=[]; const h=hoy(); const add=(tipo,sev,texto)=>A.push({tipo,sev,texto,ini:I.id});
  if(s.estancada) add('estancada','alta', t('al_estancada',{d:s.diasFase,f:I.ciclo.fase,p:s.plazo}));
  if(s.dg && s.dg.fecha_solicitud){ const hb=habiles(s.dg.fecha_solicitud,h), pl=plazoDecision(I.clasificacion.intensidad); if(hb>pl) add('decision','alta', t('al_decision',{g:s.dg.gate,d:hb,p:pl})); }
  if(s.dg && s.dg.iteracion>=3) add('elevar', s.dg.elevada?'info':'alta', t(s.dg.elevada?'al_elevada':'al_elevar',{g:s.dg.gate,n:s.dg.iteracion}));
  condicionesDe(I).forEach(c=>{ if(estadoCond(c)==='vencida') add('condicion','alta', t('al_condicion',{id:c.id,c:c.criterio||'',f:fF(c.plazo)})); });
  if(I.ciclo.estado==='en_produccion' && I.ciclo.proxima_revision && I.ciclo.proxima_revision<h) add('revision','alta', t('al_revision',{f:fF(I.ciclo.proxima_revision)}));
  if(I.ciclo.estado==='en_espera' && I.ciclo.espera && I.ciclo.espera.reanudacion_prevista<h) add('espera','media', t('al_espera',{f:fF(I.ciclo.espera.reanudacion_prevista)}));
  if(s.dg){ const pend=(M.evi.get(I.id)||[]).filter(e=>e.gate===s.dg.gate && !e.verificada && e.fecha<=s.dg.fecha_solicitud); if(pend.length) add('evidencias','media', t('al_evidencias',{n:pend.length,g:s.dg.gate})); }
  if(!cerrada(I) && I.ciclo.estado!=='registrada'){ const inc=incompatibilidades(I); if(inc.length) add('roles','alta', t('al_roles')+' '+inc.join(' · ')); }
  DB.no_conformidades.filter(n=>n.iniciativa===I.id && n.estado==='abierta' && n.plazo_accion && n.plazo_accion<h).forEach(n=>add('nc','media', t('al_nc',{id:n.id})));
  return A;
}
function incompatibilidades(I){
  const R=I.responsables, ent=I.clasificacion.intensidad==='enterprise', out=[]; const nom=k=>L('rol',k);
  const eq=(a,b)=>R[a] && R[b] && R[a]===R[b];
  [['patrocinador','riesgos'],['patrocinador','auditor'],['producto','riesgos'],['producto','auditor'],['tecnico','riesgos'],['tecnico','auditor'],['operacion','riesgos'],['operacion','auditor']].forEach(([a,b])=>{ if(eq(a,b)) out.push(nom(a)+' = '+nom(b)); });
  if(ent){ [['patrocinador','producto'],['patrocinador','tecnico'],['patrocinador','operacion'],['riesgos','auditor']].forEach(([a,b])=>{ if(eq(a,b)) out.push(nom(a)+' = '+nom(b)+' (Enterprise)'); }); }
  return out;
}

const CLAVES_FILTRO = ['esfera','ambicion','intensidad','regulatoria','tecnologia','exposicion','tipo_valor','area','estado','fase','proveedor','etiqueta'];
function ambicionDe(I){ return I.clasificacion.ambicion_confirmada || I.clasificacion.ambicion_propuesta || null; }
function filtrar(){
  const F=UI.filtros||{}; const q=(F.q||'').toLowerCase().trim();
  return DB.iniciativas.filter(I=>{
    const c=I.clasificacion;
    if(F.excluir_cerradas && cerrada(I)) return false;
    if(F.esfera && c.esfera_principal!==F.esfera && c.esfera_secundaria!==F.esfera) return false;
    if(F.ambicion && ambicionDe(I)!==F.ambicion) return false;
    if(F.intensidad && c.intensidad!==F.intensidad) return false;
    if(F.regulatoria && c.regulatoria!==F.regulatoria) return false;
    if(F.tecnologia && !(c.tecnologia||[]).includes(F.tecnologia)) return false;
    if(F.exposicion && c.exposicion!==F.exposicion) return false;
    if(F.tipo_valor && !(c.tipo_valor||[]).includes(F.tipo_valor)) return false;
    if(F.area && I.area!==F.area) return false;
    if(F.estado && I.ciclo.estado!==F.estado) return false;
    if(F.fase!=null && F.fase!=='' && String(I.ciclo.fase)!==String(F.fase)) return false;
    if(F.proveedor && !(c.proveedores||[]).includes(F.proveedor)) return false;
    if(F.etiqueta && !(I.etiquetas_libres||[]).includes(F.etiqueta)) return false;
    if(F.solo_alertas && !sit(I).alertas.some(a=>a.sev!=='info')) return false;
    if(q && !(I.id+' '+I.nombre+' '+(I.descripcion||'')).toLowerCase().includes(q)) return false;
    return true; });
}

  h+='<table class="tabla resp"><thead><tr><th scope="col">'+esc(t('codigo'))+'</th><th scope="col">'+esc(t('iniciativa'))+'</th><th scope="col">'+esc(t('fase'))+'</th><th scope="col">'+esc(t('estado'))+'</th><th scope="col">'+esc(t('dias_fase'))+'</th><th scope="col">'+esc(t('ambicion'))+' · '+esc(t('intensidad'))+'</th><th scope="col" class="num">'+esc(t('valor_esp'))+'</th><th scope="col">'+esc(t('alertas'))+'</th></tr></thead><tbody>';
  ord.forEach(I=>{ const s=sit(I);
    h+='<tr><td data-l="'+esc(t('codigo'))+'" class="mono">'+esc(I.id)+'</td><td data-l="'+esc(t('iniciativa'))+'">'+enlaceIni(I)+'<br><span class="ayuda">'+esc(I.area)+'</span></td><td data-l="'+esc(t('fase'))+'">'+esc(faseTxt(I.ciclo.fase))+'</td><td data-l="'+esc(t('estado'))+'">'+estadoEt(I)+(s.dg?' <span class="ayuda">'+esc(s.dg.gate)+'</span>':'')+'</td><td data-l="'+esc(t('dias_fase'))+'">'+diasTxt(I)+'</td><td data-l="'+esc(t('ambicion'))+'">'+(ambicionDe(I)?esc(L('ambicion',ambicionDe(I))):sd())+' · '+esc(L('intensidad',I.clasificacion.intensidad))+'</td><td data-l="'+esc(t('valor_esp'))+'" class="num">'+fE(s.valor.esperado)+'</td><td data-l="'+esc(t('alertas'))+'">'+alertasEt(I)+'</td></tr>'; });
  h+='</tbody></table>';
  return h;
}

/* ---------------- vista: tablero ---------------- */
function vistaTablero(){
  const lista=filtrar();
  let h='<div class="cab-ficha"><h1>'+esc(t('v_tablero'))+'</h1><button type="button" class="primario" data-acc="nueva">'+esc(t('nueva'))+'</button></div>'+filtrosHTML()+'<p class="ayuda">'+esc(t('tab_sub'))+'</p><div class="tablero">';
  const cols=[0,1,2,3,4,5,6,7].map(f=>({tit:t('fase')+' '+f, sub:L('fase',f), items:lista.filter(i=>!cerrada(i)&&i.ciclo.fase===f)}));
  cols.push({tit:t('cerradas'), sub:L('estado','parada')+' · '+L('estado','retirada'), items:lista.filter(cerrada)});
  cols.forEach((c,ci)=>{
    h+='<section class="col" aria-labelledby="col-'+ci+'"><h3 id="col-'+ci+'">'+esc(c.tit)+' ('+c.items.length+')<small>'+esc(c.sub)+'</small></h3>';
    if(!c.items.length) h+='<p class="ayuda">'+esc(t('sin_iniciativas'))+'</p>';
    c.items.forEach(I=>{ const s=sit(I); const al=s.alertas.filter(a=>a.sev!=='info');
      const cls = cerrada(I)?'fin':(al.length?'alerta':(I.ciclo.fase>=6?'prod':''));
      h+='<article class="tarjeta '+cls+'"><span class="mono">'+esc(I.id)+'</span><a class="tit" href="#/ficha/'+esc(I.id)+'">'+esc(I.nombre)+'</a>'+
        '<div class="fila">'+estadoEt(I)+(ambicionDe(I)?et(L('ambicion',ambicionDe(I))):'')+et(L('intensidad',I.clasificacion.intensidad))+'</div>'+
        '<div class="ayuda" style="margin-top:4px">'+diasTxt(I)+'</div>'+
        (s.dg?'<div class="ayuda">'+esc(gateTxt(s.dg.gate))+' · '+esc(t('iteracion'))+' '+s.dg.iteracion+'</div>':'')+
        (al.length?'<div class="fila" style="margin-top:4px">'+al.map(a=>et(t('at_'+a.tipo),a.sev==='alta'?'ko':'med')).join('')+'</div>':'')+
        (!cerrada(I)?'<div class="fila" style="margin-top:6px"><a class="btn" href="#/ficha/'+esc(I.id)+'/gate">'+esc(t('gestionar_gate'))+' '+esc(GATE_DE_FASE[I.ciclo.fase])+'</a></div>':'')+'</article>'; });
    h+='</section>'; });
  return h+'</div>';
}

const RESULTADOS = {G0:['continuar','continuar_condiciones','iterar','parar'],G1:['continuar','continuar_condiciones','iterar','pivotar','parar'],G2:['continuar','continuar_condiciones','iterar','pivotar','parar'],G3:['continuar','continuar_condiciones','iterar','pivotar','parar'],G4:['continuar','continuar_condiciones','iterar','parar'],G5:['continuar','continuar_condiciones','iterar','parar'],R6:['continuar_operacion','continuar_condiciones','adelantar_g7'],G7:['escalar','iterar','retirar']};
const CRITERIOS_T04 = ['alto_riesgo','decisiones_personas','exposicion_directa','agentes_actuar','datos_protegidos','funcion_critica','transformar','inversion'];
function ctxGate(I, dg){ const c=I.clasificacion; return {intensidad: dg && dg.fecha_decision? dg.intensidad : c.intensidad, ambicion: ambicionDe(I), tecnologia:c.tecnologia||[], autonomia:c.autonomia, proveedores:c.proveedores||[], propuesto: dg? (dg.resultado || dg.resultado_propuesto || null) : null}; }
function aplicable(c, ctx){
  const col = ctx.intensidad==='lite'? c.l : c.n;
  if(col==='na') return UI.lang==='en'?'Does not apply at Lite intensity (document 21).':'No aplica en intensidad Lite (documento 21).';
  if(c.s.includes('GEN') && !ctx.tecnologia.some(x=>x==='ia_generativa'||x==='agente')) return UI.lang==='en'?'[GEN] The registered technology is neither generative AI nor an agent.':'[GEN] La tecnología registrada no es IA generativa ni agente.';
  if(c.s.includes('AG') && (!ctx.autonomia || ctx.autonomia==='A0')) return UI.lang==='en'?'[AG] Approved autonomy level A0.':'[AG] Nivel de autonomía aprobado A0.';
  if(c.s.includes('TER') && !ctx.proveedores.length) return UI.lang==='en'?'[TER] No AI suppliers registered.':'[TER] Sin proveedores de IA registrados.';
  if(c.s.includes('TRANSFORMAR') && ctx.ambicion!=='transformar') return UI.lang==='en'?'Only applies to Transform.':'Solo aplica a Transformar.';
  const p = ctx.propuesto;
  if(p){ if(c.s.includes('ESCALAR') && p!=='escalar') return UI.lang==='en'?'Proposed outcome is not Scale.':'Resultado propuesto distinto de Escalar.';
    if(c.s.includes('RETIRAR') && p!=='retirar') return UI.lang==='en'?'Proposed outcome is not Retire.':'Resultado propuesto distinto de Retirar.';
    if(c.s.includes('ITERAR') && p!=='iterar') return UI.lang==='en'?'Proposed outcome is not Iterate.':'Resultado propuesto distinto de Iterar.'; }
  return null;
}
function obligDe(c, int){ const col = int==='lite'? c.l : c.n; return col==='rec'? 'recomendado' : c.o; }
function estadoCrit(dg, cod){ const r=(dg.criterios||[]).find(x=>x.codigo===cod); return r? r.estado : 'pendiente'; }
function evaluar(dg, I, propuesto){
  const ctx=ctxGate(I,dg); if(propuesto!==undefined) ctx.propuesto=propuesto;
  const r={aplicables:0,cumple:0,bloq:[],cond:[],rec:[],filas:[]};
  CAT.filter(c=>c.g===dg.gate).forEach(c=>{
    const auto=aplicable(c,ctx); const reg=(dg.criterios||[]).find(x=>x.codigo===c.c)||{codigo:c.c,estado:'pendiente'};
    let est = auto? 'no_aplica' : reg.estado; const ob=obligDe(c,ctx.intensidad);
    let efectivo = est; if(est==='no_aplica' && !auto && !(reg.justificacion||'').trim()) efectivo='no_cumple';
    r.filas.push({c, reg, auto, est, efectivo, ob});
    if(efectivo==='no_aplica') return;
    r.aplicables++; if(efectivo==='cumple'){ r.cumple++; return; }
    if(ob==='si'||ob==='si_critico') r.bloq.push(c.c); else if(ob==='condicionable') r.cond.push(c.c); else r.rec.push(c.c);
  });
  r.grado = r.aplicables? r.cumple/r.aplicables*100 : null;
  return r;
}
function permitidos(dg, I, o){
  o=o||{}; const ev=evaluar(dg,I,o.propuesto); const out=[];
  const verOk = dg.resultado_verificacion==='conforme' || dg.resultado_verificacion==='conforme_observaciones';
  const vencidas = condicionesDe(I).filter(c=>estadoCond(c)==='vencida');
  const prohibida = dg.gate==='G3' && (estadoCrit(dg,'G3.08')==='no_cumple' || I.clasificacion.regulatoria==='prohibido');
  const fs = o.firmas||dg.firmas||[];
  const firmasMal = dg.gate==='G5' && I.clasificacion.intensidad==='enterprise' && (fs.length<4 || fs.some(f=>f.sentido!=='conforme'));
  RESULTADOS[dg.gate].forEach(res=>{
    let m=null; const continua=['continuar','continuar_operacion','escalar'].includes(res);
    if(!verOk) m=t('m_sin_verif');
    else if(dg.iteracion>=3 && !o.elevada) m=t('m_elevar');
    else if(prohibida && res!=='parar') m=t('m_prohibida');
    else if(dg.gate==='R6' && o.desviacion && res!=='adelantar_g7') m=t('m_desviacion');
    else if(continua || res==='continuar_condiciones'){
      if(ev.bloq.length) m=t('m_bloq',{n:ev.bloq.length});
      else if(continua && ev.cond.length) m=t('m_cond');
      else if(res==='continuar_condiciones' && !ev.cond.length) m=t('m_sin_cond');
      else if(vencidas.length) m=t('m_vencidas');
      else if(dg.gate==='G5' && I.clasificacion.intensidad==='enterprise' && firmasMal) m=t('m_firmas');
    }
    out.push({res, ok:!m, motivo:m});
  });
  return {lista:out, ev};
}

  if(dg.gate==='G7') h+='<p class="ayuda" data-para="escalar" hidden>'+esc(t('escalar_nueva'))+'</p>';
