  if(d.meta && d.meta.fecha_referencia!=null && !esFecha(d.meta.fecha_referencia)) err(x('meta.fecha_referencia no es una fecha AAAA-MM-DD.','meta.fecha_referencia is not a YYYY-MM-DD date.'));
  ['personas','iniciativas','eventos','decisiones_gate','condiciones','evidencias','valores'].forEach(k=>{ if(!Array.isArray(d[k])) err(k+x(' debe ser una lista.',' must be a list.')); });
  if(E.length) return {errores:E, avisos:A};

  d.personas.forEach((p,i)=>{ if(!/^PER-\d{2,4}$/.test(p.id||'')) err('personas['+i+'].'+NOC('PER-NN','PER-NN')); if(!p.nombre) err('personas['+i+'].nombre'+x(' vacío.',' is empty.')); });

    if(!/^IA-\d{4}-\d{3}$/.test(I.id||'')) err(w+NOC('IA-AAAA-NNN','IA-YYYY-NNN')); if(ini.has(I.id)) err(w+x('id duplicado.','duplicate id.')); ini.add(I.id);
    if(!I.nombre) err(w+'nombre'+x(' vacío.',' is empty.')); if(!esFecha(I.fecha_registro)) err(w+'fecha_registro'+FNV);
    const c=I.clasificacion||{}; if(!I.clasificacion) { err(w+x('falta clasificacion.','clasificacion is missing.')); return; }
    if(!ENUM.esfera.includes(c.esfera_principal)) err(w+'esfera_principal'+FL);
    if(c.esfera_secundaria!=null && !ENUM.esfera.includes(c.esfera_secundaria)) err(w+'esfera_secundaria'+FL);
    ['ambicion_propuesta','ambicion_confirmada','ambicion_real'].forEach(k=>{ if(c[k]!=null && !ENUM.ambicion.includes(c[k])) err(w+k+FL); });
    if(!ENUM.intensidad.includes(c.intensidad)) err(w+'intensidad'+FL); if(!ENUM.regulatoria.includes(c.regulatoria)) err(w+x('clasificación regulatoria fuera de la lista.','regulatory classification (regulatoria) not in the closed list.'));
    if(!Array.isArray(c.tecnologia) || !c.tecnologia.length || c.tecnologia.some(v=>!ENUM.tecnologia.includes(v))) err(w+x('tecnologia vacía o fuera de la lista.','tecnologia is empty or not in the closed list.'));
    if(!ENUM.exposicion.includes(c.exposicion)) err(w+'exposicion'+FL);
    if(c.autonomia!=null && !ENUM.autonomia.includes(c.autonomia)) err(w+'autonomia'+FL);
    (c.tipo_valor||[]).forEach(v=>{ if(!ENUM.tipo_valor.includes(v)) err(w+x('tipo_valor fuera de la lista: ','tipo_valor not in the closed list: ')+v); });
    if(!I.ciclo || !Number.isInteger(I.ciclo.fase) || I.ciclo.fase<0 || I.ciclo.fase>7) err(w+x('ciclo.fase debe ser un entero 0–7.','ciclo.fase must be an integer 0–7.'));
    if(!I.ciclo || !ENUM.estado.includes(I.ciclo.estado)) err(w+'ciclo.estado'+FL);

    if(I.ciclo && I.ciclo.estado==='en_espera' && !(I.ciclo.espera && esFecha(I.ciclo.espera.reanudacion_prevista))) err(w+x('en espera sin motivo ni fecha prevista de reanudación.','on hold without a reason or planned resumption date.'));
    if(I.cierre && !ENUM.motivo.includes(I.cierre.motivo)) err(w+x('motivo de cierre fuera de la lista.','closure reason (cierre.motivo) not in the closed list.'));
    if(I.ciclo && ['parada','retirada'].includes(I.ciclo.estado) && !I.cierre) err(w+x('parada o retirada sin cierre con motivo codificado.','stopped or retired without a closure record with a coded reason.'));
    if(!I.responsables) err(w+x('faltan responsables.','responsables is missing.')); else Object.keys(I.responsables).forEach(k=>{ const v=I.responsables[k]; if(v && !per.has(v)) A.push(w+x('responsable '+k+' no está en personas: ','owner '+k+' is not in personas: ')+v); });
  });
  d.eventos.forEach((e,i)=>{ const w='eventos['+i+'] '+(e&&e.id||'')+': '; if(!/^EVT-\d{6}$/.test(e.id||'')) err(w+NOC('EVT-NNNNNN','EVT-NNNNNN')); if(!ENUM.evento.includes(e.tipo)) err(w+'tipo'+FL); if(!esFecha(e.fecha)) err(w+'fecha'+FNV); if(!e.autor) err(w+x('sin autor.','no author.')); if(!e.motivo) err(w+x('sin motivo.','no reason.')); if(!e.iniciativa && !e.sistema) err(w+x('sin iniciativa ni sistema.','no initiative or system.')); if(e.iniciativa && !ini.has(e.iniciativa)) A.push(w+x('iniciativa inexistente ','unknown initiative ')+e.iniciativa); });
  d.decisiones_gate.forEach((g,i)=>{ const w='decisiones_gate['+i+'] '+(g&&g.id||'')+': '; if(!/^DG-\d{4}-\d{3}$/.test(g.id||'')) err(w+NOC('DG-AAAA-NNN','DG-YYYY-NNN')); if(!ENUM.gate.includes(g.gate)) err(w+'gate'+FL); if(!ini.has(g.iniciativa)) err(w+x('iniciativa inexistente.','unknown initiative.')); if(!esFecha(g.fecha_solicitud)) err(w+'fecha_solicitud'+FNV); if(g.resultado!=null && !ENUM.resultado.includes(g.resultado)) err(w+'resultado'+FL);
    if(g.resultado && ENUM.gate.includes(g.gate) && !RESULTADOS[g.gate].includes(g.resultado)) err(w+x('resultado '+g.resultado+' no admitido en '+g.gate+'.','outcome '+g.resultado+' is not permitted at '+g.gate+'.'));
    if(!Array.isArray(g.criterios)) err(w+x('criterios debe ser una lista.','criterios must be a list.')); else g.criterios.forEach(c=>{ if(!/^(G[0-57]|R6)\.\d{2}$/.test(c.codigo||'')) err(w+x('código de criterio no válido: ','invalid criterion code: ')+c.codigo); if(!ENUM.crit.includes(c.estado)) err(w+x('estado de criterio no válido: ','invalid criterion status: ')+c.estado); }); });
  d.condiciones.forEach((c,i)=>{ const w='condiciones['+i+'] '+(c&&c.id||'')+': '; if(!/^CND-\d{4}-\d{3}$/.test(c.id||'')) err(w+NOC('CND-AAAA-NNN','CND-YYYY-NNN')); if(!esFecha(c.plazo)) err(w+x('sin plazo.','no deadline.')); if(!c.responsable) err(w+x('sin responsable.','no owner.')); if(!ENUM.cond.includes(c.estado)) err(w+'estado'+FL); });
  d.valores.forEach((v,i)=>{ const w='valores['+i+'] '+(v&&v.id||'')+': '; if(!['esperado','realizado'].includes(v.momento)) err(w+'momento'+FL); if(!ENUM.tipo_imp.includes(v.tipo)) err(w+'tipo'+FL); if(!ENUM.importe.includes(v.estado)) err(w+'estado'+FL); if(!(v.importe===null || typeof v.importe==='number')) err(w+x('importe debe ser número o null (sin dato).','importe must be a number or null (no data).'));
    if(v.concepto!=null && !((LB.es['concepto_'+v.tipo]||{})[v.concepto])) err(w+'concepto'+FL);
    if(v.area!=null && typeof v.area!=='string') err(w+'area'+x(' debe ser un texto o null.',' must be a string or null.')); });
  /* bloque opcional «alcance» de cada iniciativa (esquema 0.3): iniciativas transversales y plataformas habilitadoras */
  d.iniciativas.forEach((I,i)=>{ const a=I&&I.alcance; if(a==null) return; const w='iniciativas['+i+'] '+(I.id||'')+': alcance.';
    if(typeof a!=='object' || Array.isArray(a)){ err(w.slice(0,-1)+x(' debe ser un objeto o null.',' must be an object or null.')); return; }
    if(!LB.es.alcance[a.tipo]) err(w+'tipo'+FL);

    if(a.habilita!=null && !Array.isArray(a.habilita)) err(w+'habilita'+x(' debe ser una lista.',' must be a list.')); else (a.habilita||[]).forEach(id=>{ if(!ini.has(id)) A.push(w+'habilita'+x(': iniciativa inexistente ',': unknown initiative ')+id); });
    if(a.reparto!=null && !Array.isArray(a.reparto)) err(w+'reparto'+x(' debe ser una lista.',' must be a list.'));
    else (a.reparto||[]).forEach((u,j)=>{ const wu=w+'reparto['+j+'].'; if(!u || typeof u!=='object'){ err(wu.slice(0,-1)+x(' debe ser un objeto.',' must be an object.')); return; }

      ['desde','fecha_dato'].forEach(k=>{ if(u[k]!=null && !esFecha(u[k])) err(wu+k+FNV); }); }); });
  /* bloque opcional «panel» de cada iniciativa (esquema 0.2): datos para el panel del consejo */
  d.iniciativas.forEach((I,i)=>{ const p=I&&I.panel; if(p==null) return; const w='iniciativas['+i+'] '+(I.id||'')+': panel.';

}

/* El JSON del panel del consejo (T17) no se construye aquí: lo genera el conector t01_a_panel.py a partir del JSON completo de este registro
   (una sola correspondencia T01 → panel, documentada en el README de T17). El registro es la entrada de datos; el panel, su lectura para el consejo. */

/* Fusión de dos registros completos: las entidades se unen por su código (si coincide, prevalece la del segundo); meta es la del primero, con las áreas de ambos.
   Permite cargar el registro en varios JSON (por ejemplo, uno por área o por periodo) y reconstruir con ellos el panel del consejo. */
const LISTAS_REGISTRO = ['personas','iniciativas','sistemas','eventos','decisiones_gate','condiciones','evidencias','valores','riesgos','no_conformidades','incidentes','proveedores','recomendaciones','decisiones_consejo'];
function fusionarRegistros(a, b){ const r=JSON.parse(JSON.stringify(a));
  LISTAS_REGISTRO.forEach(k=>{ const m=new Map((r[k]||[]).map(x=>[x.id,x])); (b[k]||[]).forEach(x=>m.set(x.id,x)); r[k]=[...m.values()].sort((x,y)=>String(x.id)<String(y.id)?-1:1); });
  r.meta=Object.assign({}, r.meta, {areas:[...new Set([...((r.meta||{}).areas||[]), ...((b.meta||{}).areas||[])])].sort()}); return r; }

function onAccionExtra(acc, b){
  if(onAccionRiesgos(acc, b)) return;
  if(onAccionIndice(acc, b)) return;
  switch(acc){
    case 'exp-json': descargar('T01_registro_'+hoy()+'.json', JSON.stringify(conAvisoLegal(DB),null,2), 'application/json'); return;
    case 'aviso-legal': abrirLegal(); return;
    case 'legal-cerrar': cerrarLegal(); return;
    case 'legal-lang': UI.lang = UI.lang==='en'? 'es' : 'en'; guardarUI(); render(); abrirLegal(); return;
    case 'exp-csv': exportarCSV(); return;
    case 'sistema': abrirSistema(b.dataset.id? M.sis.get(b.dataset.id) : null); return;
    case 'importar': case 'fusionar': { const inp=$('#dt-fichero'); const out=$('#dt-imp-res'); const fs=[...(inp.files||[])]; if(!fs.length){ out.innerHTML='<p class="errores">'+esc(t('dt_sin_fichero'))+'</p>'; return; }
      const ko=m=>{ out.innerHTML='<p class="errores">'+esc(m)+'</p>'; };
      Promise.all(fs.map(x=>x.text().then(txt=>{ try{ return JSON.parse(txt); }catch(err){ throw new Error(x.name+': '+t('dt_json_mal',{e:err.message})); } }))).then(ds=>{
        /* cada fichero debe ser un registro válido por sí mismo; después se fusionan por código (el último fichero prevalece) y se valida el resultado */
        for(let i=0;i<ds.length;i++){ const v=validar(ds[i]); if(v.errores.length){ out.innerHTML='<div class="aviso ko"><b>'+esc(fs[i].name+' · '+t('dt_imp_err'))+'</b><ul>'+v.errores.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'; return; } }
        let d = acc==='fusionar'? JSON.parse(JSON.stringify(DB)) : ds.shift(); ds.forEach(x=>{ d=fusionarRegistros(d,x); });
        const v=validar(d); if(v.errores.length){ out.innerHTML='<div class="aviso ko"><b>'+esc(t('dt_imp_err'))+'</b><ul>'+v.errores.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'; return; }
        abrirDialogo(t(acc==='fusionar'?'dt_fusionar':'dt_importar'), '<p>'+esc(t(acc==='fusionar'?'dt_fus_conf':'dt_imp_conf',{a:DB.iniciativas.length,b:d.iniciativas.length,n:fs.length}))+'</p>'+(v.avisos.length?'<p><b>'+esc(t('dt_imp_avisos'))+'</b></p><ul>'+v.avisos.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''), ()=>{ DB=normalizar(d); indexar(); toast(t('dt_imp_ok',{n:d.iniciativas.length})); return []; }, t('confirmar'));
      }).catch(err=>ko(err.message||t('dt_json_mal',{e:t('lectura')}))); return; }
    case 'restaurar': abrirDialogo(t('dt_restaurar'), '<p>'+esc(t('dt_conf_rest'))+'</p>', ()=>{ DB=normalizar(JSON.parse(DEMO_TXT)); indexar(); SevengDatos.reiniciar('demo'); toast(t('dt_ok_rest')); return []; }, t('confirmar')); return;
    case 'borrar-local': abrirDialogo(t('dt_borrar'), '<p>'+esc(t('dt_conf_rest'))+'</p>', ()=>{ lsDel(LS_DATOS); DB=normalizar(JSON.parse(DEMO_TXT)); indexar(); SevengDatos.reiniciar('demo'); toast(t('dt_ok_rest')); setTimeout(()=>lsDel(LS_DATOS),0); return []; }, t('confirmar')); return;
    case 'persona': abrirDialogo(t('dlg_persona'), '<div class="rejilla">'+campo('pe-nom',t('nombre'),'<input type="text" id="pe-nom" name="pe-nom">')+campo('pe-car',t('cargo'),'<input type="text" id="pe-car" name="pe-car">')+campo('pe-area',t('area'),'<input type="text" id="pe-area" name="pe-area">')+campo('pe-org',t('organo_p'),'<select id="pe-org" name="pe-org">'+opts('organo_p','','—')+'</select>')+'</div>', f=>{ const n=f['pe-nom'].value.trim(); if(n.length<2) return [t('e_nombre')]; DB.personas.push({id:nextId(DB.personas,'PER-',2), nombre:n, cargo:f['pe-car'].value.trim(), area:f['pe-area'].value.trim(), organo:f['pe-org'].value||null}); return []; }); return;
    case 'proveedor': abrirDialogo(t('dlg_prov'), '<div class="rejilla">'+campo('pv-nom',t('nombre'),'<input type="text" id="pv-nom" name="pv-nom">')+campo('pv-ser',t('servicios'),'<input type="text" id="pv-ser" name="pv-ser">')+campo('pv-exi',t('exigencia'),'<select id="pv-exi" name="pv-exi"><option>N1</option><option selected>N2</option><option>N3</option></select>')+'</div>', f=>{ const n=f['pv-nom'].value.trim(); if(n.length<2) return [t('e_nombre')]; DB.proveedores.push({id:nextId(DB.proveedores,'PRV-',3), nombre:n, servicios:f['pv-ser'].value.trim(), exigencia:f['pv-exi'].value, contrato:null, fecha_evaluacion:null, resultado_evaluacion:'pendiente'}); return []; }); return;

/* validación de los campos del esquema 0.5 (solo si existen) */
function validarIndice(d, ini, err, x, FL, FNV){
  const V=['pendiente','verificada','no_verificada'], G=['G2','G5','R6','G7'];
  d.iniciativas.forEach((I,i)=>{ const X=I.indice; if(X==null) return; const w='iniciativas['+i+'] '+(I.id||'')+'.indice';
    if(typeof X!=='object'||Array.isArray(X)){ err(w+x(' debe ser un objeto.',' must be an object.')); return; }
    ['itp2','itp3'].forEach(k=>{ const v=X[k]; if(v==null) return; if(!V.includes(v.estado)) err(w+'.'+k+'.estado'+FL); if(v.gate!=null && !G.includes(v.gate)) err(w+'.'+k+'.gate'+FL); if(v.fecha!=null && !esFecha(v.fecha)) err(w+'.'+k+'.fecha'+FNV); });
    const c=X.capacidad; if(c){ ['horas_liberadas','horas_materializadas','horas_reasignadas','roles_redisenados'].forEach(k=>{ if(c[k]!=null && !(typeof c[k]==='number' && c[k]>=0)) err(w+'.capacidad.'+k+x(' debe ser un número no negativo.',' must be a non-negative number.')); }); } });
  (d.valores||[]).forEach((v,i)=>{ if(v.oferta_habilitada_ia!=null && typeof v.oferta_habilitada_ia!=='boolean') err('valores['+i+'].oferta_habilitada_ia'+x(' debe ser verdadero o falso.',' must be true or false.')); });
  if(d.decisiones_consejo!=null && !Array.isArray(d.decisiones_consejo)) { err('decisiones_consejo'+x(' debe ser una lista.',' must be a list.')); return; }
  (d.decisiones_consejo||[]).forEach((D,i)=>{ const w='decisiones_consejo['+i+'] '+(D.id||'')+': ';
    if(!/^DEC-\d{4}-\d{3}$/.test(D.id||'')) err(w+x('id no cumple DEC-AAAA-NNN.','id does not match DEC-YYYY-NNN.')); if(!esFecha(D.fecha)) err(w+'fecha'+FNV);
    if(!LB.es.dec_asunto[D.asunto]) err(w+'asunto'+FL); if(D.tipo!=null && !LB.es.dec_tipo[D.tipo]) err(w+'tipo'+FL); if(D.resultado!=null && !LB.es.dec_resultado[D.resultado]) err(w+'resultado'+FL); if(D.decision_etapa!=null && !LB.es.dec_etapa[D.decision_etapa]) err(w+'decision_etapa'+FL);
    (D.iniciativas||[]).forEach(id=>{ if(!ini.has(id)) err(w+x('iniciativa inexistente ','unknown initiative ')+id); });
    (D.esferas_transformar||[]).forEach(e=>{ if(!/^0[1-7]$/.test(e)) err(w+'esferas_transformar'+FL); }); });
}

function sitioNav(){
  const n = document.getElementById('sitio-nav'); if(!n) return; const en = UI.lang === 'en', l = en ? 'en' : 'es';
  const e = [[en ? '../../../en/index.html' : '../../../index.html', en ? '⌂ Home' : '⌂ Portada'], ['../../html/'+l+'/00_SEVEN-G_Que_es_y_para_que_sirve.html', en ? 'What SEVEN-G is' : 'Qué es SEVEN-G'], ['../../html/'+l+'/index.html', en ? 'Library' : 'Biblioteca'], ['../../html/'+l+'/curso/M00_SEVEN-G_Curso_Guia_del_curso.html', en ? 'Course' : 'Curso'], ['../T01_registro_iniciativas/registro.html', en ? 'Initiative register' : 'Registro de iniciativas'], ['../T17_panel_consejo/index.html', en ? 'Board dashboard' : 'Panel del consejo']];
  n.setAttribute('aria-label', en ? 'Site' : 'Sitio');
  n.innerHTML = '<span class="sitio-marca" style="color:var(--papel)">SEVEN-G</span>' + e.map(x => '<a href="'+x[0]+'">'+x[1]+'</a>').join('') + '<span data-ir-codigo style="margin-left:auto"></span>';
  irCodigoCargar(l);
}function aplicarTema(){ temaSitioInicial(); const r=document.documentElement; if(UI.tema==='claro'||UI.tema==='oscuro'||UI.tema==='salmon') r.setAttribute('data-theme',UI.tema); else r.removeAttribute('data-theme'); }
function cabecera(r){
  document.documentElement.lang = UI.lang;
  $('#txt-app').textContent=t('app'); $('#saltar').textContent=t('saltar'); $('#lbl-lang').textContent=t('idioma'); $('#lbl-tema').textContent=t('tema');
  $('#sel-lang').value=UI.lang; const st=$('#sel-tema'); st.options[0].text=t('t_auto'); st.options[1].text=(UI.lang==='en'?'Salmon':'Salmón'); st.options[2].text=t('t_claro'); st.options[3].text=t('t_oscuro'); sitioNav(); st.value=UI.tema;
  $('#nav').setAttribute('aria-label',t('vistas'));
  const nAl=todasAlertas().filter(a=>a.sev==='alta').length;
  $('#nav').innerHTML = VISTAS.map(v=>'<a href="#/'+v+'"'+(r.vista===v?' aria-current="page"':'')+'>'+esc(t('v_'+v))+(v==='alertas'&&nAl?'<span class="cuenta" aria-label="'+nAl+'">'+nAl+'</span>':'')+'</a>').join('');
  const demo=!!DB.meta.datos_ilustrativos;
  $('#aviso-demo').innerHTML = demo? '<div><b>'+esc(t('demo_tit'))+'</b> '+esc(t('demo',{f:fF(hoy()).replace(/<[^>]+>/g,'')}))+' '+esc(DB.meta.organizacion)+' · <a href="'+PANEL_DEMO+'">'+esc(t('demo_panel'))+'</a></div>' : '';
  const lp=$('#lnk-panel'); lp.textContent=t(demo?'lnk_panel_demo':'lnk_panel'); lp.href=demo?PANEL_DEMO:PANEL_T17;
  $('#btn-legal').textContent=t('legal_link');
  $('#pie').innerHTML='<p class="pie-legal"><b>'+esc(t('legal_tit'))+'.</b> '+esc(t('legal_txt'))+' <button type="button" class="enlace-btn" data-acc="aviso-legal" aria-haspopup="dialog">'+esc(t('legal_link'))+'</button></p><span>'+esc(t('pie_lic'))+'</span><span>'+esc(t('pie_priv'))+'</span>';
  if(window.SevengDatos) SevengDatos.refrescar();
}
function render(enfocar){
  const activo=document.activeElement && document.activeElement.id;
  indexar(); const r=ruta(); cabecera(r);
  let h='';
  try{
    switch(r.vista){
      case 'tablero': h=vistaTablero(); break;
      case 'ficha': h=typeof vistaFicha==='function'? vistaFicha(r) : ''; break;
      case 'gates': h=typeof vistaGates==='function'? vistaGates() : ''; break;
      case 'alertas': h=typeof vistaAlertas==='function'? vistaAlertas() : ''; break;
      case 'riesgos': h=vistaRiesgos(); break;
      case 'consejo': h=vistaConsejo(); break;
      case 'analisis': h=typeof vistaAnalisis==='function'? vistaAnalisis() : ''; break;
      case 'inventario': h=typeof vistaInventario==='function'? vistaInventario() : ''; break;
      case 'datos': h=typeof vistaDatos==='function'? vistaDatos() : ''; break;
      default: h=vistaEmbudo();
    }
  }catch(e){ h='<div class="aviso ko" role="alert">Error: '+esc(e.message)+'</div>'; console.error(e); }
  const main=$('#principal'); main.innerHTML=h;
  document.title = t('app') + (r.vista==='ficha'&&r.id? ' · '+r.id : ' · '+t('v_'+(VISTAS.includes(r.vista)?r.vista:'embudo')));
  if(enfocar){ const h1=main.querySelector('h1'); if(h1){ h1.setAttribute('tabindex','-1'); h1.focus(); } }
  else if(activo){ const el=document.getElementById(activo); if(el && main.contains(el)) el.focus(); }
}
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.id==='sel-lang'){ UI.lang=el.value; guardarUI(); render(); return; }
  if(el.id==='sel-tema'){ UI.tema=el.value; temaSitioGuardar(el.value); aplicarTema(); guardarUI(); return; }
  if(el.dataset.filtro && el.type!=='search'){ const k=el.dataset.filtro; if(el.type==='checkbox'){ UI.filtros[k] = el.dataset.invertir? !el.checked : el.checked; } else UI.filtros[k]=el.value; guardarUI(); render(); return; }
  if(el.dataset.accChange==='orden'){ UI.orden=el.value; guardarUI(); render(); return; }
  if(typeof onChangeExtra==='function') onChangeExtra(e);
});
document.addEventListener('input', e=>{ const el=e.target; if(el.dataset && el.dataset.filtro==='q'){ UI.filtros.q=el.value; clearTimeout(render._q); render._q=setTimeout(()=>{ guardarUI(); render(); },250); } });
document.addEventListener('toggle', e=>{ if(e.target.id==='det-filtros'){ UI.filtrosAbiertos=e.target.open; guardarUI(); } }, true);
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-acc]'); if(!b) return;
  const acc=b.dataset.acc;
  if(acc==='limpiar-filtros'){ UI.filtros={}; guardarUI(); render(); return; }
  if(acc==='emb-fase' || acc==='emb-todas'){ UI.embFase = acc==='emb-todas' || String(UI.embFase)===b.dataset.fase ? null : b.dataset.fase; render(); const l=document.getElementById('emb-lista'); if(l && UI.embFase!=null) l.scrollIntoView({block:'nearest', behavior:'smooth'}); return; }
  if(typeof onAccion==='function') onAccion(acc, b, e);
});
window.addEventListener('hashchange', ()=>render(true));
cargar(); aplicarTema(); render();
/* D101: dónde viven los datos (este navegador, un fichero del equipo o la carpeta de datos de la copia de la compañía) */
SevengDatos.iniciar({codigo:'T01', ficheroServidor:'../datos/T01_registro.json', cargadoDeDemo:CARGA_DEMO,
  obtener:()=>DB, exportar:()=>conAvisoLegal(DB), aplicar:d=>{ DB=normalizar(d); indexar(); guardar(); render(); },
  validar:d=>{ try{ return !!d && typeof d==='object' && Array.isArray(d.iniciativas) && !validar(d).errores.length; }catch(e){ return false; } },
  esDemo:()=>!!(DB.meta&&DB.meta.datos_ilustrativos), idioma:()=>UI.lang, aviso:toast, nombreFichero:()=>'T01_registro_'+hoy()+'.json',
  ayudaHref:()=>'../../html/'+(UI.lang==='en'?'en':'es')+'/03_SEVEN-G_Herramientas_y_registro_de_iniciativas.html#'+(UI.lang==='en'?'2-1-where-the-data-of-the-tools-lives':'2-1-donde-viven-los-datos-de-las-herramientas')});
if(lsGet(LS_LEGAL)!=='1') abrirLegal();
</script>
